kind: AplApp
metadata:
    name: penpot
spec:
    enabled: true
    persistence:
        size: 5Gi
    resources:
        backend:
            limits: {cpu: '1', memory: 1Gi}
            requests: {cpu: 100m, memory: 256Mi}
        frontend:
            limits: {cpu: 500m, memory: 512Mi}
            requests: {cpu: 50m, memory: 128Mi}
        exporter:
            limits: {cpu: 500m, memory: 512Mi}
            requests: {cpu: 100m, memory: 128Mi}
