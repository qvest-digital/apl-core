# Seed the platform with demo teams/users/workloads by calling apl-api directly -- an explicit
# opt-in step run AFTER `task setup` has completed, never part of it. See the approved plan at
# the time this was written for the full research behind these choices (apl-api is a thin
# git-backed CRUD API; Console -> apl-api -> git values repo -> operator/apl-tasks/ArgoCD
# reconcile the real side effects; apl-api itself only checks that a request carries a valid
# Keycloak-issued OIDC JWT, it does not care whether that JWT came through oauth2-proxy).
#
# Scope: `seed:auth` (bearer token, with the forced first-login password change handled),
# `seed:teams` (SEED_TEAMS demo teams), `seed:users` (three users per team), `seed:apps` (the
# Bookinfo demo, below), and `seed:vikunja`.
#
# THE DEMO: Istio's Bookinfo sample (https://istio.io/latest/docs/examples/bookinfo/), deployed
# the way a real organisation would run it -- NOT as one team's four-container example, but as
# FOUR SEPARATE TEAMS, one microservice each, each team owning its own Gitea repository, its own
# Tekton build, its own workload and its own public URL, and calling each other across namespace
# boundaries over real in-cluster Service DNS.
#
#   role          owning team     repo                        calls
#   ----------------------------------------------------------------------------------
#   productpage   prodpage        team-prodpage/productpage    details, reviews
#   details       details         team-details/details         (leaf)
#   reviews       reviews         team-reviews/reviews         ratings
#   ratings       ratings         team-ratings/ratings         (leaf)
#
# **`prodpage`, not `productpage`.** apl-api enforces a hard 9-character maximum on team names
# (confirmed live: `productpage`, 11 characters, is rejected with "Team name must not exceed 9
# characters"). SEED_BOOKINFO_SERVICES therefore carries the display role name AND the team id
# separately; everything else derives from that one table.
#
# This is a FIXED four-role assignment, not the "same layout for every team, however many you
# list" shape the retired blue/green canary demo had. SEED_TEAMS still drives seed:teams /
# seed:users / seed:vikunja generically (each team still gets the same po/dev/agent trio), but
# seed:apps is driven by SEED_BOOKINFO_SERVICES and expects exactly those four team ids to exist.
# Changing SEED_TEAMS without changing SEED_BOOKINFO_SERVICES to match will leave the extra teams
# with users but no app.
#
# Each service's source is the real, unmodified upstream tree from github.com/istio/istio at
# branch `master` -- sparse-cloned on the HOST (which has internet access; pods do not) and
# force-pushed into that team's Gitea repo as dev-<team>, over HTTPS, with that user's own PAT.
# See seed-lib.sh's stage_service_tree / gitea_push_tree. Everything below is done AS
# dev-<team>, never as platform-admin, except the one thing a team admin genuinely may not do
# (writing network policies -- see the netpols step).
#
# Getting dev-<team> a Gitea credential needs a real Keycloak SSO login (Gitea accounts are
# OIDC-JIT-provisioned, never created proactively) -- fully scripted with curl, no browser, see
# seed-lib.sh's gitea_oidc_login. The sslVerify/skip-tls-verify CA-trust settings a
# webhook-triggered Tekton build needs (CLAUDE.md, "Every Tekton Task on this lab needs two
# CA-trust settings") are already baked into every build this platform creates
# (charts/team-ns/templates/builds/docker.yaml), so no patch is needed here.
#
# Unlike the retired canary demo, no base image is mirrored into Harbor: Bookinfo's Dockerfiles
# keep their upstream public `FROM` lines and kaniko pulled all of them fine (confirmed live
# 2026-08-29). See the note above harbor_ensure_project in seed-lib.sh for what to do if that ever
# stops being true.
#
# CROSS-TEAM CALLS -- the part that is actually hard, and the reason this is a worthwhile demo:
#   * Bookinfo builds every callee URL as plain `http://{HOSTNAME}:{PORT}/...` and does not follow
#     redirects. Each team's public route answers HTTP with a 301 to HTTPS, so routing internal
#     calls through the public hostname produces "Ratings service is currently unavailable" and
#     nothing else. The wiring therefore points at real in-cluster Service DNS instead --
#     `app.team-<callee>.svc.cluster.local:9080` -- via each service's own env vars. See
#     SEED_BOOKINFO_CALLS.
#   * Every team runs with networkPolicy.ingressPrivate: true (set by seed:teams), which allows
#     ingress only from istio-system/knative-serving/monitoring/tekton-pipelines -- not from
#     another team's namespace. The platform's own scoped, self-service mechanism for that is an
#     AplTeamNetworkControl per callee; see the netpols step for the two traps in writing one.
#
# Each team's three users --
#   po-<team>    : plain team member (isTeamAdmin: false)
#   dev-<team>   : team admin on the Console for that team ONLY (isTeamAdmin: true,
#                  isPlatformAdmin: false -- NOT a platform admin)
#   agent-<team> : plain team member, identical rights to po-<team>
# Emails are <role>-<team>@<domainSuffix>, matching the platform-admin@<domainSuffix> pattern
# SETUP.md/install:credentials already uses. firstName/lastName are the role/team capitalized
# (e.g. "Dev"/"Reviews") so the Console's user list reads unambiguously.
version: '3'
silent: true

vars:
  # Same realm/paths every other app in values/*.gotmpl derives from
  # (helmfile.d/snippets/derived.gotmpl's $oidcBaseUrl) -- never hardcode a literal domain here,
  # CLAUDE.md rule 5.
  KEYCLOAK_REALM_PATH: /realms/otomi
  # Materialized by an ExternalSecret from values/oauth2-proxy/oauth2-proxy-raw.gotmpl
  # ("oauth2-proxy-client-access", keys client-id/client-secret) -- this is the platform's one
  # shared OIDC client (default id "otomi", values-schema.yaml's apps.keycloak.idp.clientID),
  # the same client oauth2-proxy itself uses for the browser flow. Its namespace is discovered
  # at runtime below rather than assumed, since it isn't pinned down anywhere in source.
  OAUTH2_PROXY_CLIENT_SECRET_NAME: oauth2-proxy-client-access
  SEED_LIB: '{{.ROOT_DIR}}/.taskfiles/seed-lib.sh'
  # app:namespace:deployment -- apps seed:apps needs (Gitea for repos/OIDC, Harbor for images,
  # Tekton for builds) that a minimal `task setup` (only platform minimums) leaves disabled.
  # Enabled the same way the Console's Apps dashboard does it -- PUT /v1/apps/admin -- not by
  # editing values.yaml (that only applies at initial install, see CLAUDE.md rule 6).
  SEED_REQUIRED_APPS: "gitea:gitea:gitea harbor:harbor:harbor-core tekton:tekton-pipelines:tekton-pipelines-controller vikunja:vikunja:vikunja"
  # Read & Write (Vikunja's 0=Read/1=Read&Write/2=Admin) -- the team's default level on its own
  # demo project. Change to 2 if the team should administer the project itself, not just use it.
  SEED_VIKUNJA_TEAM_PERMISSION: 1
  # The four teams that own the four Bookinfo microservices. Team ids only -- the display role
  # name lives in SEED_BOOKINFO_SERVICES, because apl-api caps team names at 9 characters and
  # "productpage" does not fit (see the header). seed:teams/seed:users/seed:vikunja iterate this
  # generically; seed:apps does not -- it iterates SEED_BOOKINFO_SERVICES, so change both together.
  SEED_TEAMS: "prodpage details reviews ratings"
  # role:isTeamAdmin:FirstName -- one entry per role, applied to every team in SEED_TEAMS.
  SEED_ROLES: "po:false:PO dev:true:Dev agent:false:Agent"

  # --- Bookinfo -------------------------------------------------------------------------------
  # role:teamId:repoName:upstreamSubdir
  #
  # `reviews` (a gradle builder stage feeding an open-liberty runtime stage) is the one
  # multi-stage Dockerfile among the four -- it needs no special-casing here: the platform's
  # kaniko default was bumped past the release that fixed building multi-stage Dockerfiles
  # inside kind (see charts/team-ns/templates/tekton-tasks/kaniko.yaml, CLAUDE.md's kaniko trap,
  # and UPSTREAM-SYNC.md §4b), so all four services go through the exact same webhook-triggered
  # build path.
  SEED_BOOKINFO_SERVICES: >-
    productpage:prodpage:productpage
    details:details:details
    reviews:reviews:reviews
    ratings:ratings:ratings
  # The pushed source is VENDORED in this repo, not cloned from istio/istio at seed time. It is the
  # upstream Bookinfo tree plus the CI the demo is here to show: a .gitea/workflows/ci.yml lint+build
  # gate, its lint config, the source fixes that gate demanded, and the .gitea/runner/ build context
  # for the team's own Actions runner. Vendoring makes the seed deterministic (no network, no
  # upstream drift mid-demo) and is why there is no longer an upstream ref pinned here.
  SEED_BOOKINFO_VENDOR: "demo-seed/bookinfo"

  # The platform team owns assets shared by every other team -- currently the agent-base image (see
  # AGENT-ENVIRONMENTS.md section 18). A NORMAL team on purpose: `team-admin` cannot be used,
  # because its Gitea org has no human members and the admin team is special-cased throughout
  # (`team-admin` collides with the isTeamAdmin group marker -- see CLAUDE.md).
  SEED_PLATFORM_TEAM: platform
  SEED_AGENT_BASE_VENDOR: "demo-seed/agent-base"
  SEED_AGENT_BASE_REPO: agent-base

  # --- Gitea Actions runners ------------------------------------------------------------------
  # gitea.com/gitea/runner ("act_runner"). Downloaded ON THE HOST and checksum-verified, then
  # pushed inside each team's repo so the Dockerfile only has to COPY it -- the one artifact where
  # a silent substitution would be worst is therefore never fetched at image-build time.
  SEED_RUNNER_VERSION: "3.3.1"
  SEED_RUNNER_URL: "https://gitea.com/gitea/runner/releases/download/v3.3.1/gitea-runner-3.3.1-linux-amd64.xz"
  SEED_RUNNER_SHA256: "0cccfbb0333b2126b66b331b94e36bf74f034037add09c4a9ff3fb042968cba6"
  # Second AplTeamBuild per repo, building .gitea/runner/Dockerfile into this image name.
  SEED_RUNNER_IMAGE_NAME: ci-runner

  # The status check branch protection requires. "<workflow name> / <job id> (<event>)" -- all four
  # workflows are `name: ci` with a single job `ci`, deliberately, so this one string fits them all.
  SEED_CI_STATUS_CONTEXT: "ci / ci (pull_request)"
  # caller:callee, by TEAM ID. Drives two things at once: the caller workload's
  # <CALLEE>_HOSTNAME/<CALLEE>_SERVICE_PORT env vars (the <CALLEE> prefix is the callee's ROLE
  # name, uppercased -- PRODPAGE is never a callee, so the prodpage/productpage split never shows
  # up here), and the callee team's AplTeamNetworkControl allowing ingress from the caller's
  # namespace.
  # NOTE the separator is ":" and not the ">" that would read more naturally: go-task's shell
  # (mvdan/sh) parses a bare ">" inside a `for x in ...` word list as a REDIRECTION and refuses
  # the whole file with "word list can only contain words" -- bash quietly creates a file
  # instead, which is worse. Confirmed live.
  SEED_BOOKINFO_CALLS: "prodpage:details prodpage:reviews reviews:ratings"
  # teamId:NAME=VALUE,NAME=VALUE -- written to AplTeamBuild's spec.mode.docker.envVars, which
  # charts/team-ns/templates/builds/docker.yaml renders straight into kaniko `--build-arg`s.
  # v3 is the only reviews version that BOTH calls ratings AND renders the result visibly (red
  # stars) -- i.e. the only one that exercises all four services end to end.
  SEED_BOOKINFO_BUILD_ARGS: "reviews:service_version=v3,enable_ratings=true,star_color=red"
  # Both the AplTeamWorkload and the AplTeamService are named this in EVERY team -- uniformly, not
  # derived from the team. Two reasons: the public hostname is "<service>-<team>", so a per-team
  # name gives "app-details-details.<domain>"; and the internal DNS name is then the same
  # "app.team-<team>.svc.cluster.local" everywhere, which is what SEED_BOOKINFO_CALLS relies on.
  SEED_WORKLOAD_NAME: app
  # Singular "k8s-deployment" -- one image, one Deployment. (The retired canary demo used the
  # plural "k8s-deployments-canary", a different chart entirely.)
  SEED_WORKLOAD_CHART_PATH: k8s-deployment
  SEED_CATALOG_CHART_URL: "https://github.com/linode/apl-charts.git"
  # Every Bookinfo service listens on 9080. The k8s-deployment chart's own servicePorts default
  # points targetPort at a NAMED container port ("http") that is never declared unless
  # .Values.ports is also set -- overriding servicePorts with a numeric targetPort sidesteps that
  # entirely, with no `ports:` override needed.
  SEED_SERVICE_PORT: 9080
  # The custom pod label every callee workload carries, so an AplTeamNetworkControl has something
  # to select on. Two traps, both hit live, both encoded here:
  #   * apl-api validates toLabelName against a pattern that rejects "/", so a normal qualified
  #     label like app.kubernetes.io/name cannot be used at all -- hence a plain custom label,
  #     merged onto the pods through the chart's own .Values.podLabels.
  #   * the VALUE must never be the string "true"/"false": it gets coerced into a real YAML
  #     boolean somewhere in the values pipeline, and NetworkPolicy.spec.podSelector.matchLabels
  #     needs a string -- ArgoCD then fails the sync outright with
  #     `expected string, got &value.valueUnstructured{Value:true}`. Any other token is fine.
  SEED_NETPOL_LABEL_NAME: bookinfo
  SEED_NETPOL_LABEL_VALUE: bkflag

tasks:
  fix-first-login:
    desc: "Make the platform-admin's initial password permanent (Keycloak forces UPDATE_PASSWORD on first login)"
    # interactive: true on EVERY task in this file, not just the ones that prompt or poll.
    # Taskfile.yml sets `output: group` globally, which buffers a task's whole stdout until its
    # script block exits. Mixing grouped and ungrouped tasks in one run means a grouped task's
    # buffer flushes whenever it happens to finish -- which lands MID-LINE in an ungrouped task
    # that is streaming. Observed live: the word "any", a fragment of enable-apps' own label
    # ("Enabling any of gitea/harbor/tekton..."), appeared inside seed:apps' progress line as
    # "... (as dev-reviews) ... any(171s)". Grouping buys nothing here anyway: apl_run already
    # captures each step's real output to .taskfiles/state/logs/<slug>.log, and no seed task runs
    # as a parallel `deps:` the way cluster:up and images:build-all do.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        [ -f {{.STATE_DIR}}/pool_start.txt ] || { apl_fail "no {{.STATE_DIR}}/pool_start.txt -- is the platform installed? run 'task setup' first"; exit 1; }
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN="$(cat {{.STATE_DIR}}/pool_start.txt).nip.io"

        fix() {
          set -euo pipefail
          PLATFORM_USER=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret platform-admin-initial-credentials \
            -n keycloak -o jsonpath='{.data.username}' | base64 -d)
          PLATFORM_PASS=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret platform-admin-initial-credentials \
            -n keycloak -o jsonpath='{.data.password}' | base64 -d)
          [ -n "$PLATFORM_USER" ] && [ -n "$PLATFORM_PASS" ] || { echo "error: platform-admin-initial-credentials came back empty" >&2; exit 1; }

          TOKEN=$(kc_master_token)
          USER_ID=$(kc_user_id_by_email "$TOKEN" "$PLATFORM_USER")
          [ -n "$USER_ID" ] || { echo "error: no Keycloak user found for $PLATFORM_USER" >&2; exit 1; }

          NEEDS_FIX=$(curl -sk --max-time 15 -f "https://keycloak.$DOMAIN/admin/realms/otomi/users/$USER_ID" \
            -H "Authorization: Bearer $TOKEN" | jq -r '(.requiredActions // []) | index("UPDATE_PASSWORD") != null')
          if [ "$NEEDS_FIX" != "true" ]; then
            echo "platform-admin has no pending UPDATE_PASSWORD required action -- nothing to do"
            exit 0
          fi

          # Reuse the SAME password already in the secret -- the user asked for the initial
          # password to become permanent, not for a new one to be generated.
          kc_make_password_permanent "$TOKEN" "$USER_ID" "$PLATFORM_PASS"
        }
        apl_run seed-fix-first-login "Making platform-admin's initial password permanent" fix || exit $?

  auth:
    desc: "Fetch a platform-admin Keycloak access token via the Resource Owner Password grant (proves login works; NOT cached for later use -- see teams/users, which re-fetch fresh)"
    deps: [fix-first-login]
    # See fix-first-login for why every task in this file is interactive: true.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        [ -f {{.STATE_DIR}}/pool_start.txt ] || { apl_fail "no {{.STATE_DIR}}/pool_start.txt -- is the platform installed? run 'task setup' first"; exit 1; }
        DOMAIN="$(cat {{.STATE_DIR}}/pool_start.txt).nip.io"
        echo "$DOMAIN" > {{.STATE_DIR}}/seed_domain.txt
        KIND_CTX="{{.KIND_CONTEXT}}"

        # A token fetched here would go stale by the time a long dependent step (enable-apps's
        # up-to-20-minute app-readiness wait) finishes -- confirmed live: reusing one across that
        # wait 401s with "JWT verification failed: \"exp\" claim timestamp check failed". This
        # step exists only to prove the ROPC login itself works (the forced first-login password
        # change is the one real obstacle, handled by fix-first-login above) -- teams/users each
        # call kc_platform_admin_token fresh, right before they need it, instead of reading a
        # cached file.
        auth() {
          set -euo pipefail
          TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          [ -n "$TOKEN" ]
        }
        apl_run seed-auth "Fetching a platform-admin access token from Keycloak" auth || exit $?
        apl_ok "platform-admin login confirmed"

  enable-apps:
    desc: "Enable gitea/harbor/tekton if a minimal install left them off (same PUT the Console's Apps dashboard uses)"
    deps: [auth]
    # See fix-first-login for why every task in this file is interactive: true.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"

        toggle_missing() {
          set -euo pipefail
          _current=$(curl -sk --max-time 15 -f "$API/v1/apps" -H "Authorization: Bearer $TOKEN")
          _missing=""
          for SPEC in {{.SEED_REQUIRED_APPS}}; do
            _app=${SPEC%%:*}
            _enabled=$(printf '%s' "$_current" | jq -r --arg id "$_app" '.[] | select(.id==$id) | .enabled')
            [ "$_enabled" = "true" ] || _missing="$_missing\"$_app\","
          done
          if [ -z "$_missing" ]; then
            echo "gitea/harbor/tekton already enabled -- nothing to toggle"
            return 0
          fi
          _ids="[${_missing%,}]"
          echo "enabling: $_ids"
          curl -sk --max-time 15 -f -X PUT "$API/v1/apps/admin" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ids\":$_ids,\"enabled\":true}" > /dev/null
        }
        apl_run seed-enable-apps "Enabling any of gitea/harbor/tekton left off by a minimal install" toggle_missing || exit $?
      - |
        . "{{.LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        # Enabling an app is a git commit -- the actual install (real Helm charts, much heavier
        # than a team resource) takes real minutes, not seconds. Bounded wait: 40 tries, 30s
        # apart, ~20 min cap -- generous on purpose, this is a one-time cost per fresh cluster.
        # Every kubectl call is --request-timeout-bounded -- kubectl has no default timeout and
        # will hang indefinitely against an unresponsive API server otherwise (CLAUDE.md rule 1).
        wait_ready() {
          set -euo pipefail
          _tries=0
          while [ "$_tries" -lt 40 ]; do
            _all_ready=true
            for SPEC in {{.SEED_REQUIRED_APPS}}; do
              _ns=$(printf '%s' "$SPEC" | cut -d: -f2)
              _deploy=$(printf '%s' "$SPEC" | cut -d: -f3)
              _avail=$(kubectl --context "$KIND_CTX" --request-timeout=15s get deploy "$_deploy" -n "$_ns" \
                -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
              [ "${_avail:-0}" -ge 1 ] 2>/dev/null || _all_ready=false
            done
            [ "$_all_ready" = "true" ] && break
            _tries=$((_tries + 1))
            echo "waiting for gitea/harbor/tekton deployments to become available (try $_tries/40)..."
            sleep 30
          done
          [ "$_all_ready" = "true" ] || { echo "error: gitea/harbor/tekton not all Available after ~20 min" >&2; return 1; }
        }
        apl_run seed-enable-apps-wait "Waiting for gitea/harbor/tekton to actually come up (real Helm installs, several minutes)" wait_ready || exit $?

  teams:
    desc: "Create the demo teams (SEED_TEAMS) via POST /v2/teams and verify each"
    # selfService.teamMembers.createServices defaults to false (team.yaml) and is a HARD gate,
    # separate from and bypassing the normal teamAdmin/teamMember CASL create-rights check --
    # confirmed live: apl-api's authz middleware routes "create:Service" through
    # hasSelfService(teamId, 'createServices') whenever the caller is a team member at all,
    # never through the CASL role check, even for a team-admin. Omit this and seed:apps's
    # service creation 403s with "User not allowed to perform \"create\" on \"Service\" resource"
    # no matter how privileged dev-<team> is.
    deps: [enable-apps]
    # See fix-first-login for why every task in this file is interactive: true.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        # Fresh, not cached: this runs right after enable-apps's up-to-20-minute readiness wait,
        # which can easily outlive a token fetched before it started (see kc_platform_admin_token).
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"

        create_team() {
          set -euo pipefail
          _team=$1
          _out={{.STATE_DIR}}/seed_team_create_$_team.json
          _body=$(cat <<JSON
        {
          "kind": "AplTeamSettingSet",
          "metadata": {"name": "$_team", "labels": {"apl.io/teamId": "$_team"}},
          "spec": {
            "managedMonitoring": {"grafana": false, "alertmanager": false},
            "networkPolicy": {"ingressPrivate": true, "egressPublic": true},
            "selfService": {
              "teamMembers": {
                "createServices": true,
                "editSecurityPolicies": false,
                "useCloudShell": false,
                "downloadKubeconfig": false,
                "downloadDockerLogin": false
              }
            }
          }
        }
        JSON
        )
          _http=$(curl -sk --max-time 15 -o "$_out" -w '%{http_code}' \
            -X POST "$API/v2/teams" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$_body")
          if [ "$_http" -ge 300 ]; then
            echo "error: POST /v2/teams ($_team) returned HTTP $_http" >&2
            cat "$_out" >&2
            exit 1
          fi
        }
        for TEAM in {{.SEED_TEAMS}}; do
          apl_run "seed-team-create-$TEAM" "Creating demo team '$TEAM' via POST /v2/teams" create_team "$TEAM" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"

        # Verify, don't assert (CLAUDE.md rule 4) -- a 2xx from the POST only means apl-api
        # accepted and committed it, not that it's the team we think it is. Round-trip with a GET.
        verify_team() {
          set -euo pipefail
          _team=$1
          _resp=$(curl -sk --max-time 15 "$API/v2/teams/$_team" -H "Authorization: Bearer $TOKEN")
          _name=$(printf '%s' "$_resp" | jq -er '.metadata.name')
          [ "$_name" = "$_team" ]
        }
        for TEAM in {{.SEED_TEAMS}}; do
          apl_run "seed-team-verify-$TEAM" "Verifying '$TEAM' via GET /v2/teams/$TEAM" verify_team "$TEAM" || exit $?
        done
        apl_ok "teams created and confirmed: {{.SEED_TEAMS}}"
        apl_info "each team's namespace (team-<name>) appears once the operator reconciles the commit --"
        apl_info "not checked here; 'kubectl get ns' once you're ready to confirm."

  users:
    desc: "Create the demo users (po/dev/agent per team), then make all their passwords permanent in one pass"
    deps: [teams]
    # See fix-first-login for why every task in this file is interactive: true.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"
        PENDING={{.STATE_DIR}}/seed_pending_passwords.txt
        : > "$PENDING"

        # Per-user marker block in passwords.txt, keyed by email -- NOT one big block for all six.
        # apl-api 409s "User email already exists" on a repeat POST (unlike /v2/teams, which
        # upserts cleanly), and it never re-exposes initialPassword for a user that already
        # exists. A single wipe-and-rewrite-everything block would silently drop an
        # already-seeded user's credentials the moment any ONE user in a partial rerun already
        # existed. Keying per-user means a skipped (already-existing) user's passwords.txt entry
        # from a previous run is simply left alone.
        record_credentials() {
          set -euo pipefail
          _email=$1 _team=$2 _role=$3 _is_admin=$4 _password=$5
          _mark_begin="# --- demo-user: $_email (generated by 'task seed:users') ---"
          _mark_end="# --- end demo-user: $_email ---"
          [ -f passwords.txt ] && sed -i "/^${_mark_begin//\//\\/}\$/,/^${_mark_end//\//\\/}\$/d" passwords.txt
          {
            echo "$_mark_begin"
            printf 'team:     %s\nrole:     %s%s\nusername: %s\npassword: %s\n' \
              "$_team" "$_role" "$([ "$_is_admin" = "true" ] && echo " (team-admin)" || echo "")" \
              "$_email" "$_password"
            echo "$_mark_end"
          } >> passwords.txt
          chmod 600 passwords.txt
          # Machine-readable copy for later automation (seed:apps needs dev-<team>'s password to
          # act as that user) -- passwords.txt is for humans, re-parsing it programmatically would
          # be fragile. Only written for roles that actually have a password to record here.
          printf '%s' "$_password" > {{.STATE_DIR}}/seed_pw_${_team}_${_role}.txt
          chmod 600 {{.STATE_DIR}}/seed_pw_${_team}_${_role}.txt
        }

        create_user() {
          set -euo pipefail
          _team=$1 _role=$2 _is_admin=$3 _firstname=$4
          _lastname=$(printf '%s' "$_team" | sed 's/./\U&/')
          _email="$_role-$_team@$DOMAIN"
          _out={{.STATE_DIR}}/seed_user_${_team}_${_role}.json
          _body=$(cat <<JSON
        {
          "email": "$_email",
          "firstName": "$_firstname",
          "lastName": "$_lastname",
          "isPlatformAdmin": false,
          "isTeamAdmin": $_is_admin,
          "teams": ["$_team"]
        }
        JSON
        )
          _http=$(curl -sk --max-time 15 -o "$_out" -w '%{http_code}' \
            -X POST "$API/v1/users" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$_body")
          if [ "$_http" = "409" ] && grep -q 'already exists' "$_out"; then
            echo "user $_email already exists -- leaving its passwords.txt entry as-is (apl-api does not re-issue a password for an existing user, and it was already made permanent by an earlier run)"
            exit 0
          fi
          if [ "$_http" -ge 300 ]; then
            echo "error: POST /v1/users ($_email) returned HTTP $_http" >&2
            cat "$_out" >&2
            exit 1
          fi
          _returned_email=$(jq -er '.email' "$_out")
          [ "$_returned_email" = "$_email" ] || { echo "error: response email '$_returned_email' != '$_email'" >&2; exit 1; }
          _password=$(jq -er '.initialPassword' "$_out")

          record_credentials "$_email" "$_team" "$_role" "$_is_admin" "$_password"
          # Queued for the single shared wait-then-fix pass below -- NOT fixed here, one user at
          # a time: apl-tasks reconciles a batch of git commits together on one debounce, so
          # waiting per-user serially (up to 120s EACH) is needless when one shared wait covers
          # every user created this run.
          printf '%s\t%s\n' "$_email" "$_password" >> "$PENDING"
        }

        for TEAM in {{.SEED_TEAMS}}; do
          for ROLE_SPEC in {{.SEED_ROLES}}; do
            ROLE=${ROLE_SPEC%%:*}
            REST=${ROLE_SPEC#*:}
            IS_ADMIN=${REST%%:*}
            FIRSTNAME=${REST#*:}
            apl_run "seed-user-$TEAM-$ROLE" "Creating $ROLE-$TEAM (isTeamAdmin=$IS_ADMIN)" \
              create_user "$TEAM" "$ROLE" "$IS_ADMIN" "$FIRSTNAME" || exit $?
          done
        done
        apl_ok "demo users created; credentials recorded in passwords.txt per-user"
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        PENDING={{.STATE_DIR}}/seed_pending_passwords.txt
        RESOLVED={{.STATE_DIR}}/seed_resolved.txt
        : > "$RESOLVED"

        if [ ! -s "$PENDING" ]; then
          apl_skip "no freshly created users this run -- nothing to wait for or fix"
        else
          fix_all() {
            set -euo pipefail
            kc_resolve_pending "$PENDING" "$RESOLVED"
            if [ -s "$PENDING" ]; then
              echo "error: still not reconciled in Keycloak after ~120s: $(cut -f1 "$PENDING" | tr '\n' ' ')" >&2
              exit 1
            fi
            while IFS=$'\t' read -r _email _id _password; do
              [ -n "$_email" ] || continue
              _token=$(kc_master_token)
              kc_make_password_permanent "$_token" "$_id" "$_password"
            done < "$RESOLVED"
          }
          _n=$(wc -l < "$PENDING" | tr -d ' ')
          apl_run seed-users-fix-first-login \
            "Waiting once for apl-tasks to reconcile $_n new user(s) in Keycloak, then making their passwords permanent" \
            fix_all || exit $?
        fi

  agent-base:
    desc: "The platform team and its shared agent-base image (turnstone + tea/logcli/vikunja-cli) that every team's runner image layers in"
    deps: [users]
    # Polls for a Keycloak reconcile, a Gitea org, a Harbor project and a kaniko build -- all of
    # which print progress as they go, and all of which Taskfile.yml's global `output: group` would
    # buffer until the task ends. See CLAUDE.md's note on `interactive: true`.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"
        TEAM="{{.SEED_PLATFORM_TEAM}}"
        REPO="{{.SEED_AGENT_BASE_REPO}}"
        PW_FILE={{.STATE_DIR}}/seed_pw_${TEAM}_dev.txt
        # Consumed by seed-lib.sh's stage_agent_base_tree / runner_fetch_binary. Exported because
        # every cmds block runs in its own shell.
        export SEED_AGENT_BASE_DIR="{{.ROOT_DIR}}/{{.SEED_AGENT_BASE_VENDOR}}"
        export SEED_RUNNER_URL="{{.SEED_RUNNER_URL}}"
        export SEED_RUNNER_SHA256="{{.SEED_RUNNER_SHA256}}"
        export SEED_RUNNER_VERSION="{{.SEED_RUNNER_VERSION}}"
        # harbor_has_tag / harbor_delete_tag both need this, and this task never set it -- so
        # harbor_has_tag's curl authenticated as "admin:" , got 401, and returned false EVERY time.
        # The "runner image already in Harbor" skip below therefore never fired, and the build wait
        # was satisfied instead by whatever old PipelineRun of the same name was lying around.
        # Harbor's API is reached with a platform-admin OIDC token (harbor_token in seed-lib.sh),
        # not the Harbor bootstrap admin password -- Harbor is in auth_mode oidc_auth against this
        # same realm, so the platform admin already IS a Harbor admin. This names the OIDC client
        # whose secret mints that token; harbor_token defaults to the same value if it is unset.
        export OAUTH2_PROXY_CLIENT_SECRET_NAME="{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}"
        # Once, here, before any parallel work: Harbor treats a bearer for a user it has never seen
        # as ANONYMOUS, so without this every harbor_* call reads only public projects and writes
        # 401. See harbor_ensure_platform_admin for why it must be platform-admin and not a team
        # admin (team groups are bound as developer; projectAdmin goes to an empty group).
        harbor_ensure_platform_admin || exit $?

        # A NORMAL team, deliberately. `team-admin` looks like the obvious owner for platform-wide
        # assets and is unusable: its Gitea org has no human members, so platform-admin is not even
        # offered it as a repo owner, and the admin team is special-cased throughout because
        # `team-admin` collides with the isTeamAdmin group marker. See CLAUDE.md and
        # AGENT-ENVIRONMENTS.md section 18.
        create_platform_team() {
          set -euo pipefail
          _tok=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          _out={{.STATE_DIR}}/seed_team_create_$TEAM.json
          _http=$(curl -sk --max-time 15 -o "$_out" -w '%{http_code}' -X POST "$API/v2/teams" \
            -H "Authorization: Bearer $_tok" -H "Content-Type: application/json" \
            -d "{\"kind\":\"AplTeamSettingSet\",\"metadata\":{\"name\":\"$TEAM\",\"labels\":{\"apl.io/teamId\":\"$TEAM\"}},\"spec\":{\"managedMonitoring\":{\"grafana\":false,\"alertmanager\":false},\"networkPolicy\":{\"ingressPrivate\":true,\"egressPublic\":true},\"selfService\":{\"teamMembers\":{\"createServices\":true,\"editSecurityPolicies\":false,\"useCloudShell\":false,\"downloadKubeconfig\":false,\"downloadDockerLogin\":false}}}}")
          [ "$_http" -lt 300 ] || { echo "error: POST /v2/teams ($TEAM) returned HTTP $_http: $(head -c 300 "$_out")" >&2; return 1; }
        }

        # One dev user, because the whole Gitea half of this task must run AS a team member:
        # gitea_oidc_login is what provisions the Gitea account and syncs its org membership from
        # the JWT `groups` claim, and only an org member may create the repo.
        create_platform_dev_user() {
          set -euo pipefail
          _tok=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          _out={{.STATE_DIR}}/seed_user_${TEAM}_dev.json
          _http=$(curl -sk --max-time 15 -o "$_out" -w '%{http_code}' -X POST "$API/v1/users" \
            -H "Authorization: Bearer $_tok" -H "Content-Type: application/json" \
            -d "{\"email\":\"dev-$TEAM@$DOMAIN\",\"firstName\":\"Dev\",\"lastName\":\"Platform\",\"isPlatformAdmin\":false,\"isTeamAdmin\":true,\"teams\":[\"$TEAM\"]}")
          # apl-api 409s on a repeat POST and never re-exposes initialPassword, so a re-run relies
          # on the password recorded the first time -- same reasoning as seed:users.
          if [ "$_http" = "409" ]; then
            [ -s "$PW_FILE" ] || { echo "error: dev-$TEAM exists but $PW_FILE is missing -- delete the user or restore the file" >&2; return 1; }
            echo "dev-$TEAM already exists, reusing the recorded password"
            return 0
          fi
          [ "$_http" -lt 300 ] || { echo "error: POST /v1/users (dev-$TEAM) returned HTTP $_http: $(head -c 300 "$_out")" >&2; return 1; }
          _pw=$(jq -r '.initialPassword // empty' "$_out")
          [ -n "$_pw" ] || { echo "error: apl-api returned no initialPassword for dev-$TEAM" >&2; return 1; }
          printf '%s' "$_pw" > "$PW_FILE"; chmod 600 "$PW_FILE"
          _mb="# --- demo-user: dev-$TEAM@$DOMAIN (generated by 'task seed:agent-base') ---"
          _me="# --- end demo-user: dev-$TEAM@$DOMAIN ---"
          [ -f passwords.txt ] && sed -i "/^${_mb//\//\\/}\$/,/^${_me//\//\\/}\$/d" passwords.txt
          { echo "$_mb"; printf 'team:     %s\nrole:     dev (team-admin)\nusername: dev-%s@%s\npassword: %s\n' \
              "$TEAM" "$TEAM" "$DOMAIN" "$_pw"; echo "$_me"; } >> passwords.txt
          chmod 600 passwords.txt
        }

        # A user created through apl-api arrives with requiredActions ["UPDATE_PASSWORD"] and cannot
        # complete an SSO login until that is cleared -- reset-password alone is NOT enough, the
        # action is recorded on the user object too. Same helper seed:fix-first-login uses.
        fix_platform_dev_login() {
          set -euo pipefail
          _pw=$(cat "$PW_FILE")
          _t=$(kc_master_token)
          _id=""
          _tries=0
          while [ "$_tries" -lt 24 ]; do
            _id=$(kc_user_id_by_email "$_t" "dev-$TEAM@$DOMAIN")
            [ -n "$_id" ] && break
            _tries=$((_tries + 1)); sleep 5
          done
          [ -n "$_id" ] || { echo "error: apl-tasks' Keycloak operator never created dev-$TEAM@$DOMAIN (120s)" >&2; return 1; }
          kc_make_password_permanent "$_t" "$_id" "$_pw"
        }

        # The operator reconciles a new team into three separate things at its own pace; all three
        # are needed before anything below can run, so wait for the objects themselves rather than
        # guessing at a sleep.
        wait_for_platform_team() {
          set -euo pipefail
          _tries=0
          while [ "$_tries" -lt 40 ]; do
            _ns=$(kubectl --context "$KIND_CTX" --request-timeout=15s get ns "team-$TEAM" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            _org=$(curl -sk --max-time 10 "https://gitea.$DOMAIN/api/v1/orgs/team-$TEAM" 2>/dev/null | jq -r '.username // empty' 2>/dev/null || true)
            _hb=$(curl -sk --max-time 10 -H "Authorization: Bearer $(harbor_token)" "https://harbor.$DOMAIN/api/v2.0/projects?name=team-$TEAM" 2>/dev/null | jq -r '.[0].name // empty' 2>/dev/null || true)
            if [ "$_ns" = "Active" ] && [ -n "$_org" ] && [ -n "$_hb" ]; then return 0; fi
            _tries=$((_tries + 1)); sleep 15
          done
          echo "error: team-$TEAM did not get a namespace + Gitea org + Harbor project within 600s (ns=$_ns org=$_org harbor=$_hb)" >&2
          return 1
        }

        # Nothing creates the Gitea repository for you: AplTeamCodeRepo does not, apl-gitea-operator
        # does not (OIDC config and build webhooks only), and push-to-create is off. Registering the
        # build first leaves the operator looping on createBuildWebHook against a repo that is not
        # there, which reads like a webhook fault and is not. Order matters -- see CLAUDE.md.
        build_agent_base() {
          set -euo pipefail
          _pw=$(cat "$PW_FILE")
          _gu=$(gitea_oidc_login "dev-$TEAM@$DOMAIN" "$_pw")
          [ -n "$_gu" ] || { echo "error: SSO login for dev-$TEAM produced no Gitea user" >&2; return 1; }
          _pat=$(gitea_mint_pat "$_gu" "read:user,write:repository,write:organization,read:organization")
          gitea_wait_for_org_permission "$_gu" "team-$TEAM" "$_pat" "can_create_repository"
          gitea_create_org_repo "team-$TEAM" "$REPO" "$_pat"

          _src=$(stage_agent_base_tree) || return 1
          _token=$(dev_platform_token)
          apl_create_if_missing \
            "$API/v2/teams/$TEAM/coderepos/$REPO" "$API/v2/teams/$TEAM/coderepos" "$_token" \
            "{\"kind\":\"AplTeamCodeRepo\",\"metadata\":{\"name\":\"$REPO\"},\"spec\":{\"gitService\":\"gitea\",\"repositoryUrl\":\"https://gitea.$DOMAIN/team-$TEAM/$REPO.git\",\"private\":false}}" \
            "coderepo $REPO ($TEAM)"
          apl_create_if_missing \
            "$API/v2/teams/$TEAM/builds/$REPO" "$API/v2/teams/$TEAM/builds" "$_token" \
            "$(jq -n --arg url "https://gitea.$DOMAIN/team-$TEAM/$REPO.git" \
              '{kind:"AplTeamBuild", metadata:{name:"agent-base"}, spec:{imageName:"agent-base", tag:"main", trigger:true, scanSource:false, mode:{type:"docker", docker:{repoUrl:$url, path:"./Dockerfile", revision:"main"}}}}')" \
            "build $REPO ($TEAM)"

          # Registered != able to receive. Wait for the webhook to actually exist on the repo before
          # pushing, or the push fires into nothing and no build ever starts.
          _tries=0
          while [ "$_tries" -lt 18 ]; do
            _hooks=$(curl -sk --max-time 10 "https://gitea.$DOMAIN/api/v1/repos/team-$TEAM/$REPO/hooks" -H "Authorization: token $_pat" 2>/dev/null | jq -r 'length' 2>/dev/null || true)
            [ "${_hooks:-0}" -gt 0 ] && break
            _tries=$((_tries + 1)); sleep 10
          done
          [ "${_hooks:-0}" -gt 0 ] || { echo "error: no Gitea webhook appeared for team-$TEAM/$REPO within 180s" >&2; return 1; }

          gitea_push_tree "team-$TEAM" "$REPO" "$_pat" "$_gu" "$_src" \
            "Platform agent base: turnstone, tea, logcli, vikunja-cli and the gitea-runner, as a relocatable /opt/platform layer" || _rc=$?
          # rc 2 means "already at this commit, nothing pushed" -- fine, the tag check below decides.
          case "${_rc:-0}" in 0|2) : ;; *) return 1 ;; esac
        }

        # dev-<platform>'s own bearer token. Same sixty-second-lifespan caveat as seed:apps'
        # dev_team_token: fetch it immediately before the calls that use it, never across a wait.
        dev_platform_token() {
          _pw=$(cat "$PW_FILE")
          _cns=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret -A \
            --field-selector "metadata.name={{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}" -o jsonpath='{.items[0].metadata.namespace}')
          _cid=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} -n "$_cns" -o jsonpath='{.data.client-id}' | base64 -d)
          _cs=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} -n "$_cns" -o jsonpath='{.data.client-secret}' | base64 -d)
          _r=$(curl -sk --max-time 15 "https://keycloak.$DOMAIN{{.KEYCLOAK_REALM_PATH}}/protocol/openid-connect/token" \
            --data-urlencode grant_type=password --data-urlencode client_id="$_cid" --data-urlencode client_secret="$_cs" \
            --data-urlencode username="dev-$TEAM@$DOMAIN" --data-urlencode password="$_pw" --data-urlencode scope=openid)
          _t=$(printf '%s' "$_r" | jq -r '.access_token // empty' 2>/dev/null || true)
          [ -n "$_t" ] || { echo "error: no access token for dev-$TEAM -- Keycloak said: $(printf '%s' "$_r" | head -c 300)" >&2; return 1; }
          printf '%s' "$_t"
        }

        # The image must EXIST before seed:runners builds any team image, because every team's
        # runner Dockerfile does COPY --from against it. Waiting on the Harbor tag is the honest
        # check: a PipelineRun that reports success has still not helped until the artifact is
        # pushed. Generous bound -- this build installs a standalone Python and four binaries.
        wait_for_agent_base_image() {
          set -euo pipefail
          _tries=0
          _refired=false
          while [ "$_tries" -lt 60 ]; do
            if harbor_has_tag "team-$TEAM" "agent-base" "main"; then return 0; fi
            # Same lost-delivery recovery as wait_for_triggered_build, checked against the
            # PipelineRun rather than the tag: no run after ~60s means nothing was ever triggered.
            # This is the exact stall seen live on 2026-08-30 -- the wait sat here for its full
            # 900s while the EventListener had received nothing at all. The credential is minted
            # only on this path (apl_run calls each step in a subshell, so the build step's PAT is
            # long gone by now), which keeps the happy path free of an extra login.
            if [ "$_tries" -ge 4 ] && [ "$_refired" = "false" ]; then
              _any_pr=$(kubectl --context "$KIND_CTX" --request-timeout=15s get pipelinerun -n "team-$TEAM" \
                -o name 2>/dev/null | grep -c "docker-trigger-build-$REPO" || true)
              if [ "${_any_pr:-0}" -eq 0 ]; then
                _refired=true
                echo "  no PipelineRun for $REPO after ${_tries} tries -- assuming the push delivery was lost"
                _rf_pw=$(cat {{.STATE_DIR}}/seed_pw_${TEAM}_dev.txt 2>/dev/null || true)
                if [ -n "$_rf_pw" ]; then
                  _rf_gu=$(gitea_oidc_login "dev-$TEAM@$DOMAIN" "$_rf_pw" 2>/dev/null || true)
                  if [ -n "$_rf_gu" ]; then
                    _rf_pat=$(gitea_mint_pat "$_rf_gu" "read:user,write:repository,read:organization" 2>/dev/null || true)
                    [ -n "$_rf_pat" ] && { gitea_refire_push_hook "team-$TEAM" "$REPO" "$_rf_pat" || true; }
                  fi
                fi
              fi
            fi
            _tries=$((_tries + 1)); sleep 15
          done
          echo "error: harbor.$DOMAIN/team-$TEAM/agent-base:main never appeared (900s). Check: kubectl get pipelinerun -n team-$TEAM" >&2
          return 1
        }

        apl_run "seed-platform-team"      "Creating the '$TEAM' team via POST /v2/teams"                 create_platform_team      || exit $?
        apl_run "seed-platform-user"      "Creating dev-$TEAM (isTeamAdmin=true)"                        create_platform_dev_user  || exit $?
        apl_run "seed-platform-login-fix" "Making dev-$TEAM's password permanent (clears UPDATE_PASSWORD)" fix_platform_dev_login  || exit $?
        apl_run "seed-platform-wait"      "Waiting for team-$TEAM's namespace, Gitea org and Harbor project" wait_for_platform_team || exit $?
        apl_run "seed-platform-harbor"    "Making Harbor project 'team-$TEAM' public so every team can pull the layer" \
          harbor_make_project_public "team-$TEAM" || exit $?
        # Before the push, never after: the push fires the build webhook immediately, and the
        # build's fetch-source pod mounts the `gitea-credentials` Secret apl-gitea-operator writes
        # into the team namespace. A BRAND-NEW team routinely does not have it yet -- upstream
        # swallows a 403 and never retries -- and the pod then sits at Init:0/2 on a FailedMount
        # while the wait below times out, with the real cause nowhere near the failure. Confirmed
        # live on the first run of this task, which is exactly the case seed:apps already guards
        # for the Bookinfo teams.
        apl_run "seed-platform-credentials" "Ensuring apl-gitea-operator wrote gitea-credentials into team-$TEAM" \
          gitea_ensure_team_credentials "$TEAM" || exit $?
        apl_run "seed-agent-base-build"   "Creating team-$TEAM/$REPO and pushing the agent-base build context" build_agent_base || exit $?
        apl_run "seed-agent-base-image"   "Waiting for harbor.$DOMAIN/team-$TEAM/agent-base:main"        wait_for_agent_base_image || exit $?
        apl_ok "platform agent base ready: harbor.$DOMAIN/team-$TEAM/agent-base:main -- every team's runner image layers it in"

  apps:
    desc: "Istio Bookinfo, one microservice per team: Gitea repo + Tekton build + workload + public service, cross-team wired"
    # agent-base, not users: every team's runner Dockerfile does COPY --from against the platform
    # agent layer, so that image must exist in Harbor before seed:runners builds anything. A
    # missing base fails inside kaniko with an opaque "manifest unknown".
    deps: [agent-base]
    # This task's own polling loops print real progress every few seconds (webhook waits, build
    # waits, the final cross-team page check) -- but Taskfile.yml's global `output: group` buffers
    # a task's ENTIRE stdout until its script block exits, so without this flag none of it is
    # visible until the whole (multi-minute) task finishes, indistinguishable from a hang. See
    # CLAUDE.md's note on `interactive: true`.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"

        # Every team's first build mounts the `gitea-credentials` Secret apl-gitea-operator writes
        # into the team namespace -- without it the git-clone Task's fetch-source pod hangs at
        # Init:0/2 on a FailedMount and the PipelineRun wait below just times out, with the real
        # cause (a swallowed 403 in the operator, minutes earlier) nowhere near the failure.
        # A brand-new team hits that 403 routinely; an existing one never does. Full account, and
        # why this is upstream's bug rather than something wired wrong here, in seed-lib.sh's
        # gitea_ensure_team_credentials.
        #
        # Done ONCE for all of SEED_TEAMS, not per team inside setup_team_app: the operator
        # rewrites the secret for every team org on a single reconcile pass, so one check (and at
        # most one nudge) covers the whole run no matter how many teams it has.
        apl_run seed-apps-gitea-credentials \
          "Ensuring apl-gitea-operator wrote gitea-credentials into every team namespace" \
          gitea_ensure_team_credentials {{.SEED_TEAMS}} || exit $?
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"
        # Consumed by seed-lib.sh's stage_service_tree / runner_fetch_binary. Exported rather than
        # interpolated at each call site because every cmds block runs in its own shell.
        export SEED_VENDOR_DIR="{{.ROOT_DIR}}/{{.SEED_BOOKINFO_VENDOR}}"
        export SEED_RUNNER_URL="{{.SEED_RUNNER_URL}}"
        export SEED_RUNNER_SHA256="{{.SEED_RUNNER_SHA256}}"
        export SEED_RUNNER_VERSION="{{.SEED_RUNNER_VERSION}}"
        # Needed by harbor_has_tag below -- "is there already an image for this repo?" is what
        # decides whether an unchanged source tree still needs a build.
        # Harbor's API is reached with a platform-admin OIDC token (harbor_token in seed-lib.sh),
        # not the Harbor bootstrap admin password -- Harbor is in auth_mode oidc_auth against this
        # same realm, so the platform admin already IS a Harbor admin. This names the OIDC client
        # whose secret mints that token; harbor_token defaults to the same value if it is unset.
        export OAUTH2_PROXY_CLIENT_SECRET_NAME="{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}"
        # Once, here, before any parallel work: Harbor treats a bearer for a user it has never seen
        # as ANONYMOUS, so without this every harbor_* call reads only public projects and writes
        # 401. See harbor_ensure_platform_admin for why it must be platform-admin and not a team
        # admin (team groups are bound as developer; projectAdmin goes to an empty group).
        harbor_ensure_platform_admin || exit $?

        # dev-<team>'s own Keycloak bearer token -- same ROPC pattern seed:auth uses for
        # platform-admin, just with dev-<team>'s own credentials. Everything below runs AS that
        # user, never platform-admin: each team's own service is set up by that team's own dev.
        #
        # Call this immediately before each group of API calls, never once for the whole
        # function: this realm's accessTokenLifespan is SIXTY SECONDS (confirmed live against
        # /admin/realms/otomi), and setup_team_service deliberately waits far longer than that
        # between its groups of calls -- up to 180s for the Gitea webhook, 90s for the
        # EventListener, and up to 15 minutes for a build. A token fetched before those waits is
        # long dead by the time the workload and service are created. Same class of bug as the
        # platform-admin token that used to be cached across enable-apps's readiness wait; see
        # kc_platform_admin_token's note in seed-lib.sh.
        dev_team_token() {
          _team=$1
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)
          _client_ns=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret -A \
            --field-selector "metadata.name={{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}" \
            -o jsonpath='{.items[0].metadata.namespace}')
          _client_id=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} \
            -n "$_client_ns" -o jsonpath='{.data.client-id}' | base64 -d)
          _client_secret=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} \
            -n "$_client_ns" -o jsonpath='{.data.client-secret}' | base64 -d)
          _tok_resp=$(curl -sk --max-time 15 "https://keycloak.$DOMAIN{{.KEYCLOAK_REALM_PATH}}/protocol/openid-connect/token" \
            --data-urlencode grant_type=password --data-urlencode client_id="$_client_id" --data-urlencode client_secret="$_client_secret" \
            --data-urlencode username="$_email" --data-urlencode password="$_password" --data-urlencode scope=openid)
          _tok=$(printf '%s' "$_tok_resp" | jq -r '.access_token // empty' 2>/dev/null || true)
          # Diagnose rather than die silently: with `jq -er` straight off the pipe, a failed
          # login aborted the caller through `set -e` with no message at all, and Keycloak's own
          # error ("invalid_grant", "Account is not fully set up", ...) was thrown away.
          [ -n "$_tok" ] || { echo "error: no access token for $_email -- Keycloak said: $(printf '%s' "$_tok_resp" | head -c 300)" >&2; return 1; }
          printf '%s' "$_tok"
        }

        # bookinfo_role_of <teamId> -- the display role name that team owns ("prodpage" ->
        # "productpage"). SEED_BOOKINFO_CALLS is written in team ids (that is what a namespace is
        # named after), but the env vars Bookinfo itself reads are named after the ROLE
        # (DETAILS_HOSTNAME, REVIEWS_HOSTNAME, RATINGS_HOSTNAME) -- and for one of the four those
        # two strings differ, because apl-api caps a team name at 9 characters.
        bookinfo_role_of() {
          _bro_team=$1
          for _bro_spec in {{.SEED_BOOKINFO_SERVICES}}; do
            if [ "$(printf '%s' "$_bro_spec" | cut -d: -f2)" = "$_bro_team" ]; then
              printf '%s' "$_bro_spec" | cut -d: -f1
              return 0
            fi
          done
          echo "error: no Bookinfo role owns team '$_bro_team' -- SEED_BOOKINFO_CALLS names a team SEED_BOOKINFO_SERVICES does not" >&2
          return 1
        }

        # wait_for_triggered_build <team> <repo> <not-before-rfc3339> -- bounded wait for the
        # PipelineRun the Gitea webhook just created (observed ~40s-3min depending on the base
        # image). Matched by THIS build's own name prefix, "docker-trigger-build-<repo>-", not
        # "whatever's latest in the namespace" -- several repos' builds land in one team namespace.
        #
        # The <not-before> argument is NOT optional decoration. Matching on the name prefix alone
        # also matches PipelineRuns from EARLIER runs of this seed, which Tekton keeps around
        # indefinitely -- confirmed live 2026-08-29: a rerun against a cluster that still had a
        # months-old succeeded `docker-trigger-build-productpage-*` returned "True" on the first
        # poll, before the freshly pushed commit's own build had even been scheduled. The step
        # passed in under a second and proved nothing at all. The caller captures a UTC timestamp
        # immediately before pushing and passes it here; RFC3339 UTC strings compare correctly
        # lexicographically, and the host and the kind node share a clock.
        #
        # `|| true` on the pipeline: right after the push Tekton's PipelineRun object often does
        # not exist yet at all -- a completely normal state this loop exists to wait through. A
        # transient failure there would otherwise kill the WHOLE function on try 1 through the
        # caller's `set -euo pipefail`, silently, before the explicit timeout message below could
        # ever be reached.
        # <team> <repo> <push-since> [pat] -- the optional PAT enables the lost-delivery recovery
        # below; without it the wait still works, it just cannot rescue a delivery Gitea dropped.
        wait_for_triggered_build() {
          _wb_team=$1
          _wb_repo=$2
          _wb_since=$3
          _wb_pat=${4:-}
          _wb_tries=0
          _wb_status=""
          _wb_refired=false
          while [ "$_wb_tries" -lt 30 ]; do
            _wb_pr=$(kubectl --context "$KIND_CTX" --request-timeout=15s get pipelinerun -n "team-$_wb_team" -o json 2>/dev/null \
              | jq -r --arg p "docker-trigger-build-$_wb_repo-" --arg since "$_wb_since" '
                  [ .items[]
                    | select(.metadata.name | startswith($p))
                    | select(.metadata.creationTimestamp >= $since) ]
                  | sort_by(.metadata.creationTimestamp) | last
                  | if . == null then "" else "\(.metadata.name) \(.status.conditions[0].status // "Unknown") \(.status.conditions[0].reason // "Pending")" end' 2>/dev/null || true)
            _wb_status=$(printf '%s' "$_wb_pr" | awk '{print $2}')
            [ "$_wb_status" = "True" ] && break
            [ "$_wb_status" = "False" ] && break
            _wb_tries=$((_wb_tries + 1))
            # No PipelineRun AT ALL after ~40s means the push delivery was lost, not that the build
            # is slow -- a delivered event creates the run immediately. Gitea never retries, so
            # without this the remaining 26 polls are spent waiting for something that can no longer
            # happen. Re-fired once: a second failure is a real fault worth surfacing.
            if [ -z "$_wb_pr" ] && [ "$_wb_tries" -ge 4 ] && [ "$_wb_refired" = "false" ] && [ -n "$_wb_pat" ]; then
              _wb_refired=true
              echo "  no PipelineRun after ${_wb_tries} tries -- assuming the push delivery was lost"
              gitea_refire_push_hook "team-$_wb_team" "$_wb_repo" "$_wb_pat" || true
            fi
            echo "waiting for the webhook-triggered build of team-$_wb_team/$_wb_repo (try $_wb_tries/30, last: ${_wb_pr:-no PipelineRun yet})..."
            sleep 10
          done
          [ "$_wb_status" = "True" ] || { echo "error: the build for team-$_wb_team/$_wb_repo did not succeed within 300s (last: ${_wb_pr:-no PipelineRun at all})" >&2; return 1; }
          echo "webhook-triggered build succeeded: $_wb_pr"
        }

        # setup_team_service <role> <team> <repo> <upstream-subdir> -- everything one team owns
        # for its one Bookinfo microservice: its Gitea repo and the real upstream source in it,
        # its coderepo + auto-triggered Tekton build, its workload, and its public service.
        # Every fallible call in here carries an explicit `|| return 1`, and that is NOT redundant
        # with the `set -e` below. apl_run_parallel invokes each item from inside an `if` (lib.sh:253
        # explains why it must), and a function called in a condition runs with errexit DISABLED for
        # its entire body -- so a bare failing call is silently ignored and the seed reports success.
        # Found the hard way in setup_team_runner on 2026-08-30: a runner image failed to push, the
        # seed wired an EventListener for an image that did not exist and declared victory, and the
        # merge gate then waited ten minutes on a job no runner could ever accept.
        setup_team_service() {
          set -euo pipefail
          _role=$1
          _team=$2
          _repo=$3
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)

          GITEA_USER=$(gitea_oidc_login "$_email" "$_password")
          GITEA_PAT=$(gitea_mint_pat "$GITEA_USER" "read:user,write:repository,write:organization,read:organization")
          gitea_wait_for_org_permission "$GITEA_USER" "team-$_team" "$GITEA_PAT" "can_create_repository" || return 1

          # agent-<team> also provisions itself in Gitea and lands in the team's org -- no repo
          # creation of its own, dev owns that; this is just "find themselves in their respective
          # team" (agent's OWN Gitea account + org membership sync, same mechanism as dev's, just
          # no follow-up repo work).
          _agent_email="agent-$_team@$DOMAIN"
          _agent_password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_agent.txt)
          _agent_gitea_user=$(gitea_oidc_login "$_agent_email" "$_agent_password")
          # read:user AND read:organization -- the permissions endpoint below 403s without
          # read:user too (confirmed live, same trap already hit and fixed for dev's PAT scope).
          _agent_gitea_pat=$(gitea_mint_pat "$_agent_gitea_user" "read:user,read:organization")
          gitea_wait_for_org_permission "$_agent_gitea_user" "team-$_team" "$_agent_gitea_pat" "can_read" || return 1

          # The vendored tree (upstream Bookinfo + this demo's CI), staged with the verified
          # gitea-runner binary dropped into .gitea/runner/ so the runner image can be built
          # in-cluster from this same repo. No network, no upstream drift.
          _src=$(stage_service_tree "$_role")

          gitea_create_org_repo "team-$_team" "$_repo" "$GITEA_PAT" || return 1

          # Branch protection blocks the force-push below (enable_push:false). On a first run there
          # is nothing to remove; on a re-run against a cluster this seed already protected, this
          # is what stops the push from failing. Re-applied after the push, in seed:gates.
          gitea_unprotect_branch "team-$_team" "$_repo" "$GITEA_PAT" || return 1

          _pushed=false
          # Captured immediately before the push, and only ever moved forward by push_source: this
          # is what stops wait_for_triggered_build from being satisfied by an OLD PipelineRun of
          # the same build left over from a previous run. See its header comment.
          _push_since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          push_source() {
            _push_since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            _ps_rc=0
            gitea_push_tree "team-$_team" "$_repo" "$GITEA_PAT" "$GITEA_USER" "$_src" \
              "Bookinfo $_role, with lint+build CI and its Actions runner build context" || _ps_rc=$?
            case "$_ps_rc" in
              0) _pushed=true ;;
              2) _pushed=false ;;
              *) return 1 ;;
            esac
          }

          API_TOKEN=$(dev_team_token "$_team")

          apl_create_if_missing \
            "$API/v2/teams/$_team/coderepos/$_repo" "$API/v2/teams/$_team/coderepos" "$API_TOKEN" \
            "{\"kind\":\"AplTeamCodeRepo\",\"metadata\":{\"name\":\"$_repo\"},\"spec\":{\"gitService\":\"gitea\",\"repositoryUrl\":\"https://gitea.$DOMAIN/team-$_team/$_repo.git\",\"private\":true}}" \
            "coderepo $_repo ($_team)" || return 1

          # Docker build args, if this service needs any (reviews does: service_version=v3 etc).
          # AplTeamBuild's spec.mode.docker.envVars maps 1:1 onto kaniko's --build-arg -- see
          # charts/team-ns/templates/builds/docker.yaml. No chart change was needed for this.
          _build_args=""
          for _spec in {{.SEED_BOOKINFO_BUILD_ARGS}}; do
            case "$_spec" in
              "$_team:"*) _build_args=${_spec#*:} ;;
            esac
          done
          _envvars='[]'
          if [ -n "$_build_args" ]; then
            _envvars=$(printf '%s' "$_build_args" | tr ',' '\n' \
              | jq -R 'select(length > 0) | {name: (split("=")[0]), value: (split("=")[1:] | join("="))}' \
              | jq -sc .)
          fi
          apl_create_if_missing \
            "$API/v2/teams/$_team/builds/$_repo" "$API/v2/teams/$_team/builds" "$API_TOKEN" \
            "$(jq -n --arg name "$_repo" --arg url "https://gitea.$DOMAIN/team-$_team/$_repo.git" --argjson env "$_envvars" \
              '{kind:"AplTeamBuild", metadata:{name:$name}, spec:{imageName:$name, tag:"main", trigger:true, scanSource:false, mode:{type:"docker", docker:({repoUrl:$url, path:"./Dockerfile", revision:"main"} + (if ($env|length) > 0 then {envVars:$env} else {} end))}}}')" \
            "build $_repo ($_team)" || return 1

          # Bounded wait for the operator to reconcile the build into an actual Gitea webhook on
          # THIS repo (checked directly, not guessed at with a fixed sleep) before pushing content.
          _tries=0
          _hooks=0
          while [ "$_tries" -lt 18 ]; do
            # `|| true` on the pipeline: under `set -euo pipefail` a single transient curl/jq
            # failure would abort the step outright instead of being retried by this loop.
            _hooks=$(curl -sk --max-time 10 "https://gitea.$DOMAIN/api/v1/repos/team-$_team/$_repo/hooks" -H "Authorization: token $GITEA_PAT" 2>/dev/null | jq -r 'length' 2>/dev/null || true)
            [ "${_hooks:-0}" -gt 0 ] && break
            _tries=$((_tries + 1))
            sleep 10
          done
          [ "${_hooks:-0}" -gt 0 ] || { echo "error: no Gitea webhook appeared for team-$_team/$_repo within 180s" >&2; return 1; }

          # Registered in Gitea's webhook config != actually able to receive it. Confirmed live:
          # pushing content immediately after the check above raced the EventListener pod's own
          # startup (its istio-proxy sidecar wasn't ready yet) -- Gitea's push landed, was
          # delivered, and got back a hard "503 no healthy upstream" from Envoy (visible in
          # gitea's own hook_task table, not surfaced anywhere else). Gitea does NOT retry a
          # failed webhook delivery on its own, so that push's PipelineRun simply never happened
          # -- no error, just an indefinite wait later for a build that was never triggered. Wait
          # for the EventListener Deployment itself to be Available first, same pattern
          # enable-apps already uses for gitea/harbor/tekton. It is named after the BUILD:
          # "el-gitea-webhook-<repo>".
          _tries=0
          while [ "$_tries" -lt 18 ]; do
            _avail=$(kubectl --context "$KIND_CTX" --request-timeout=15s get deploy "el-gitea-webhook-$_repo" -n "team-$_team" \
              -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
            [ "${_avail:-0}" -ge 1 ] 2>/dev/null && break
            _tries=$((_tries + 1))
            sleep 5
          done
          [ "${_avail:-0}" -ge 1 ] || { echo "error: el-gitea-webhook-$_repo never became Available within 90s" >&2; return 1; }

          push_source

          # What actually produces the image, in the three states this can be in.
          if [ "$_pushed" = "true" ]; then
            wait_for_triggered_build "$_team" "$_repo" "$_push_since" "$GITEA_PAT" || return 1
          elif harbor_has_tag "team-$_team" "$_repo" main; then
            # Source unchanged AND an image already exists -- a rerun against an already-seeded
            # cluster costs no build at all. This is the whole point of gitea_push_tree's
            # deterministic commit SHA.
            echo "harbor.$DOMAIN/team-$_team/$_repo:main already exists and the source is unchanged -- no rebuild needed"
          else
            echo "error: team-$_team/$_repo is already at the expected commit but harbor.$DOMAIN/team-$_team/$_repo:main does not exist," >&2
            echo "       so a previous build must have failed. Look at 'kubectl get pipelinerun -n team-$_team'; any new commit" >&2
            echo "       pushed to that repo re-triggers the build." >&2
            return 1
          fi

          # Public = world-readable, still team-writable. Harbor's public flag grants anonymous
          # PULL only: a request asking for push against a public project is issued a token whose
          # access is ["pull"] and nothing more (verified live 2026-08-30 against this lab's own
          # token service), so write access stays exactly where it was -- with the project's
          # members, whose membership is OIDC-driven like the rest of the platform.
          #
          # Needed because the platform operator creates every team project PRIVATE and
          # harbor-pullsecret is team-scoped, so team-reviews cannot pull team-prodpage/productpage.
          # That is what blocks a whole Bookinfo environment from running in ONE namespace, which is
          # what an ephemeral per-PR environment needs. AGENT-ENVIRONMENTS.md section 10 recorded
          # this as applied live and NOT yet seeded; this is that gap closed. In this lab "public"
          # means company-internal, the same reading already used for the Gitea repos.
          #
          # Placed after the build, not before: nothing here needs it earlier (the team's own
          # kaniko push authenticates as the team), and by this point the project is certain to
          # exist because the image was just pushed into it.
          harbor_make_project_public "team-$_team" || return 1

          # Fresh token: the build above can take many minutes, far past the 60s token lifespan.
          API_TOKEN=$(dev_team_token "$_team")
          _image_repo="harbor.$DOMAIN/team-$_team/$_repo"

          # The cross-team wiring, from SEED_BOOKINFO_CALLS: for every service THIS one calls,
          # a <CALLEE>_HOSTNAME/<CALLEE>_SERVICE_PORT pair pointing at the callee's in-cluster
          # Service DNS name -- NOT at its public route. Bookinfo's own source (productpage.py,
          # LibertyRestEndpoint.java) builds these URLs as plain http:// and follows no redirects,
          # and the public route answers HTTP with a 301 to HTTPS; going that way produces
          # "Ratings service is currently unavailable" and nothing more informative.
          _env_file=$(mktemp)
          for _call in {{.SEED_BOOKINFO_CALLS}}; do
            _caller=${_call%%:*}
            _callee=${_call#*:}
            [ "$_caller" = "$_team" ] || continue
            _callee_upper=$(bookinfo_role_of "$_callee" | tr '[:lower:]' '[:upper:]')
            printf '  - name: %s_HOSTNAME\n    value: %s.team-%s.svc.cluster.local\n  - name: %s_SERVICE_PORT\n    value: "%s"\n' \
              "$_callee_upper" "{{.SEED_WORKLOAD_NAME}}" "$_callee" "$_callee_upper" "{{.SEED_SERVICE_PORT}}" >> "$_env_file"
          done

          # podLabels is on EVERY service, not just the ones that are called into: it costs
          # nothing, and it means the netpol step never has to care which of the four happens to
          # be a callee today. See SEED_NETPOL_LABEL_NAME for the two traps behind this label.
          VALUES=$(printf 'image:\n  repository: %s\n  tag: main\nservicePorts:\n  - port: %s\n    targetPort: %s\n    protocol: TCP\n    name: http\npodLabels:\n  %s: %s\n' \
            "$_image_repo" "{{.SEED_SERVICE_PORT}}" "{{.SEED_SERVICE_PORT}}" "{{.SEED_NETPOL_LABEL_NAME}}" "{{.SEED_NETPOL_LABEL_VALUE}}")
          if [ -s "$_env_file" ]; then
            VALUES=$(printf '%s\nenv:\n%s' "$VALUES" "$(cat "$_env_file")")
          fi
          rm -f "$_env_file"

          # imageUpdateStrategy is what wires real GitOps auto-redeploy: the ArgoCD Image Updater
          # watches the Harbor repo and rewrites image.repository/image.tag in the values repo when
          # a new digest is pushed. imageParameter/tagParameter and the full harbor.<domain>/
          # prefix on imageRepository are ALL required for it to fire at all -- confirmed live,
          # twice, in two different demos.
          apl_create_if_missing \
            "$API/v2/teams/$_team/workloads/{{.SEED_WORKLOAD_NAME}}" "$API/v2/teams/$_team/workloads" "$API_TOKEN" \
            "$(jq -n --arg name "{{.SEED_WORKLOAD_NAME}}" --arg values "$VALUES" --arg url "{{.SEED_CATALOG_CHART_URL}}" \
                --arg path "{{.SEED_WORKLOAD_CHART_PATH}}" --arg repo "$_image_repo" \
              '{kind:"AplTeamWorkload", metadata:{name:$name}, spec:{url:$url, chartProvider:"git", path:$path, revision:"main", values:$values, imageUpdateStrategy:{type:"digest", digest:{imageRepository:$repo, tag:"main", imageParameter:"image.repository", tagParameter:"image.tag"}}}}')" \
            "workload {{.SEED_WORKLOAD_NAME}} ($_team)" || return 1

          # useDefaultHost gives each team its own public URL at
          # https://{{.SEED_WORKLOAD_NAME}}-<team>.<domain>/ (routes.yaml names the host
          # "<serviceName>-<teamId>"). Handy for poking one microservice directly; the cross-team
          # calls above deliberately do NOT go through it.
          apl_create_if_missing \
            "$API/v2/teams/$_team/services/{{.SEED_WORKLOAD_NAME}}" "$API/v2/teams/$_team/services" "$API_TOKEN" \
            "$(jq -n --arg name "{{.SEED_WORKLOAD_NAME}}" --argjson port {{.SEED_SERVICE_PORT}} \
              '{kind:"AplTeamService", metadata:{name:$name}, spec:{port:$port, ingress:{type:"public", useDefaultHost:true}}}')" \
            "service {{.SEED_WORKLOAD_NAME}} ($_team)" || return 1

          # Bounded wait for the public route to actually serve this microservice. /health, not
          # /: all four Bookinfo services expose it, but only productpage serves anything at the
          # document root.
          _tries=0
          _code=""
          while [ "$_tries" -lt 30 ]; do
            _code=$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' "https://{{.SEED_WORKLOAD_NAME}}-$_team.$DOMAIN/health" 2>/dev/null || true)
            [ "$_code" = "200" ] && break
            _tries=$((_tries + 1))
            echo "waiting for https://{{.SEED_WORKLOAD_NAME}}-$_team.$DOMAIN/health (try $_tries/30, last: $_code)..."
            sleep 10
          done
          [ "$_code" = "200" ] || { echo "error: https://{{.SEED_WORKLOAD_NAME}}-$_team.$DOMAIN/health never returned 200 (last: $_code)" >&2; return 1; }
        }

        # See seed:runners for why this is an adapter rather than a signature change.
        setup_team_service_spec() {
          setup_team_service \
            "$(printf '%s' "$1" | cut -d: -f1)" \
            "$(printf '%s' "$1" | cut -d: -f2)" \
            "$(printf '%s' "$1" | cut -d: -f3)"
        }

        # Was a serial loop: 196+109+171+114 = 590s. Every one of those numbers is dominated by
        # WAITING -- up to 180s for the Gitea webhook to appear, 90s for the EventListener, minutes
        # for the build, up to 300s for the health check -- against four independent namespaces.
        # The only shared resource is the git values repo behind apl-api, and every write to it
        # goes through apl_create_if_missing, which now takes a lock.
        #
        # NOT wrapped in apl_run: see apl_run_parallel's comment in lib.sh.
        apl_run_parallel seed-apps "Setting up each team's Bookinfo microservice (as its own dev user)" \
          setup_team_service_spec {{.SEED_BOOKINFO_SERVICES}} || exit $?
        apl_ok "bookinfo microservices live: $(for S in {{.SEED_BOOKINFO_SERVICES}}; do printf 'https://{{.SEED_WORKLOAD_NAME}}-%s.%s/ ' "$(printf '%s' "$S" | cut -d: -f2)" "$DOMAIN"; done)"
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"

        # Every team is created with networkPolicy.ingressPrivate: true (seed:teams), which allows
        # ingress ONLY from istio-system/knative-serving/monitoring/tekton-pipelines -- not from
        # another team's namespace. So productpage -> details/reviews and reviews -> ratings are
        # blocked by default even though the Service DNS names resolve perfectly.
        #
        # The platform has a proper, scoped, self-service mechanism for exactly this: an
        # AplTeamNetworkControl per callee (values-schema.yaml's `netpol` definition). Four things
        # about it cost real time to find, all encoded below:
        #
        #  1. It needs its OWN endpoint -- POST /v2/teams/{team}/netpols. Nesting a `netpols`
        #     array inside the team's AplTeamSettingSet body (POST /v2/teams) returns HTTP 200 and
        #     LOOKS like it worked, but it is silently a no-op: apl-api's values assembly only ever
        #     scans separate per-resource files at env/teams/<team>/netpols/*.yaml, the same
        #     convention builds/ codeRepos/ workloads/ services/ each already follow. A netpol
        #     nested in settings.yaml is invisible to that scan, forever.
        #  2. The kind is AplTeamNetworkControl, not ...NetworkPolicy.
        #  3. toLabelName may not contain "/" (apl-api rejects the pattern), so a normal qualified
        #     Kubernetes label cannot be used -- hence the custom podLabels label the workloads
        #     above carry. See SEED_NETPOL_LABEL_NAME for trap 4, the "true"/"false" coercion.
        #  4. networkPolicy.ingressPrivate must STAY true. The chart template that renders
        #     custom-network-policies.yaml only fires when it is -- flipping it to false is a
        #     coarser "allow every namespace" fallback, not a shortcut to the same thing.
        #
        # As platform-admin: teams are created with selfService.teamMembers.editSecurityPolicies
        # false, so dev-<team> genuinely may not write one of these. That is the platform working
        # as configured, not something to work around.
        create_netpol() {
          set -euo pipefail
          _caller=$1
          _callee=$2
          _token=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          _name="allow-$_caller"
          apl_create_if_missing \
            "$API/v2/teams/$_callee/netpols/$_name" "$API/v2/teams/$_callee/netpols" "$_token" \
            "$(jq -n --arg name "$_name" --arg ns "team-$_caller" \
                --arg ln "{{.SEED_NETPOL_LABEL_NAME}}" --arg lv "{{.SEED_NETPOL_LABEL_VALUE}}" \
              '{kind:"AplTeamNetworkControl", metadata:{name:$name}, spec:{ruleType:{type:"ingress", ingress:{toLabelName:$ln, toLabelValue:$lv, mode:"AllowOnly", allow:[{fromNamespace:$ns}]}}}}')" \
            "netpol $_name ($_callee)"
        }
        for CALL in {{.SEED_BOOKINFO_CALLS}}; do
          CALLER=${CALL%%:*}
          CALLEE=${CALL#*:}
          apl_run "seed-apps-netpol-$CALLEE-$CALLER" \
            "Allowing team-$CALLER to reach team-$CALLEE's pods (AplTeamNetworkControl)" \
            create_netpol "$CALLER" "$CALLEE" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        # The check that actually proves the demo, rather than proving four independent pods are
        # up: productpage's own rendered HTML has to carry content that can ONLY have come from
        # the other three teams' namespaces.
        #   "Shakespeare" / "paperback"  -> team-details answered           (productpage -> details)
        #   "Reviewer1" / "Reviewer2"    -> team-reviews answered           (productpage -> reviews)
        #   glyphicon-star               -> team-ratings answered           (reviews -> ratings)
        # The stars are the important one: reviews v3 renders them only when the ratings call
        # succeeded, and prints "Ratings service is currently unavailable" instead when it did
        # not -- which is exactly what a missing netpol, or an internal call routed through the
        # public HTTP->HTTPS redirect, looks like. An HTTP 200 alone proves none of this.
        PRODPAGE_TEAM=$(for S in {{.SEED_BOOKINFO_SERVICES}}; do
          case "$S" in productpage:*) printf '%s' "$S" | cut -d: -f2 ;; esac
        done)
        verify_bookinfo() {
          _url="https://{{.SEED_WORKLOAD_NAME}}-$PRODPAGE_TEAM.$DOMAIN/productpage"
          _tries=0
          while [ "$_tries" -lt 30 ]; do
            _body=$(curl -sk --max-time 20 "$_url" 2>/dev/null || true)
            _missing=""
            for _marker in Shakespeare paperback Reviewer1 Reviewer2 glyphicon-star; do
              printf '%s' "$_body" | grep -q "$_marker" || _missing="$_missing $_marker"
            done
            if [ -z "$_missing" ]; then
              echo "$_url renders details, reviews AND star ratings -- all four teams answered"
              return 0
            fi
            _tries=$((_tries + 1))
            echo "waiting for the full cross-team page at $_url (try $_tries/30, still missing:$_missing)..."
            sleep 10
          done
          echo "error: $_url never rendered the full cross-team page (still missing:$_missing)" >&2
          echo "       last response, first 600 bytes: $(printf '%s' "$_body" | head -c 600)" >&2
          return 1
        }
        apl_run seed-apps-verify-bookinfo \
          "Verifying the whole Bookinfo call chain end to end through productpage's rendered page" \
          verify_bookinfo || exit $?
        apl_ok "bookinfo demo verified end to end: https://{{.SEED_WORKLOAD_NAME}}-$PRODPAGE_TEAM.$DOMAIN/productpage"

  runners:
    desc: "Per-team ephemeral Gitea Actions runner: image built by this platform's own Tekton pipeline, deployed as a team workload"
    deps: [apps]
    # Polls four Tekton builds and four runner registrations, printing progress as it goes --
    # Taskfile.yml's global `output: group` would buffer all of it until the task ended. See
    # CLAUDE.md's note on `interactive: true`.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"
        export SEED_VENDOR_DIR="{{.ROOT_DIR}}/{{.SEED_BOOKINFO_VENDOR}}"
        export SEED_RUNNER_URL="{{.SEED_RUNNER_URL}}"
        export SEED_RUNNER_SHA256="{{.SEED_RUNNER_SHA256}}"
        export SEED_RUNNER_VERSION="{{.SEED_RUNNER_VERSION}}"
        # harbor_has_tag and harbor_delete_tag below both need this. This task previously carried no
        # Harbor credential at all -- so every harbor_has_tag here was refused and answered "no
        # tag", meaning the "already in Harbor, skipping" branch could never fire and a rerun
        # rebuilt all four runner images even when they were current.
        export OAUTH2_PROXY_CLIENT_SECRET_NAME="{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}"
        # Once, here, before any parallel work: Harbor treats a bearer for a user it has never seen
        # as ANONYMOUS, so without this every harbor_* call reads only public projects and writes
        # 401. See harbor_ensure_platform_admin for why it must be platform-admin and not a team
        # admin (team groups are bound as developer; projectAdmin goes to an empty group).
        harbor_ensure_platform_admin || exit $?

        # Same 60-second-token discipline as seed:apps -- this task waits minutes for image builds,
        # so a token fetched up front would be long dead by the time it is used.
        dev_team_token() {
          _team=$1
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)
          _client_ns=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret -A \
            --field-selector "metadata.name={{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}" \
            -o jsonpath='{.items[0].metadata.namespace}')
          _client_id=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} \
            -n "$_client_ns" -o jsonpath='{.data.client-id}' | base64 -d)
          _client_secret=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} \
            -n "$_client_ns" -o jsonpath='{.data.client-secret}' | base64 -d)
          _tok_resp=$(curl -sk --max-time 15 "https://keycloak.$DOMAIN{{.KEYCLOAK_REALM_PATH}}/protocol/openid-connect/token" \
            --data-urlencode grant_type=password --data-urlencode client_id="$_client_id" --data-urlencode client_secret="$_client_secret" \
            --data-urlencode username="$_email" --data-urlencode password="$_password" --data-urlencode scope=openid)
          _tok=$(printf '%s' "$_tok_resp" | jq -r '.access_token // empty' 2>/dev/null || true)
          [ -n "$_tok" ] || { echo "error: no access token for $_email -- Keycloak said: $(printf '%s' "$_tok_resp" | head -c 300)" >&2; return 1; }
          printf '%s' "$_tok"
        }

        # wait_for_runner_build <team> <build-name> -- bounded wait on the ONE-SHOT PipelineRun a
        # `trigger: false` build renders (ArgoCD creates it at sync-wave 5, named after the build,
        # not generateName'd like the webhook-triggered ones).
        #
        # A terminal failure is retried EXACTLY ONCE, by deleting the run so ArgoCD recreates it.
        # Without that, a one-shot run is unrecoverable: it stays Failed forever, no re-run of the
        # seed can clear it, and the only escape is SEED_FORCE_RUNNER_BUILD -- a flag whose
        # documented job is "I changed the Dockerfile", not "the registry blipped". Confirmed live
        # 2026-08-30: kaniko built prodpage's runner fine and failed the PUSH with DIGEST_INVALID
        # (a corrupt blob upload; the other three teams pushed the same base layers seconds later),
        # which wedged the whole seed behind a merge gate no runner could satisfy.
        #
        # ONE retry, deliberately. It is what separates "the registry blipped" from "this Dockerfile
        # does not build" -- retrying forever would hide the second case behind a 30-minute wait.
        # The retry does NOT delete the Harbor tag: this is recovery, not a forced rebuild, and
        # conflating the two would let it mask a legitimate skip.
        wait_for_runner_build() {
          _wrb_team=$1
          _wrb_name=$2
          _wrb_pr="docker-build-$_wrb_name"
          _wrb_i=0
          _wrb_retried=false
          # UID of a run we have deleted, so its terminal status is never read again. A name-based
          # check cannot express this: the recreated run carries the SAME name, and for the seconds
          # between the delete call and ArgoCD's recreate, `get` still returns the old object. That
          # is the same stale-run trap that let a completed run from an earlier seed satisfy this
          # function in ~3 seconds -- see the SEED_FORCE_RUNNER_BUILD comment below.
          _wrb_dead_uid=""
          # 90 x 20s = 30 minutes: the reviews runner is a ~700MB Java image and this cluster
          # builds it from scratch the first time.
          while [ "$_wrb_i" -lt 90 ]; do
            _wrb_i=$((_wrb_i + 1))
            # One call for both fields: two calls could straddle a recreate and pair a fresh UID
            # with the dead run's status.
            _wrb_got=$(kubectl --context "$KIND_CTX" --request-timeout=15s -n "team-$_wrb_team" \
              get pipelinerun "$_wrb_pr" -o jsonpath='{.metadata.uid}{"|"}{.status.conditions[0].reason}' 2>/dev/null || true)
            _wrb_uid=${_wrb_got%%|*}
            _wrb_status=${_wrb_got#*|}
            [ "$_wrb_got" = "$_wrb_uid" ] && _wrb_status=""
            # The run we killed is still being served by the API. Not an outcome -- keep waiting.
            if [ -n "$_wrb_dead_uid" ] && [ "$_wrb_uid" = "$_wrb_dead_uid" ]; then
              _wrb_status=""
            else
              case "$_wrb_status" in
                Succeeded | Completed) echo "  build $_wrb_pr succeeded"; return 0 ;;
                Failed | PipelineRunTimeout | CouldntGetPipeline | PipelineRunCouldntCancel)
                  echo "error: PipelineRun $_wrb_pr ended '$_wrb_status' in team-$_wrb_team" >&2
                  kubectl --context "$KIND_CTX" --request-timeout=15s -n "team-$_wrb_team" \
                    get pipelinerun "$_wrb_pr" -o jsonpath='{.status.conditions[0].message}' >&2 2>/dev/null || true
                  if [ "$_wrb_retried" = "true" ]; then
                    echo "error: $_wrb_pr failed again after a retry -- this is a real build failure, not a transient one" >&2
                    return 1
                  fi
                  _wrb_retried=true
                  _wrb_dead_uid=$_wrb_uid
                  echo "  retrying $_wrb_pr once: deleting the failed run so ArgoCD recreates it (sync-wave 5)"
                  kubectl --context "$KIND_CTX" --request-timeout=30s -n "team-$_wrb_team" \
                    delete pipelinerun "$_wrb_pr" --ignore-not-found >/dev/null 2>&1 || true
                  # Full budget for the rebuild: the failure may have come minutes in, and a cold
                  # ~700MB Java image genuinely needs the whole 30 minutes.
                  _wrb_i=0
                  _wrb_status=""
                  ;;
                *) : ;;
              esac
            fi
            [ $((_wrb_i % 3)) -eq 0 ] && echo "  building $_wrb_pr (${_wrb_status:-not created yet}, ${_wrb_i}/90)"
            sleep 20
          done
          echo "error: PipelineRun $_wrb_pr never completed in team-$_wrb_team" >&2
          return 1
        }

        # setup_team_runner <role> <team> <repo> -- the team's own CI runner, end to end:
        # a second build off the repo it already owns, a registration token, and a workload.
        setup_team_runner() {
          set -euo pipefail
          _role=$1
          _team=$2
          _repo=$3
          _build="$_repo-runner"
          _image_repo="harbor.$DOMAIN/team-$_team/{{.SEED_RUNNER_IMAGE_NAME}}"

          API_TOKEN=$(dev_team_token "$_team")

          # trigger:false, unlike the app build. Two reasons, both deliberate:
          #   * with a webhook trigger, EVERY app commit would rebuild the runner image and roll
          #     the runner pods mid-demo, for a Dockerfile that did not change;
          #   * a trigger:false build renders a plain one-shot PipelineRun instead of an
          #     EventListener, which is all this needs.
          # It is created AFTER seed:apps has pushed, because that PipelineRun starts as soon as
          # ArgoCD syncs and would fail against an empty repo.
          apl_create_if_missing \
            "$API/v2/teams/$_team/builds/$_build" "$API/v2/teams/$_team/builds" "$API_TOKEN" \
            "$(jq -n --arg name "$_build" --arg image "{{.SEED_RUNNER_IMAGE_NAME}}" \
                --arg url "https://gitea.$DOMAIN/team-$_team/$_repo.git" \
              '{kind:"AplTeamBuild", metadata:{name:$name}, spec:{imageName:$image, tag:"main", trigger:false, scanSource:false, mode:{type:"docker", docker:{repoUrl:$url, path:"./.gitea/runner/Dockerfile", revision:"main"}}}}')" \
            "runner build $_build ($_team)"

          # The runner build is trigger:false, so nothing rebuilds it on a push -- and this skip
          # means a CHANGED .gitea/runner/Dockerfile can never reach a cluster that already has the
          # image. Fine for the demo's steady state, and a real trap while iterating on that
          # Dockerfile: the seed reports success having built nothing. Confirmed live 2026-08-30,
          # when a PATH fix in the runner image was silently ignored for a whole seed run.
          #
          # SEED_FORCE_RUNNER_BUILD=true deletes the tag first, which is what makes the build run.
          # A fresh cluster never needs it: there is no tag, so the current Dockerfile always wins.
          # Read from the process environment, NOT as a go-task template var: this repo's other
          # toggles (NONINTERACTIVE, *_ENABLED) are shell-level, and a plain `VAR=true go-task ...`
          # does not populate {{.VAR}}. Getting that wrong is silent -- the flag simply does
          # nothing and the skip below still fires, which is exactly how it was found.
          if [ "${SEED_FORCE_RUNNER_BUILD:-false}" = "true" ]; then
            harbor_delete_tag "team-$_team" "{{.SEED_RUNNER_IMAGE_NAME}}" main || true
            # Deleting the tag alone changes nothing: docker-build-<name> is a chart-defined,
            # one-shot PipelineRun that has ALREADY succeeded, and wait_for_runner_build below is
            # satisfied the moment it sees that. Deleting it makes ArgoCD recreate it (sync-wave 5),
            # and the recreated run builds from current main.
            kubectl --context "$KIND_CTX" --request-timeout=30s -n "team-$_team" \
              delete pipelinerun "docker-build-$_build" --ignore-not-found >/dev/null 2>&1 || true
            echo "  forced rebuild: removed the tag and the completed PipelineRun for $_build"
          fi
          if harbor_has_tag "team-$_team" "{{.SEED_RUNNER_IMAGE_NAME}}" main; then
            apl_skip "runner image already in Harbor for team-$_team (SEED_FORCE_RUNNER_BUILD=true rebuilds it)"
          else
            # `|| return 1` is NOT redundant with this function's `set -e`. apl_run_parallel calls
            # every item from inside an `if` (see lib.sh:253 for why it must), and a function called
            # in a condition runs with errexit DISABLED for its whole body -- so a bare failing call
            # here is ignored. Confirmed live 2026-08-30: prodpage's runner build failed its push
            # with DIGEST_INVALID, wait_for_runner_build correctly returned 1, and the seed went on
            # to mint a token and wire an EventListener for an image that did not exist, then
            # reported "all four teams create a CI runner on demand". The gate then sat on a job no
            # runner could ever take (ImagePullBackOff) until it timed out 10 minutes later.
            # Every other fallible call in this function is guarded the same way for this reason.
            wait_for_runner_build "$_team" "$_build" || return 1
          fi

          # The registration token is a runtime credential for demo content, NOT platform
          # configuration -- CLAUDE.md rule 6 ("configuration lives in the git values repo") does
          # not apply, and there is no values-repo mechanism for this. It is reusable across every
          # re-registration an ephemeral runner performs, which is what lets one Secret serve the
          # whole recycling loop.
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)
          GITEA_USER=$(gitea_oidc_login "$_email" "$_password")
          GITEA_PAT=$(gitea_mint_pat "$GITEA_USER" "read:user,write:repository,write:organization,read:organization")
          # No Argo CD repo credential is needed to sync the runner workload: the team repos are
          # created readable (gitea_create_org_repo), so Argo CD clones the chart anonymously.
          # Write access is still limited to the team, via Gitea org membership. See that
          # function's comment for why this is both more realistic and one fewer secret.
          _reg_token=$(gitea_mint_runner_token "team-$_team" "$GITEA_PAT")
          kubectl --context "$KIND_CTX" --request-timeout=15s -n "team-$_team" \
            create secret generic gitea-actions-runner-token \
            --from-literal=token="$_reg_token" --dry-run=client -o yaml \
            | kubectl --context "$KIND_CTX" --request-timeout=15s apply -f - >/dev/null
          echo "registration token stored in team-$_team/gitea-actions-runner-token"

          API_TOKEN=$(dev_team_token "$_team")
          # image is the repo WITHOUT a tag; the chart joins it with imageTag.
          #
          # Deliberately NO imageUpdateStrategy on this workload, unlike the app workload. Digest
          # pinning is the wrong model for a CI runner: it freezes the pod on one build, and a
          # rebuilt runner image then never reaches the cluster. Confirmed live -- after a rebuild
          # Harbor's :main pointed at a new digest while the Deployment stayed pinned to the old
          # one (which no longer even carried a tag), and the image updater logged
          # "images_considered=2 images_updated=0".
          #
          # Instead the runner tracks the mutable :main tag with imagePullPolicy: Always. Every job
          # runs in a BRAND-NEW pod (see the chart), so each one re-resolves the tag on creation
          # and a rebuilt image is picked up by the next job with nothing else in the loop. The app
          # workload keeps its digest pinning; a deployed application genuinely does want a
          # reproducible, pinned image, which is the opposite requirement.
          RUNNER_VALUES=$(printf 'teamId: %s\nimage: %s\nimageTag: main\ngiteaInstanceUrl: https://gitea.%s\n' \
            "$_team" "$_image_repo" "$DOMAIN")
          # The chart lives in the team's OWN repo, next to the Dockerfile it deploys -- one repo
          # holding both halves of the runner.
          #
          # Two things about re-runs, both learned the hard way:
          #   * apl_create_if_missing SKIPS an existing workload, so edits to RUNNER_VALUES below
          #     do not reach a cluster that already has this workload. The chart itself is read
          #     from git on every sync, so chart edits do land -- it is only the values that are
          #     sticky. To change values on an existing cluster, delete the workload first.
          #   * the runner build is trigger:false, so pushing a new Dockerfile or runner config
          #     rebuilds NOTHING. To force one: push first, then DELETE THIS BUILD via apl-api
          #     (DELETE /v2/teams/<team>/builds/<repo>-runner) and re-run this task. Deleting the
          #     rendered PipelineRun and waiting for ArgoCD to restore it does not reliably work --
          #     the team-ns Application goes OutOfSync and names that exact resource, selfHeal is
          #     on, and a sync still completes "Succeeded" without recreating it (seen on three of
          #     four teams; the fourth healed normally). Full account in GITEA-ACTIONS-CI.md.
          apl_create_if_missing \
            "$API/v2/teams/$_team/workloads/{{.SEED_RUNNER_IMAGE_NAME}}" "$API/v2/teams/$_team/workloads" "$API_TOKEN" \
            "$(jq -n --arg name "{{.SEED_RUNNER_IMAGE_NAME}}" --arg values "$RUNNER_VALUES" \
                --arg url "https://gitea.$DOMAIN/team-$_team/$_repo.git" \
              '{kind:"AplTeamWorkload", metadata:{name:$name}, spec:{url:$url, chartProvider:"git", path:".gitea/runner/chart", revision:"main", values:$values}}')" \
            "runner workload ($_team)"

          # There is NO runner to wait for now -- at rest a team has zero runner pods, by design.
          # What must exist instead is the EventListener that turns a queued job into one. Gate on
          # its Deployment becoming Available: until it is, Gitea's delivery gets no answer, and
          # because Gitea does NOT retry a failed delivery that job never gets a runner at all.
          _el="el-gitea-workflowjob-$_team"
          _we_i=0
          while [ "$_we_i" -lt 60 ]; do
            _we_i=$((_we_i + 1))
            _avail=$(kubectl --context "$KIND_CTX" --request-timeout=15s -n "team-$_team" \
              get deploy "$_el" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
            [ "${_avail:-0}" -ge 1 ] 2>/dev/null && break
            [ $((_we_i % 6)) -eq 0 ] && echo "  waiting for $_el to become Available (${_we_i}/60)"
            sleep 10
          done
          [ "${_avail:-0}" -ge 1 ] 2>/dev/null \
            || { echo "error: $_el never became Available in team-$_team" >&2; return 1; }
          echo "$_el is Available -- queued jobs will now create runners on demand"

          # The webhook that feeds it. SEPARATE from the build webhook the AplTeamBuild creates:
          # that one is push-only, and this one must not be, so they cannot be merged.
          gitea_ensure_workflowjob_hook "team-$_team" "$_repo" "$GITEA_PAT" "$_el" || return 1

          # Drain whatever queued before any of the above existed.
          #
          # Not a bootstrap hack -- it is the permanent recovery path. seed:apps pushes to main
          # long before this task runs, so that push's CI job is already queued while there is no
          # webhook and no EventListener to hear about it. Gitea fires `workflow_job` exactly once
          # and never retries, so without this the very first CI run of every team would sit
          # queued forever and seed:gates would block until it timed out.
          #
          # The same applies any time a delivery is lost (EventListener restarting, a netpol
          # change, Gitea restarting mid-delivery), which is why this is a reusable function rather
          # than something inlined here.
          runner_drain_queued "$_team" "$_repo" "$GITEA_PAT" || return 1

          # Wait for Argo to have applied the pushed chart before judging any CI result. The
          # EventListener being Available says a sink is answering, NOT that it is answering with
          # the current template -- those are different facts, and only the second one matters for
          # what a runner pod ends up looking like.
          _cra="team-$_team-ci-runner"
          _cs_i=0
          while [ "$_cs_i" -lt 30 ]; do
            _cs_i=$((_cs_i + 1))
            _cs=$(kubectl --context "$KIND_CTX" --request-timeout=15s -n argocd \
              get application "$_cra" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            [ "$_cs" = "Synced" ] && break
            [ $((_cs_i % 6)) -eq 0 ] && echo "  waiting for $_cra to report Synced (${_cs_i}/30, last: ${_cs:-unknown})"
            sleep 5
          done
          [ "$_cs" = "Synced" ] || echo "  warning: $_cra is ${_cs:-unknown}, not Synced -- a runner may use a stale template" >&2

          # Then replay anything that failed against the template it superseded.
          runner_rerun_stale_failures "$_team" "$_repo" "$GITEA_PAT" || return 1
        }

        # apl_run_parallel hands each item to the function as ONE argument, so this adapter splits
        # the "role:team:repo" spec rather than changing setup_team_runner's signature.
        setup_team_runner_spec() {
          setup_team_runner \
            "$(printf '%s' "$1" | cut -d: -f1)" \
            "$(printf '%s' "$1" | cut -d: -f2)" \
            "$(printf '%s' "$1" | cut -d: -f3)"
        }

        apl_header "Gitea Actions runners"

        # Was a serial loop: 124+185+154+114 = 577s, i.e. nearly ten minutes of mostly waiting.
        # Each team's runner is an independent image build in its own namespace and Gitea org, and
        # the apl-api writes inside are serialised by apl_create_if_missing's own lock, so there is
        # nothing to order between them.
        #
        # NOT wrapped in apl_run -- that would capture the heartbeat into a log file and leave the
        # terminal silent for the whole run. See apl_run_parallel's comment in lib.sh.
        apl_run_parallel seed-runner "Wiring each team's on-demand CI runner (image + trigger)" \
          setup_team_runner_spec {{.SEED_BOOKINFO_SERVICES}} || exit $?
        apl_ok "all four teams create a CI runner on demand -- zero idle runner pods"

  gates:
    desc: "Wait for each team's lint+build check to go green on main, then protect main behind it"
    deps: [runners]
    # Long polling loops with per-repo progress -- see CLAUDE.md on `interactive: true`.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        # protect_team_repo <team> <repo> -- wait for CI to pass on main, then require it.
        #
        # ORDER IS LOAD-BEARING. The rule sets enable_push:false, which would block the seed's own
        # force-push, so protection is applied only here, after seed:apps has pushed. seed:apps
        # symmetrically removes any existing rule before pushing, so a re-run converges instead of
        # failing.
        protect_team_repo() {
          set -euo pipefail
          _team=$1
          _repo=$2
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)
          GITEA_USER=$(gitea_oidc_login "$_email" "$_password")
          GITEA_PAT=$(gitea_mint_pat "$GITEA_USER" "read:user,write:repository,write:organization,read:organization")

          _sha=$(gitea_head_sha "team-$_team" "$_repo" "$GITEA_PAT")
          [ -n "$_sha" ] || { echo "error: could not read main's HEAD sha for team-$_team/$_repo" >&2; return 1; }
          gitea_wait_actions_run "team-$_team" "$_repo" "$GITEA_PAT" "$_sha" || return 1
          gitea_protect_branch "team-$_team" "$_repo" "$GITEA_PAT" "{{.SEED_CI_STATUS_CONTEXT}}"
        }

        apl_header "Merge gates"
        for SPEC in {{.SEED_BOOKINFO_SERVICES}}; do
          TEAM=$(printf '%s' "$SPEC" | cut -d: -f2)
          REPO=$(printf '%s' "$SPEC" | cut -d: -f3)
          apl_run "seed-gate-$TEAM" "Waiting for team $TEAM's CI to pass, then protecting main" \
            protect_team_repo "$TEAM" "$REPO" || exit $?
        done
        apl_ok "all four repos: CI green on main, main protected behind the 'ci' check"

  vikunja:
    desc: "Provision po/dev/agent in Vikunja via OIDC claim-driven team sync; po's project shared with the team"
    deps: [gates]
    # Same reasoning as apps' interactive: true -- this task's rate-limit-pacing waits (can be
    # 60s+ per team) print live progress that global `output: group` would otherwise buffer until
    # the whole task exits.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        # Confirmed live 2026-08-28: Vikunja team membership comes from a Keycloak group
        # attribute read via a protocol mapper on the "otomi" client, aggregated onto every
        # member of that group -- NOT from us calling Vikunja's team/team-member API at all.
        # This is the claim-driven mechanism VIKUNJA.md Appendix B recorded as "rejected" for the
        # now-removed CONTINUOUS operator (rejected there for being pull-not-push and mutually
        # exclusive with API-managed membership -- neither concern applies to a one-shot script).
        apl_run seed-vikunja-mapper "Ensuring the vikunja-groups Keycloak protocol mapper exists" keycloak_ensure_vikunja_group_mapper || exit $?

        for TEAM in {{.SEED_TEAMS}}; do
          stamp_team() { keycloak_stamp_team_vikunja_group "$1" "Team $(printf '%s' "$1" | sed 's/./\U&/')"; }
          apl_run "seed-vikunja-stamp-$TEAM" "Stamping team-$TEAM's Keycloak group for Vikunja sync" stamp_team "$TEAM" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        setup_team_vikunja() {
          set -euo pipefail
          _team=$1

          # po/dev/agent each need ONE real OIDC login: that is what both creates their Vikunja
          # account (OIDC-JIT-provisioned, same as Gitea) and syncs them into the claim-driven
          # team, all three as ordinary members (po belongs in the team too, alongside dev and
          # agent -- which is what makes the sync trivial: one Keycloak group, everyone already
          # in it from user creation, no special-casing per role).
          #
          # But only when they are not already members. Vikunja's OIDC callback carries a
          # hardcoded, non-configurable 10-requests-per-minute-per-IP limit, and through the
          # Istio mesh all six demo users share ONE bucket (see seed-lib.sh's
          # "Vikunja: rate-limit pacing" block). So the budget is treated as the scarce resource
          # it is: check membership over the AUTHENTICATED API (not rate-limited) and log a user
          # in only if that check says a sync is actually needed. A rerun of an
          # already-provisioned team therefore spends nothing at all, instead of burning six
          # logins to re-prove what is already true.
          #
          # The fixed sleeps that used to sit between logins here (8s within a team, 20s between
          # teams) are gone: they were guesswork against a budget nobody was actually counting,
          # and they could not see retries or adjacent teams. _vikunja_oidc_login_once now paces
          # itself against Vikunja's own X-RateLimit-* headers, which is exact.
          _po_email="po-$_team@$DOMAIN"
          _po_token=$(vikunja_login "$_po_email" "$(cat {{.STATE_DIR}}/seed_pw_${_team}_po.txt)")

          _team_id=$(vikunja_team_id_by_external_id "$_po_token" "kc-team-$_team")
          if [ -z "$_team_id" ]; then
            # A cached token can predate the Keycloak group stamp, and the team is only
            # created/updated during a real login -- so force one and look again.
            _po_token=$(vikunja_oidc_login "$_po_email" "$(cat {{.STATE_DIR}}/seed_pw_${_team}_po.txt)")
            vikunja_cache_token "$_po_email" "$_po_token"
            _team_id=$(vikunja_team_id_by_external_id "$_po_token" "kc-team-$_team")
          fi
          [ -n "$_team_id" ] || { echo "error: no Vikunja team with external_id kc-team-$_team even after a fresh po login -- is the vikunja-groups mapper/group attribute in place?" >&2; return 1; }

          _members=$(vikunja_team_members "$_po_token" "$_team_id")
          for _role in po dev agent; do
            _role_email="$_role-$_team@$DOMAIN"
            if printf '%s\n' "$_members" | grep -Fqx "$_role_email"; then
              echo "$_role_email is already in Vikunja team $_team_id -- no login needed"
              continue
            fi
            _role_token=$(vikunja_oidc_login "$_role_email" "$(cat {{.STATE_DIR}}/seed_pw_${_team}_${_role}.txt)")
            vikunja_cache_token "$_role_email" "$_role_token"
            if [ "$_role" = "po" ]; then _po_token=$_role_token; fi
            _members=$(vikunja_team_members "$_po_token" "$_team_id")
            printf '%s\n' "$_members" | grep -Fqx "$_role_email" \
              || { echo "error: $_role_email logged into Vikunja but did not land in team $_team_id -- claim sync did not fire" >&2; return 1; }
          done

          # Project owned by po (created with po's own token), titled "<team>-example" (not just
          # "<team>" -- the user asked for this explicitly), description links back to the one
          # Gitea repo this team owns: the Bookinfo microservice `apps` (the prior task) already
          # registered and built for it.
          _title="$_team-example"
          _repo=""
          for _bi_spec in {{.SEED_BOOKINFO_SERVICES}}; do
            if [ "$(printf '%s' "$_bi_spec" | cut -d: -f2)" = "$_team" ]; then
              _repo=$(printf '%s' "$_bi_spec" | cut -d: -f3)
            fi
          done
          if [ -n "$_repo" ]; then
            _description="Demo project for team $_team -- Bookinfo microservice: https://gitea.$DOMAIN/team-$_team/$_repo.git"
          else
            _description="Demo project for team $_team"
          fi
          # Rename-in-place if an OLDER run already created a project titled just "$_team" --
          # never creates a second, orphaned project under the new title alongside the old one.
          _project_id=$(vikunja_rename_project_if_needed "$_po_token" "$_team" "$_title" "$_description") \
            || _project_id=$(vikunja_create_project_if_missing "$_po_token" "$_title" "$_description")
          vikunja_share_with_team_if_missing "$_po_token" "$_project_id" "$_team_id" "{{.SEED_VIKUNJA_TEAM_PERMISSION}}"
        }

        # No inter-team sleep any more: the rate-limit budget is shared across teams, so spacing
        # teams apart by a fixed amount was never a bound on anything. _vikunja_oidc_login_once
        # paces every login against Vikunja's own reported budget instead, which covers logins
        # from adjacent teams and from retries alike.
        for TEAM in {{.SEED_TEAMS}}; do
          # Up to 3 tries total, backing off 10s between them. Everything in setup_team_vikunja
          # is idempotent and now membership-aware, so a retry re-does only what is still
          # missing rather than replaying every login.
          _vikunja_tries=0
          _vikunja_ok=false
          while [ "$_vikunja_tries" -lt 3 ]; do
            _vikunja_tries=$((_vikunja_tries + 1))
            if apl_run "seed-vikunja-$TEAM-try$_vikunja_tries" "Provisioning $TEAM in Vikunja (po/dev/agent logins, project, team share), try $_vikunja_tries/3" setup_team_vikunja "$TEAM"; then
              _vikunja_ok=true
              break
            fi
            [ "$_vikunja_tries" -lt 3 ] && sleep 10
          done
          [ "$_vikunja_ok" = "true" ] || { apl_fail "Vikunja provisioning for $TEAM failed after 3 tries -- see the logs above"; exit 1; }
        done
        apl_ok "vikunja provisioned for: {{.SEED_TEAMS}}"

  agents:
    desc: "Agent-workflow catalog: node broker, per-team agent credentials, and the pull-request-agent workload"
    # After vikunja: the agent credential includes a Vikunja API token, which needs Vikunja up and
    # the agent user provisioned (vikunja does that). Also after apps (via vikunja's chain), which
    # makes each team's ci-runner image + Harbor project public -- the node pulls it anonymously.
    deps: [vikunja]
    # Polling/progress and (repo push) prompts -- interactive for the same reason every other task
    # in this file is; see fix-first-login and CLAUDE.md's note on `output: group`.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        apl_header "Agent workflows"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"
        ROOT="{{.ROOT_DIR}}"
        DOMAIN_DASH=$(printf '%s' "$DOMAIN" | tr '.' '-')

        # ---- 1. catalog repo: team-platform/agent-workflows, push the vendored charts ----
        # The charts carry a __DOMAIN__ placeholder (never a baked domain -- CLAUDE.md rule 5);
        # substitute it at push time. Force-push: the seed is the source of truth for this repo.
        setup_catalog_repo() {
          set -eu
          _plat_login=$(kubectl --context "$KIND_CTX" --request-timeout=20s exec -n gitea deploy/gitea -c gitea -- \
            gitea admin user list 2>/dev/null | awk '/dev-platform-/{print $2; exit}')
          [ -n "$_plat_login" ] || { echo "no dev-platform gitea user -- did seed:agent-base run?" >&2; return 1; }
          _pat=$(kubectl --context "$KIND_CTX" --request-timeout=30s exec -n gitea deploy/gitea -c gitea -- \
            gitea admin user generate-access-token -u "$_plat_login" -t "catalog-$(date +%s)" \
            --scopes write:repository,write:organization --raw 2>/dev/null | tr -d '\r\n ')
          [ -n "$_pat" ] || { echo "could not mint dev-platform PAT" >&2; return 1; }
          kubectl --context "$KIND_CTX" --request-timeout=20s exec -n gitea deploy/gitea -c gitea -- sh -c \
            "curl -s -o /dev/null -X POST -H 'Authorization: token $_pat' -H 'Content-Type: application/json' \
             -d '{\"name\":\"agent-workflows\",\"private\":false,\"auto_init\":false}' \
             http://localhost:3000/api/v1/orgs/team-platform/repos" 2>/dev/null || true
          _stage=$(mktemp -d)
          cp -a "$ROOT/demo-seed/agent-workflows/charts" "$_stage/"
          [ -f "$ROOT/demo-seed/agent-workflows/README.md" ] && cp "$ROOT/demo-seed/agent-workflows/README.md" "$_stage/"
          find "$_stage" -type f -exec sed -i "s/__DOMAIN__/$DOMAIN/g" {} +
          ( cd "$_stage"
            git init -q -b main
            git -c user.email="dev-platform@$DOMAIN" -c user.name=dev-platform add -A
            git -c user.email="dev-platform@$DOMAIN" -c user.name=dev-platform commit -qm "agent-workflows catalog (seeded)"
            git -c http.sslVerify=false push -qf "https://$_plat_login:$_pat@gitea.$DOMAIN/team-platform/agent-workflows.git" main )
          rm -rf "$_stage"
        }
        apl_run "seed-agents-repo" "Pushing agent-workflows catalog to Gitea" setup_catalog_repo || exit $?

        # ---- 2. AplCatalog entry (public gitea URL -- apl-api's pattern rejects a port/http://) ----
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        apl_create_if_missing "$API/v2/catalogs/agent-workflows" "$API/v2/catalogs" "$TOKEN" \
          "$(jq -n --arg url "https://gitea.$DOMAIN/team-platform/agent-workflows" \
            '{kind:"AplCatalog",metadata:{name:"agent-workflows"},spec:{name:"agent-workflows",repositoryUrl:$url,branch:"main",chartsPath:"charts",enabled:true}}')" \
          "catalog agent-workflows" || exit $?

        # ---- 3. node broker: cross-namespace RBAC + admin-team workload ----
        kubectl --context "$KIND_CTX" --request-timeout=30s apply -f "$ROOT/demo-seed/agent-workflows/rbac/broker-rbac.yaml"
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        apl_create_if_missing "$API/v2/teams/admin/workloads/agent-node-broker" "$API/v2/teams/admin/workloads" "$TOKEN" \
          "$(jq -n --arg url "https://gitea.$DOMAIN/team-platform/agent-workflows" --arg v "domain: $DOMAIN" \
            '{kind:"AplTeamWorkload",metadata:{name:"agent-node-broker"},spec:{url:$url,chartProvider:"git",path:"charts/agent-node-broker",revision:"main",values:$v,imageUpdateStrategy:{type:"disabled"}}}')" \
          "workload agent-node-broker (admin)" || exit $?

        # broker netpol: admit each team namespace to the broker EventListener (plain 'eventlistener'
        # label -- the API rejects a toLabelName containing '/', so app.kubernetes.io/managed-by is out).
        _allow=$(for S in {{.SEED_BOOKINFO_SERVICES}}; do t=$(printf '%s' "$S" | cut -d: -f2); printf '{"fromNamespace":"team-%s"},' "$t"; done)
        _allow="[${_allow%,}]"
        apl_create_if_missing "$API/v2/teams/admin/netpols/allow-team-broker" "$API/v2/teams/admin/netpols" "$TOKEN" \
          "$(jq -n --argjson allow "$_allow" \
            '{kind:"AplTeamNetworkControl",metadata:{name:"allow-team-broker"},spec:{ruleType:{type:"ingress",ingress:{toLabelName:"eventlistener",toLabelValue:"node-broker",mode:"AllowOnly",allow:$allow}}}}')" \
          "netpol allow-team-broker (admin)" || exit $?

        # ---- 4. per team: agent-creds secret (identity + tokens) + pull-request-agent workload ----
        setup_team_agent() {
          set -eu
          _team=$1
          _agent_login="agent-${_team}-${DOMAIN_DASH}"
          _pw=$(cat {{.STATE_DIR}}/seed_pw_${_team}_agent.txt)
          # gitea PAT (tea/git can't OIDC): write:repository for push, write:issue so the agent can
          # comment on / manage PRs (Gitea models PRs as issues, so `tea comment` needs write:issue,
          # not write:repository), read:user so `tea` can register the login.
          _gt=$(kubectl --context "$KIND_CTX" --request-timeout=30s exec -n gitea deploy/gitea -c gitea -- \
            gitea admin user generate-access-token -u "$_agent_login" -t "agent-node-$(date +%s)" \
            --scopes write:repository,write:issue,read:user --raw 2>/dev/null | tr -d '\r\n ')
          [ -n "$_gt" ] || { echo "could not mint gitea token for $_agent_login" >&2; return 1; }
          # vikunja long-lived API token (vikunja-cli can't OIDC) -- the "bot" token, not a JWT
          _vt=$(vikunja_mint_api_token "agent-${_team}@$DOMAIN" "$_pw" "agent-${_team}") || return 1
          [ -n "$_vt" ] || { echo "could not mint vikunja token for agent-${_team}" >&2; return 1; }
          # turnstone API PAT (bearer, bound to the agent's OIDC-provisioned Turnstone user) -- the
          # SDK needs a bearer, not the OIDC session cookie (the cookie hits the coordinator-gated
          # console surface). Same shape as the gitea/vikunja PATs above. Tolerate turnstone being
          # off: store empty rather than failing the whole team -- the review pipeline needs
          # turnstone anyway, so an empty token there is harmless when turnstone is disabled.
          _tt=$(turnstone_mint_agent_pat "agent-${_team}@$DOMAIN" "$_pw" "agent-${_team}" 2>/dev/null || true)
          [ -n "$_tt" ] || echo "note: no turnstone token for agent-${_team} (turnstone down/disabled?) -- agent-creds will omit it"
          # agent-creds: identity + the three PATs, each once (apl-api seals plaintext). Loki tenant
          # password is NOT here -- the broker reads it from monitoring at provision.
          _tok=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          apl_create_if_missing "$API/v2/teams/$_team/sealedsecrets/agent-creds" "$API/v2/teams/$_team/sealedsecrets" "$_tok" \
            "$(jq -n --arg u "agent-${_team}@$DOMAIN" --arg p "$_pw" --arg gt "$_gt" --arg vt "$_vt" --arg tt "$_tt" \
              '{kind:"SealedSecret",metadata:{name:"agent-creds"},spec:{type:"kubernetes.io/opaque",encryptedData:{"agent-username":$u,"agent-password":$p,"gitea-token":$gt,"vikunja-token":$vt,"turnstone-token":$tt}}}')" \
            "secret agent-creds ($_team)" || return 1
          # deploy the workflow (zero-config: team from namespace, repo auto-detected). giteaUrl for
          # the webhook-registration hook; PostSync hook registers the pull_request webhook itself.
          apl_create_if_missing "$API/v2/teams/$_team/workloads/pr-agent" "$API/v2/teams/$_team/workloads" "$_tok" \
            "$(jq -n --arg url "https://gitea.$DOMAIN/team-platform/agent-workflows" --arg v "giteaUrl: https://gitea.$DOMAIN" \
              '{kind:"AplTeamWorkload",metadata:{name:"pr-agent"},spec:{url:$url,chartProvider:"git",path:"charts/pull-request-agent",revision:"main",values:$v,imageUpdateStrategy:{type:"disabled"}}}')" \
            "workload pr-agent ($_team)" || return 1
        }
        for S in {{.SEED_BOOKINFO_SERVICES}}; do
          TEAM=$(printf '%s' "$S" | cut -d: -f2)
          apl_run "seed-agent-$TEAM" "Agent creds + pr-agent workload for '$TEAM'" setup_team_agent "$TEAM" || exit $?
        done
        apl_ok "agent workflows seeded -- pick 'pull-request-agent' in the Console, or open a PR on a team repo"

  turnstone-agents:
    desc: "Turnstone agent building blocks: the read-only Architect persona and the vikunja-ticket-coach skill, seeded globally by platform-admin"
    # Personas and skills are GLOBAL, single-org objects only platform-admin (builtin-admin) may
    # create -- persona.create / admin.skills (verified live on builtin-admin's permission string).
    # Auth is the OIDC console flow (turnstone_admin_jar / turnstone_oidc_login); a raw Keycloak
    # bearer is 401'd, same as a bogus one. This is the LAST seed step and is pure admin-API calls,
    # so it is safe to re-run and to iterate on (edit the prose, re-run) without rebuilding anything
    # -- the one caveat is that a persona/skill is resolved once at workstream creation and stamped,
    # so an edit only affects workstreams opened after it. deps [agents] purely to run last.
    deps: [agents]
    # interactive: true for the same reason every task here is -- see fix-first-login + CLAUDE.md's
    # note on `output: group` buffering.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        apl_header "Turnstone agents (personas + skills)"

        seed_turnstone_agents() {
          set -eu
          kubectl --context "$KIND_CTX" --request-timeout=15s get deploy turnstone-server -n turnstone >/dev/null 2>&1 \
            || { echo "turnstone-server not deployed -- skipping persona/skill seed (turnstone disabled)"; return 0; }

          JAR=$(turnstone_admin_jar) || return 1

          # The Architect: read-only Q&A over the codebase + live system. An EXACT tool_allowlist
          # (no tool_search => a HARD set) of read-only tools, with MCP off, means there is no write
          # path at all -- the interactive UI persona on the review node.
          _arch_prompt='You are The Architect: a question-and-answer assistant for this platform. Every team repo is checked out at main and the live services are reachable. Explain how repos map to running services and cite files by path. You are READ-ONLY: you never modify code, tickets, or any system. If asked to change something, explain what you would change and where, but do not attempt it.'
          _arch=$(jq -n --arg p "$_arch_prompt" \
            '{name:"the-architect",display_name:"The Architect",description:"Read-only Q&A about the platform codebase and the live deployed system. No write access.",base_prompt:$p,tool_allowlist:["read_file","search","web_fetch","recall"],mcp_enabled:false,memory_enabled:true,applies_to_kinds:["interactive"],is_default:false,enabled:true}')
          turnstone_upsert_persona "$JAR" "the-architect" "$_arch"

          # vikunja-ticket-coach: the passive PR-Helper WORKFLOW only (identity lives in the
          # persona, not here). Read-only tools; the final message is a structured verdict the
          # review pipeline actuates -- the agent never writes to Vikunja itself.
          _coach_content=$(cat <<'SKILL'
---
name: vikunja-ticket-coach
description: Coach the PO to write good Vikunja tickets with acceptance criteria.
allowed-tools: [read_file, search]
---
# Workflow: Vikunja ticket coaching (passive)
You are given a Vikunja ticket (title + any body + the full comment thread). Help the PO turn a thin, title-only ticket into a ready one, grounded in the actual code you can read.

Produce:
1. A clear description (context / why).
2. Concrete, testable acceptance criteria as Given/When/Then, citing the real services/endpoints/files.
3. Affected components (which repo/service).
4. At most 2-3 clarifying questions, only where intent cannot be inferred.

Definition of Ready: clear outcome, testable AC, components identified, no blocking ambiguity. If unmet, say what is missing.

You never write to Vikunja. Your FINAL message MUST be one JSON object and nothing else:
{"action":"revise"|"apply"|"none","comment":"<markdown for a ticket comment>","description":"<full ticket body, only when action=apply>"}
- action=apply only when the PO clearly approved the latest draft (e.g. /accept or plain agreement); put the agreed body in "description".
- action=revise otherwise; put your draft/questions in "comment".
- action=none if no coaching is warranted.
SKILL
)
          _coach=$(jq -n --arg c "$_coach_content" \
            '{name:"vikunja-ticket-coach",content:$c,category:"support",description:"Coaches the PO to write good Vikunja tickets with acceptance criteria; emits a structured verdict for the pipeline.",activation:"named",is_default:false,auto_approve:true}')
          turnstone_upsert_skill "$JAR" "vikunja-ticket-coach" "$_coach"

          rm -f "$JAR"
        }
        apl_run turnstone-agents "Architect persona + vikunja-ticket-coach skill" seed_turnstone_agents || exit $?
        apl_ok "turnstone agents seeded -- persona 'the-architect' (read-only), skill 'vikunja-ticket-coach'"

  demo:
    desc: "Seed the demo: the four Bookinfo teams, three users each, one live microservice per team wired to the others, and Vikunja provisioning"
    deps: [turnstone-agents]
    # See fix-first-login for why every task in this file is interactive: true.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        # Recomputed here, not passed through from apps: this is a separate task/shell invocation.
        # Deliberately the LAST thing this whole seed:demo chain prints -- see productpage's own
        # verify_bookinfo in the apps task for why this URL, not a generic team-ns route, is what
        # actually proves the demo (it is the one page every other team's content flows into).
        PRODPAGE_TEAM=$(for S in {{.SEED_BOOKINFO_SERVICES}}; do
          case "$S" in productpage:*) printf '%s' "$S" | cut -d: -f2 ;; esac
        done)
        apl_ok "demo seed complete -- teams, users, apps and Vikunja are up, credentials are in passwords.txt"
        apl_ok "see the demo: https://app-$PRODPAGE_TEAM.$DOMAIN/productpage"
