# Seed the platform with demo teams/users/workloads by calling apl-api directly -- an explicit
# opt-in step run AFTER `task setup` has completed, never part of it. See the approved plan at
# the time this was written for the full research behind these choices (apl-api is a thin
# git-backed CRUD API; Console -> apl-api -> git values repo -> operator/apl-tasks/ArgoCD
# reconcile the real side effects; apl-api itself only checks that a request carries a valid
# Keycloak-issued OIDC JWT, it does not care whether that JWT came through oauth2-proxy).
#
# Scope: `seed:auth` (bearer token, with the forced first-login password change handled),
# `seed:teams` (SEED_TEAMS demo teams), `seed:users` (three users per team), `seed:apps` (the
# Bookinfo demo, below), and `seed:vikunja`.
#
# THE DEMO: Istio's Bookinfo sample (https://istio.io/latest/docs/examples/bookinfo/), deployed
# the way a real organisation would run it -- NOT as one team's four-container example, but as
# FOUR SEPARATE TEAMS, one microservice each, each team owning its own Gitea repository, its own
# Tekton build, its own workload and its own public URL, and calling each other across namespace
# boundaries over real in-cluster Service DNS.
#
#   role          owning team     repo                        calls
#   ----------------------------------------------------------------------------------
#   productpage   prodpage        team-prodpage/productpage    details, reviews
#   details       details         team-details/details         (leaf)
#   reviews       reviews         team-reviews/reviews         ratings
#   ratings       ratings         team-ratings/ratings         (leaf)
#
# **`prodpage`, not `productpage`.** apl-api enforces a hard 9-character maximum on team names
# (confirmed live: `productpage`, 11 characters, is rejected with "Team name must not exceed 9
# characters"). SEED_BOOKINFO_SERVICES therefore carries the display role name AND the team id
# separately; everything else derives from that one table.
#
# This is a FIXED four-role assignment, not the "same layout for every team, however many you
# list" shape the retired blue/green canary demo had. SEED_TEAMS still drives seed:teams /
# seed:users / seed:vikunja generically (each team still gets the same po/dev/agent trio), but
# seed:apps is driven by SEED_BOOKINFO_SERVICES and expects exactly those four team ids to exist.
# Changing SEED_TEAMS without changing SEED_BOOKINFO_SERVICES to match will leave the extra teams
# with users but no app.
#
# Each service's source is the real, unmodified upstream tree from github.com/istio/istio at
# branch `master` -- sparse-cloned on the HOST (which has internet access; pods do not) and
# force-pushed into that team's Gitea repo as dev-<team>, over HTTPS, with that user's own PAT.
# See seed-lib.sh's upstream_sparse_subdir / gitea_push_tree. Everything below is done AS
# dev-<team>, never as platform-admin, except the two things a team admin genuinely may not do
# (retiring old content, and writing network policies -- see the netpols step).
#
# Getting dev-<team> a Gitea credential needs a real Keycloak SSO login (Gitea accounts are
# OIDC-JIT-provisioned, never created proactively) -- fully scripted with curl, no browser, see
# seed-lib.sh's gitea_oidc_login. The sslVerify/skip-tls-verify fixes POD-EGRESS-INVESTIGATION.md
# says a webhook-triggered Tekton build needs are already baked into every build this platform
# creates (charts/team-ns/templates/builds/docker.yaml), so no patch is needed here.
#
# Unlike the retired canary demo, no base image is mirrored into Harbor: Bookinfo's Dockerfiles
# keep their upstream public `FROM` lines and kaniko pulled all of them fine (confirmed live
# 2026-08-29). See the note above harbor_ensure_project in seed-lib.sh for what to do if that ever
# stops being true.
#
# CROSS-TEAM CALLS -- the part that is actually hard, and the reason this is a worthwhile demo:
#   * Bookinfo builds every callee URL as plain `http://{HOSTNAME}:{PORT}/...` and does not follow
#     redirects. Each team's public route answers HTTP with a 301 to HTTPS, so routing internal
#     calls through the public hostname produces "Ratings service is currently unavailable" and
#     nothing else. The wiring therefore points at real in-cluster Service DNS instead --
#     `app.team-<callee>.svc.cluster.local:9080` -- via each service's own env vars. See
#     SEED_BOOKINFO_CALLS.
#   * Every team runs with networkPolicy.ingressPrivate: true (set by seed:teams), which allows
#     ingress only from istio-system/knative-serving/monitoring/tekton-pipelines -- not from
#     another team's namespace. The platform's own scoped, self-service mechanism for that is an
#     AplTeamNetworkControl per callee; see the netpols step for the two traps in writing one.
#
# Each team's three users --
#   po-<team>    : plain team member (isTeamAdmin: false)
#   dev-<team>   : team admin on the Console for that team ONLY (isTeamAdmin: true,
#                  isPlatformAdmin: false -- NOT a platform admin)
#   agent-<team> : plain team member, identical rights to po-<team>
# Emails are <role>-<team>@<domainSuffix>, matching the platform-admin@<domainSuffix> pattern
# SETUP.md/install:credentials already uses. firstName/lastName are the role/team capitalized
# (e.g. "Dev"/"Reviews") so the Console's user list reads unambiguously.
version: '3'
silent: true

vars:
  # Same realm/paths every other app in values/*.gotmpl derives from
  # (helmfile.d/snippets/derived.gotmpl's $oidcBaseUrl) -- never hardcode a literal domain here,
  # CLAUDE.md rule 5.
  KEYCLOAK_REALM_PATH: /realms/otomi
  # Materialized by an ExternalSecret from values/oauth2-proxy/oauth2-proxy-raw.gotmpl
  # ("oauth2-proxy-client-access", keys client-id/client-secret) -- this is the platform's one
  # shared OIDC client (default id "otomi", values-schema.yaml's apps.keycloak.idp.clientID),
  # the same client oauth2-proxy itself uses for the browser flow. Its namespace is discovered
  # at runtime below rather than assumed, since it isn't pinned down anywhere in source.
  OAUTH2_PROXY_CLIENT_SECRET_NAME: oauth2-proxy-client-access
  SEED_LIB: '{{.ROOT_DIR}}/.taskfiles/seed-lib.sh'
  # app:namespace:deployment -- apps seed:apps needs (Gitea for repos/OIDC, Harbor for images,
  # Tekton for builds) that a minimal `task setup` (only platform minimums) leaves disabled.
  # Enabled the same way the Console's Apps dashboard does it -- PUT /v1/apps/admin -- not by
  # editing values.yaml (that only applies at initial install, see CLAUDE.md rule 6).
  SEED_REQUIRED_APPS: "gitea:gitea:gitea harbor:harbor:harbor-core tekton:tekton-pipelines:tekton-pipelines-controller vikunja:vikunja:vikunja"
  # Read & Write (Vikunja's 0=Read/1=Read&Write/2=Admin) -- the team's default level on its own
  # demo project. Change to 2 if the team should administer the project itself, not just use it.
  SEED_VIKUNJA_TEAM_PERMISSION: 1
  # The four teams that own the four Bookinfo microservices. Team ids only -- the display role
  # name lives in SEED_BOOKINFO_SERVICES, because apl-api caps team names at 9 characters and
  # "productpage" does not fit (see the header). seed:teams/seed:users/seed:vikunja iterate this
  # generically; seed:apps does not -- it iterates SEED_BOOKINFO_SERVICES, so change both together.
  SEED_TEAMS: "prodpage details reviews ratings"
  # role:isTeamAdmin:FirstName -- one entry per role, applied to every team in SEED_TEAMS.
  SEED_ROLES: "po:false:PO dev:true:Dev agent:false:Agent"

  # --- Bookinfo -------------------------------------------------------------------------------
  # role:teamId:repoName:upstreamSubdir
  #
  # `reviews` (a gradle builder stage feeding an open-liberty runtime stage) is the one
  # multi-stage Dockerfile among the four -- it needs no special-casing here: the platform's
  # kaniko default was bumped past the release that fixed building multi-stage Dockerfiles
  # inside kind (see charts/team-ns/templates/tekton-tasks/kaniko.yaml, CLAUDE.md's kaniko trap,
  # and UPSTREAM-SYNC.md §4b), so all four services go through the exact same webhook-triggered
  # build path.
  SEED_BOOKINFO_SERVICES: >-
    productpage:prodpage:productpage:samples/bookinfo/src/productpage
    details:details:details:samples/bookinfo/src/details
    reviews:reviews:reviews:samples/bookinfo/src/reviews
    ratings:ratings:ratings:samples/bookinfo/src/ratings
  SEED_BOOKINFO_UPSTREAM: "https://github.com/istio/istio.git"
  # `master`, deliberately not a release tag: a tag and the default branch disagree about these
  # Dockerfiles' base images, and reading one while cloning the other costs an afternoon. One ref,
  # used for everything.
  SEED_BOOKINFO_REF: master
  # caller:callee, by TEAM ID. Drives two things at once: the caller workload's
  # <CALLEE>_HOSTNAME/<CALLEE>_SERVICE_PORT env vars (the <CALLEE> prefix is the callee's ROLE
  # name, uppercased -- PRODPAGE is never a callee, so the prodpage/productpage split never shows
  # up here), and the callee team's AplTeamNetworkControl allowing ingress from the caller's
  # namespace.
  # NOTE the separator is ":" and not the ">" that would read more naturally: go-task's shell
  # (mvdan/sh) parses a bare ">" inside a `for x in ...` word list as a REDIRECTION and refuses
  # the whole file with "word list can only contain words" -- bash quietly creates a file
  # instead, which is worse. Confirmed live.
  SEED_BOOKINFO_CALLS: "prodpage:details prodpage:reviews reviews:ratings"
  # teamId:NAME=VALUE,NAME=VALUE -- written to AplTeamBuild's spec.mode.docker.envVars, which
  # charts/team-ns/templates/builds/docker.yaml renders straight into kaniko `--build-arg`s.
  # v3 is the only reviews version that BOTH calls ratings AND renders the result visibly (red
  # stars) -- i.e. the only one that exercises all four services end to end.
  SEED_BOOKINFO_BUILD_ARGS: "reviews:service_version=v3,enable_ratings=true,star_color=red"
  # Both the AplTeamWorkload and the AplTeamService are named this in EVERY team -- uniformly, not
  # derived from the team. Two reasons: the public hostname is "<service>-<team>", so a per-team
  # name gives "app-details-details.<domain>"; and the internal DNS name is then the same
  # "app.team-<team>.svc.cluster.local" everywhere, which is what SEED_BOOKINFO_CALLS relies on.
  SEED_WORKLOAD_NAME: app
  # Singular "k8s-deployment" -- one image, one Deployment. (The retired canary demo used the
  # plural "k8s-deployments-canary", a different chart entirely.)
  SEED_WORKLOAD_CHART_PATH: k8s-deployment
  SEED_CATALOG_CHART_URL: "https://github.com/linode/apl-charts.git"
  # Every Bookinfo service listens on 9080. The k8s-deployment chart's own servicePorts default
  # points targetPort at a NAMED container port ("http") that is never declared unless
  # .Values.ports is also set -- overriding servicePorts with a numeric targetPort sidesteps that
  # entirely, with no `ports:` override needed.
  SEED_SERVICE_PORT: 9080
  # The custom pod label every callee workload carries, so an AplTeamNetworkControl has something
  # to select on. Two traps, both hit live, both encoded here:
  #   * apl-api validates toLabelName against a pattern that rejects "/", so a normal qualified
  #     label like app.kubernetes.io/name cannot be used at all -- hence a plain custom label,
  #     merged onto the pods through the chart's own .Values.podLabels.
  #   * the VALUE must never be the string "true"/"false": it gets coerced into a real YAML
  #     boolean somewhere in the values pipeline, and NetworkPolicy.spec.podSelector.matchLabels
  #     needs a string -- ArgoCD then fails the sync outright with
  #     `expected string, got &value.valueUnstructured{Value:true}`. Any other token is fine.
  SEED_NETPOL_LABEL_NAME: bookinfo
  SEED_NETPOL_LABEL_VALUE: bkflag
  # Names of the retired blue/green canary demo's resources, removed from every seeded team the
  # first time the Bookinfo seed runs against a cluster that still has them.
  SEED_RETIRED_NAMES: "canary blue green"

tasks:
  fix-first-login:
    desc: "Make the platform-admin's initial password permanent (Keycloak forces UPDATE_PASSWORD on first login)"
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        [ -f {{.STATE_DIR}}/pool_start.txt ] || { apl_fail "no {{.STATE_DIR}}/pool_start.txt -- is the platform installed? run 'task setup' first"; exit 1; }
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN="$(cat {{.STATE_DIR}}/pool_start.txt).nip.io"

        fix() {
          set -euo pipefail
          PLATFORM_USER=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret platform-admin-initial-credentials \
            -n keycloak -o jsonpath='{.data.username}' | base64 -d)
          PLATFORM_PASS=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret platform-admin-initial-credentials \
            -n keycloak -o jsonpath='{.data.password}' | base64 -d)
          [ -n "$PLATFORM_USER" ] && [ -n "$PLATFORM_PASS" ] || { echo "error: platform-admin-initial-credentials came back empty" >&2; exit 1; }

          TOKEN=$(kc_master_token)
          USER_ID=$(kc_user_id_by_email "$TOKEN" "$PLATFORM_USER")
          [ -n "$USER_ID" ] || { echo "error: no Keycloak user found for $PLATFORM_USER" >&2; exit 1; }

          NEEDS_FIX=$(curl -sk --max-time 15 -f "https://keycloak.$DOMAIN/admin/realms/otomi/users/$USER_ID" \
            -H "Authorization: Bearer $TOKEN" | jq -r '(.requiredActions // []) | index("UPDATE_PASSWORD") != null')
          if [ "$NEEDS_FIX" != "true" ]; then
            echo "platform-admin has no pending UPDATE_PASSWORD required action -- nothing to do"
            exit 0
          fi

          # Reuse the SAME password already in the secret -- the user asked for the initial
          # password to become permanent, not for a new one to be generated.
          kc_make_password_permanent "$TOKEN" "$USER_ID" "$PLATFORM_PASS"
        }
        apl_run seed-fix-first-login "Making platform-admin's initial password permanent" fix || exit $?

  auth:
    desc: "Fetch a platform-admin Keycloak access token via the Resource Owner Password grant (proves login works; NOT cached for later use -- see teams/users, which re-fetch fresh)"
    deps: [fix-first-login]
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        [ -f {{.STATE_DIR}}/pool_start.txt ] || { apl_fail "no {{.STATE_DIR}}/pool_start.txt -- is the platform installed? run 'task setup' first"; exit 1; }
        DOMAIN="$(cat {{.STATE_DIR}}/pool_start.txt).nip.io"
        echo "$DOMAIN" > {{.STATE_DIR}}/seed_domain.txt
        KIND_CTX="{{.KIND_CONTEXT}}"

        # A token fetched here would go stale by the time a long dependent step (enable-apps's
        # up-to-20-minute app-readiness wait) finishes -- confirmed live: reusing one across that
        # wait 401s with "JWT verification failed: \"exp\" claim timestamp check failed". This
        # step exists only to prove the ROPC login itself works (the forced first-login password
        # change is the one real obstacle, handled by fix-first-login above) -- teams/users each
        # call kc_platform_admin_token fresh, right before they need it, instead of reading a
        # cached file.
        auth() {
          set -euo pipefail
          TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          [ -n "$TOKEN" ]
        }
        apl_run seed-auth "Fetching a platform-admin access token from Keycloak" auth || exit $?
        apl_ok "platform-admin login confirmed"

  enable-apps:
    desc: "Enable gitea/harbor/tekton if a minimal install left them off (same PUT the Console's Apps dashboard uses)"
    deps: [auth]
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"

        toggle_missing() {
          set -euo pipefail
          _current=$(curl -sk --max-time 15 -f "$API/v1/apps" -H "Authorization: Bearer $TOKEN")
          _missing=""
          for SPEC in {{.SEED_REQUIRED_APPS}}; do
            _app=${SPEC%%:*}
            _enabled=$(printf '%s' "$_current" | jq -r --arg id "$_app" '.[] | select(.id==$id) | .enabled')
            [ "$_enabled" = "true" ] || _missing="$_missing\"$_app\","
          done
          if [ -z "$_missing" ]; then
            echo "gitea/harbor/tekton already enabled -- nothing to toggle"
            return 0
          fi
          _ids="[${_missing%,}]"
          echo "enabling: $_ids"
          curl -sk --max-time 15 -f -X PUT "$API/v1/apps/admin" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ids\":$_ids,\"enabled\":true}" > /dev/null
        }
        apl_run seed-enable-apps "Enabling any of gitea/harbor/tekton left off by a minimal install" toggle_missing || exit $?
      - |
        . "{{.LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        # Enabling an app is a git commit -- the actual install (real Helm charts, much heavier
        # than a team resource) takes real minutes, not seconds. Bounded wait: 40 tries, 30s
        # apart, ~20 min cap -- generous on purpose, this is a one-time cost per fresh cluster.
        # Every kubectl call is --request-timeout-bounded -- kubectl has no default timeout and
        # will hang indefinitely against an unresponsive API server otherwise (CLAUDE.md rule 1).
        wait_ready() {
          set -euo pipefail
          _tries=0
          while [ "$_tries" -lt 40 ]; do
            _all_ready=true
            for SPEC in {{.SEED_REQUIRED_APPS}}; do
              _ns=$(printf '%s' "$SPEC" | cut -d: -f2)
              _deploy=$(printf '%s' "$SPEC" | cut -d: -f3)
              _avail=$(kubectl --context "$KIND_CTX" --request-timeout=15s get deploy "$_deploy" -n "$_ns" \
                -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
              [ "${_avail:-0}" -ge 1 ] 2>/dev/null || _all_ready=false
            done
            [ "$_all_ready" = "true" ] && break
            _tries=$((_tries + 1))
            echo "waiting for gitea/harbor/tekton deployments to become available (try $_tries/40)..."
            sleep 30
          done
          [ "$_all_ready" = "true" ] || { echo "error: gitea/harbor/tekton not all Available after ~20 min" >&2; return 1; }
        }
        apl_run seed-enable-apps-wait "Waiting for gitea/harbor/tekton to actually come up (real Helm installs, several minutes)" wait_ready || exit $?

  teams:
    desc: "Create the demo teams (SEED_TEAMS) via POST /v2/teams and verify each"
    # selfService.teamMembers.createServices defaults to false (team.yaml) and is a HARD gate,
    # separate from and bypassing the normal teamAdmin/teamMember CASL create-rights check --
    # confirmed live: apl-api's authz middleware routes "create:Service" through
    # hasSelfService(teamId, 'createServices') whenever the caller is a team member at all,
    # never through the CASL role check, even for a team-admin. Omit this and seed:apps's
    # service creation 403s with "User not allowed to perform \"create\" on \"Service\" resource"
    # no matter how privileged dev-<team> is.
    deps: [enable-apps]
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        # Fresh, not cached: this runs right after enable-apps's up-to-20-minute readiness wait,
        # which can easily outlive a token fetched before it started (see kc_platform_admin_token).
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"

        create_team() {
          set -euo pipefail
          _team=$1
          _out={{.STATE_DIR}}/seed_team_create_$_team.json
          _body=$(cat <<JSON
        {
          "kind": "AplTeamSettingSet",
          "metadata": {"name": "$_team", "labels": {"apl.io/teamId": "$_team"}},
          "spec": {
            "managedMonitoring": {"grafana": false, "alertmanager": false},
            "networkPolicy": {"ingressPrivate": true, "egressPublic": true},
            "selfService": {
              "teamMembers": {
                "createServices": true,
                "editSecurityPolicies": false,
                "useCloudShell": false,
                "downloadKubeconfig": false,
                "downloadDockerLogin": false
              }
            }
          }
        }
        JSON
        )
          _http=$(curl -sk --max-time 15 -o "$_out" -w '%{http_code}' \
            -X POST "$API/v2/teams" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$_body")
          if [ "$_http" -ge 300 ]; then
            echo "error: POST /v2/teams ($_team) returned HTTP $_http" >&2
            cat "$_out" >&2
            exit 1
          fi
        }
        for TEAM in {{.SEED_TEAMS}}; do
          apl_run "seed-team-create-$TEAM" "Creating demo team '$TEAM' via POST /v2/teams" create_team "$TEAM" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"

        # Verify, don't assert (CLAUDE.md rule 4) -- a 2xx from the POST only means apl-api
        # accepted and committed it, not that it's the team we think it is. Round-trip with a GET.
        verify_team() {
          set -euo pipefail
          _team=$1
          _resp=$(curl -sk --max-time 15 "$API/v2/teams/$_team" -H "Authorization: Bearer $TOKEN")
          _name=$(printf '%s' "$_resp" | jq -er '.metadata.name')
          [ "$_name" = "$_team" ]
        }
        for TEAM in {{.SEED_TEAMS}}; do
          apl_run "seed-team-verify-$TEAM" "Verifying '$TEAM' via GET /v2/teams/$TEAM" verify_team "$TEAM" || exit $?
        done
        apl_ok "teams created and confirmed: {{.SEED_TEAMS}}"
        apl_info "each team's namespace (team-<name>) appears once the operator reconciles the commit --"
        apl_info "not checked here; 'kubectl get ns' once you're ready to confirm."

  users:
    desc: "Create the demo users (po/dev/agent per team), then make all their passwords permanent in one pass"
    deps: [teams]
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        TOKEN=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
        API="https://console.$DOMAIN/api"
        PENDING={{.STATE_DIR}}/seed_pending_passwords.txt
        : > "$PENDING"

        # Per-user marker block in passwords.txt, keyed by email -- NOT one big block for all six.
        # apl-api 409s "User email already exists" on a repeat POST (unlike /v2/teams, which
        # upserts cleanly), and it never re-exposes initialPassword for a user that already
        # exists. A single wipe-and-rewrite-everything block would silently drop an
        # already-seeded user's credentials the moment any ONE user in a partial rerun already
        # existed. Keying per-user means a skipped (already-existing) user's passwords.txt entry
        # from a previous run is simply left alone.
        record_credentials() {
          set -euo pipefail
          _email=$1 _team=$2 _role=$3 _is_admin=$4 _password=$5
          _mark_begin="# --- demo-user: $_email (generated by 'task seed:users') ---"
          _mark_end="# --- end demo-user: $_email ---"
          [ -f passwords.txt ] && sed -i "/^${_mark_begin//\//\\/}\$/,/^${_mark_end//\//\\/}\$/d" passwords.txt
          {
            echo "$_mark_begin"
            printf 'team:     %s\nrole:     %s%s\nusername: %s\npassword: %s\n' \
              "$_team" "$_role" "$([ "$_is_admin" = "true" ] && echo " (team-admin)" || echo "")" \
              "$_email" "$_password"
            echo "$_mark_end"
          } >> passwords.txt
          chmod 600 passwords.txt
          # Machine-readable copy for later automation (seed:apps needs dev-<team>'s password to
          # act as that user) -- passwords.txt is for humans, re-parsing it programmatically would
          # be fragile. Only written for roles that actually have a password to record here.
          printf '%s' "$_password" > {{.STATE_DIR}}/seed_pw_${_team}_${_role}.txt
          chmod 600 {{.STATE_DIR}}/seed_pw_${_team}_${_role}.txt
        }

        create_user() {
          set -euo pipefail
          _team=$1 _role=$2 _is_admin=$3 _firstname=$4
          _lastname=$(printf '%s' "$_team" | sed 's/./\U&/')
          _email="$_role-$_team@$DOMAIN"
          _out={{.STATE_DIR}}/seed_user_${_team}_${_role}.json
          _body=$(cat <<JSON
        {
          "email": "$_email",
          "firstName": "$_firstname",
          "lastName": "$_lastname",
          "isPlatformAdmin": false,
          "isTeamAdmin": $_is_admin,
          "teams": ["$_team"]
        }
        JSON
        )
          _http=$(curl -sk --max-time 15 -o "$_out" -w '%{http_code}' \
            -X POST "$API/v1/users" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$_body")
          if [ "$_http" = "409" ] && grep -q 'already exists' "$_out"; then
            echo "user $_email already exists -- leaving its passwords.txt entry as-is (apl-api does not re-issue a password for an existing user, and it was already made permanent by an earlier run)"
            exit 0
          fi
          if [ "$_http" -ge 300 ]; then
            echo "error: POST /v1/users ($_email) returned HTTP $_http" >&2
            cat "$_out" >&2
            exit 1
          fi
          _returned_email=$(jq -er '.email' "$_out")
          [ "$_returned_email" = "$_email" ] || { echo "error: response email '$_returned_email' != '$_email'" >&2; exit 1; }
          _password=$(jq -er '.initialPassword' "$_out")

          record_credentials "$_email" "$_team" "$_role" "$_is_admin" "$_password"
          # Queued for the single shared wait-then-fix pass below -- NOT fixed here, one user at
          # a time: apl-tasks reconciles a batch of git commits together on one debounce, so
          # waiting per-user serially (up to 120s EACH) is needless when one shared wait covers
          # every user created this run.
          printf '%s\t%s\n' "$_email" "$_password" >> "$PENDING"
        }

        for TEAM in {{.SEED_TEAMS}}; do
          for ROLE_SPEC in {{.SEED_ROLES}}; do
            ROLE=${ROLE_SPEC%%:*}
            REST=${ROLE_SPEC#*:}
            IS_ADMIN=${REST%%:*}
            FIRSTNAME=${REST#*:}
            apl_run "seed-user-$TEAM-$ROLE" "Creating $ROLE-$TEAM (isTeamAdmin=$IS_ADMIN)" \
              create_user "$TEAM" "$ROLE" "$IS_ADMIN" "$FIRSTNAME" || exit $?
          done
        done
        apl_ok "demo users created; credentials recorded in passwords.txt per-user"
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        PENDING={{.STATE_DIR}}/seed_pending_passwords.txt
        RESOLVED={{.STATE_DIR}}/seed_resolved.txt
        : > "$RESOLVED"

        if [ ! -s "$PENDING" ]; then
          apl_skip "no freshly created users this run -- nothing to wait for or fix"
        else
          fix_all() {
            set -euo pipefail
            kc_resolve_pending "$PENDING" "$RESOLVED"
            if [ -s "$PENDING" ]; then
              echo "error: still not reconciled in Keycloak after ~120s: $(cut -f1 "$PENDING" | tr '\n' ' ')" >&2
              exit 1
            fi
            while IFS=$'\t' read -r _email _id _password; do
              [ -n "$_email" ] || continue
              _token=$(kc_master_token)
              kc_make_password_permanent "$_token" "$_id" "$_password"
            done < "$RESOLVED"
          }
          _n=$(wc -l < "$PENDING" | tr -d ' ')
          apl_run seed-users-fix-first-login \
            "Waiting once for apl-tasks to reconcile $_n new user(s) in Keycloak, then making their passwords permanent" \
            fix_all || exit $?
        fi

  apps:
    desc: "Istio Bookinfo, one microservice per team: Gitea repo + Tekton build + workload + public service, cross-team wired"
    deps: [users]
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"

        # Retire the blue/green canary demo an earlier version of this seed created. Bookinfo is
        # the DEFAULT demo content now, not an alternative sitting beside it, so the old resources
        # go rather than accumulating: two dead ArgoCD Applications and four dead Gitea repos per
        # team is not a demo anyone wants to be shown.
        #
        # As platform-admin, not dev-<team>: this is retiring content, not team self-service, and
        # it has to work even for a team whose dev user cannot be logged in for some reason. The
        # Gitea repositories themselves are removed further down, inside setup_team_service, where
        # that team's own PAT already exists.
        #
        # Note the order -- service, then workload, then build, then coderepo: the later ones are
        # what the earlier ones reference.
        retire_old_demo() {
          set -euo pipefail
          _team=$1
          _token=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          for _n in {{.SEED_RETIRED_NAMES}}; do
            for _kind in services workloads builds coderepos; do
              apl_delete_if_present "$API/v2/teams/$_team/$_kind/$_n" "$API/v2/teams/$_team/$_kind/$_n" \
                "$_token" "$_kind/$_n ($_team)"
            done
          done
        }
        for TEAM in {{.SEED_TEAMS}}; do
          apl_run "seed-apps-retire-$TEAM" "Retiring any leftover blue/green canary content in $TEAM" retire_old_demo "$TEAM" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"

        # Every team's first build mounts the `gitea-credentials` Secret apl-gitea-operator writes
        # into the team namespace -- without it the git-clone Task's fetch-source pod hangs at
        # Init:0/2 on a FailedMount and the PipelineRun wait below just times out, with the real
        # cause (a swallowed 403 in the operator, minutes earlier) nowhere near the failure.
        # A brand-new team hits that 403 routinely; an existing one never does. Full account, and
        # why this is upstream's bug rather than something wired wrong here, in seed-lib.sh's
        # gitea_ensure_team_credentials.
        #
        # Done ONCE for all of SEED_TEAMS, not per team inside setup_team_app: the operator
        # rewrites the secret for every team org on a single reconcile pass, so one check (and at
        # most one nudge) covers the whole run no matter how many teams it has.
        apl_run seed-apps-gitea-credentials \
          "Ensuring apl-gitea-operator wrote gitea-credentials into every team namespace" \
          gitea_ensure_team_credentials {{.SEED_TEAMS}} || exit $?
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"
        # Needed by harbor_has_tag below -- "is there already an image for this repo?" is what
        # decides whether an unchanged source tree still needs a build.
        HARBOR_ADMIN_PASSWORD=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret harbor-admin-password \
          -n harbor -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d)
        [ -n "$HARBOR_ADMIN_PASSWORD" ] || { apl_fail "harbor-admin-password secret came back empty"; exit 1; }

        # dev-<team>'s own Keycloak bearer token -- same ROPC pattern seed:auth uses for
        # platform-admin, just with dev-<team>'s own credentials. Everything below runs AS that
        # user, never platform-admin: each team's own service is set up by that team's own dev.
        #
        # Call this immediately before each group of API calls, never once for the whole
        # function: this realm's accessTokenLifespan is SIXTY SECONDS (confirmed live against
        # /admin/realms/otomi), and setup_team_service deliberately waits far longer than that
        # between its groups of calls -- up to 180s for the Gitea webhook, 90s for the
        # EventListener, and up to 15 minutes for a build. A token fetched before those waits is
        # long dead by the time the workload and service are created. Same class of bug as the
        # platform-admin token that used to be cached across enable-apps's readiness wait; see
        # kc_platform_admin_token's note in seed-lib.sh.
        dev_team_token() {
          _team=$1
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)
          _client_ns=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret -A \
            --field-selector "metadata.name={{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}" \
            -o jsonpath='{.items[0].metadata.namespace}')
          _client_id=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} \
            -n "$_client_ns" -o jsonpath='{.data.client-id}' | base64 -d)
          _client_secret=$(kubectl --context "$KIND_CTX" --request-timeout=15s get secret {{.OAUTH2_PROXY_CLIENT_SECRET_NAME}} \
            -n "$_client_ns" -o jsonpath='{.data.client-secret}' | base64 -d)
          _tok_resp=$(curl -sk --max-time 15 "https://keycloak.$DOMAIN{{.KEYCLOAK_REALM_PATH}}/protocol/openid-connect/token" \
            --data-urlencode grant_type=password --data-urlencode client_id="$_client_id" --data-urlencode client_secret="$_client_secret" \
            --data-urlencode username="$_email" --data-urlencode password="$_password" --data-urlencode scope=openid)
          _tok=$(printf '%s' "$_tok_resp" | jq -r '.access_token // empty' 2>/dev/null || true)
          # Diagnose rather than die silently: with `jq -er` straight off the pipe, a failed
          # login aborted the caller through `set -e` with no message at all, and Keycloak's own
          # error ("invalid_grant", "Account is not fully set up", ...) was thrown away.
          [ -n "$_tok" ] || { echo "error: no access token for $_email -- Keycloak said: $(printf '%s' "$_tok_resp" | head -c 300)" >&2; return 1; }
          printf '%s' "$_tok"
        }

        # bookinfo_role_of <teamId> -- the display role name that team owns ("prodpage" ->
        # "productpage"). SEED_BOOKINFO_CALLS is written in team ids (that is what a namespace is
        # named after), but the env vars Bookinfo itself reads are named after the ROLE
        # (DETAILS_HOSTNAME, REVIEWS_HOSTNAME, RATINGS_HOSTNAME) -- and for one of the four those
        # two strings differ, because apl-api caps a team name at 9 characters.
        bookinfo_role_of() {
          _bro_team=$1
          for _bro_spec in {{.SEED_BOOKINFO_SERVICES}}; do
            if [ "$(printf '%s' "$_bro_spec" | cut -d: -f2)" = "$_bro_team" ]; then
              printf '%s' "$_bro_spec" | cut -d: -f1
              return 0
            fi
          done
          echo "error: no Bookinfo role owns team '$_bro_team' -- SEED_BOOKINFO_CALLS names a team SEED_BOOKINFO_SERVICES does not" >&2
          return 1
        }

        # wait_for_triggered_build <team> <repo> <not-before-rfc3339> -- bounded wait for the
        # PipelineRun the Gitea webhook just created (observed ~40s-3min depending on the base
        # image). Matched by THIS build's own name prefix, "docker-trigger-build-<repo>-", not
        # "whatever's latest in the namespace" -- several repos' builds land in one team namespace.
        #
        # The <not-before> argument is NOT optional decoration. Matching on the name prefix alone
        # also matches PipelineRuns from EARLIER runs of this seed, which Tekton keeps around
        # indefinitely -- confirmed live 2026-08-29: a rerun against a cluster that still had a
        # months-old succeeded `docker-trigger-build-productpage-*` returned "True" on the first
        # poll, before the freshly pushed commit's own build had even been scheduled. The step
        # passed in under a second and proved nothing at all. The caller captures a UTC timestamp
        # immediately before pushing and passes it here; RFC3339 UTC strings compare correctly
        # lexicographically, and the host and the kind node share a clock.
        #
        # `|| true` on the pipeline: right after the push Tekton's PipelineRun object often does
        # not exist yet at all -- a completely normal state this loop exists to wait through. A
        # transient failure there would otherwise kill the WHOLE function on try 1 through the
        # caller's `set -euo pipefail`, silently, before the explicit timeout message below could
        # ever be reached.
        wait_for_triggered_build() {
          _wb_team=$1
          _wb_repo=$2
          _wb_since=$3
          _wb_tries=0
          _wb_status=""
          while [ "$_wb_tries" -lt 30 ]; do
            _wb_pr=$(kubectl --context "$KIND_CTX" --request-timeout=15s get pipelinerun -n "team-$_wb_team" -o json 2>/dev/null \
              | jq -r --arg p "docker-trigger-build-$_wb_repo-" --arg since "$_wb_since" '
                  [ .items[]
                    | select(.metadata.name | startswith($p))
                    | select(.metadata.creationTimestamp >= $since) ]
                  | sort_by(.metadata.creationTimestamp) | last
                  | if . == null then "" else "\(.metadata.name) \(.status.conditions[0].status // "Unknown") \(.status.conditions[0].reason // "Pending")" end' 2>/dev/null || true)
            _wb_status=$(printf '%s' "$_wb_pr" | awk '{print $2}')
            [ "$_wb_status" = "True" ] && break
            [ "$_wb_status" = "False" ] && break
            _wb_tries=$((_wb_tries + 1))
            echo "waiting for the webhook-triggered build of team-$_wb_team/$_wb_repo (try $_wb_tries/30, last: ${_wb_pr:-no PipelineRun yet})..."
            sleep 10
          done
          [ "$_wb_status" = "True" ] || { echo "error: the build for team-$_wb_team/$_wb_repo did not succeed within 300s (last: ${_wb_pr:-no PipelineRun at all})" >&2; return 1; }
          echo "webhook-triggered build succeeded: $_wb_pr"
        }

        # setup_team_service <role> <team> <repo> <upstream-subdir> -- everything one team owns
        # for its one Bookinfo microservice: its Gitea repo and the real upstream source in it,
        # its coderepo + auto-triggered Tekton build, its workload, and its public service.
        setup_team_service() {
          set -euo pipefail
          _role=$1
          _team=$2
          _repo=$3
          _subdir=$4
          _email="dev-$_team@$DOMAIN"
          _password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_dev.txt)

          GITEA_USER=$(gitea_oidc_login "$_email" "$_password")
          GITEA_PAT=$(gitea_mint_pat "$GITEA_USER" "read:user,write:repository,write:organization,read:organization")
          gitea_wait_for_org_permission "$GITEA_USER" "team-$_team" "$GITEA_PAT" "can_create_repository"

          # agent-<team> also provisions itself in Gitea and lands in the team's org -- no repo
          # creation of its own, dev owns that; this is just "find themselves in their respective
          # team" (agent's OWN Gitea account + org membership sync, same mechanism as dev's, just
          # no follow-up repo work).
          _agent_email="agent-$_team@$DOMAIN"
          _agent_password=$(cat {{.STATE_DIR}}/seed_pw_${_team}_agent.txt)
          _agent_gitea_user=$(gitea_oidc_login "$_agent_email" "$_agent_password")
          # read:user AND read:organization -- the permissions endpoint below 403s without
          # read:user too (confirmed live, same trap already hit and fixed for dev's PAT scope).
          _agent_gitea_pat=$(gitea_mint_pat "$_agent_gitea_user" "read:user,read:organization")
          gitea_wait_for_org_permission "$_agent_gitea_user" "team-$_team" "$_agent_gitea_pat" "can_read"

          # The Gitea half of retiring the blue/green canary demo (the apl-api half ran as
          # platform-admin in the previous step). Done here because it needs a PAT belonging to
          # somebody who owns the org, which is exactly the one we just minted.
          for _old in blue green; do
            gitea_delete_org_repo_if_present "team-$_team" "$_old" "$GITEA_PAT"
          done

          # The real upstream tree, sparse-cloned on the host. Cached across all four services --
          # one clone of istio/istio for the whole run.
          _src=$(upstream_sparse_subdir "{{.SEED_BOOKINFO_UPSTREAM}}" "{{.SEED_BOOKINFO_REF}}" "$_subdir")

          gitea_create_org_repo "team-$_team" "$_repo" "$GITEA_PAT"

          _pushed=false
          # Captured immediately before the push, and only ever moved forward by push_source: this
          # is what stops wait_for_triggered_build from being satisfied by an OLD PipelineRun of
          # the same build left over from a previous run. See its header comment.
          _push_since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          push_source() {
            _push_since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            _ps_rc=0
            gitea_push_tree "team-$_team" "$_repo" "$GITEA_PAT" "$GITEA_USER" "$_src" \
              "Bookinfo $_role, from {{.SEED_BOOKINFO_UPSTREAM}}@{{.SEED_BOOKINFO_REF}}:$_subdir" || _ps_rc=$?
            case "$_ps_rc" in
              0) _pushed=true ;;
              2) _pushed=false ;;
              *) return 1 ;;
            esac
          }

          API_TOKEN=$(dev_team_token "$_team")

          apl_create_if_missing \
            "$API/v2/teams/$_team/coderepos/$_repo" "$API/v2/teams/$_team/coderepos" "$API_TOKEN" \
            "{\"kind\":\"AplTeamCodeRepo\",\"metadata\":{\"name\":\"$_repo\"},\"spec\":{\"gitService\":\"gitea\",\"repositoryUrl\":\"https://gitea.$DOMAIN/team-$_team/$_repo.git\",\"private\":true}}" \
            "coderepo $_repo ($_team)"

          # Docker build args, if this service needs any (reviews does: service_version=v3 etc).
          # AplTeamBuild's spec.mode.docker.envVars maps 1:1 onto kaniko's --build-arg -- see
          # charts/team-ns/templates/builds/docker.yaml. No chart change was needed for this.
          _build_args=""
          for _spec in {{.SEED_BOOKINFO_BUILD_ARGS}}; do
            case "$_spec" in
              "$_team:"*) _build_args=${_spec#*:} ;;
            esac
          done
          _envvars='[]'
          if [ -n "$_build_args" ]; then
            _envvars=$(printf '%s' "$_build_args" | tr ',' '\n' \
              | jq -R 'select(length > 0) | {name: (split("=")[0]), value: (split("=")[1:] | join("="))}' \
              | jq -sc .)
          fi
          apl_create_if_missing \
            "$API/v2/teams/$_team/builds/$_repo" "$API/v2/teams/$_team/builds" "$API_TOKEN" \
            "$(jq -n --arg name "$_repo" --arg url "https://gitea.$DOMAIN/team-$_team/$_repo.git" --argjson env "$_envvars" \
              '{kind:"AplTeamBuild", metadata:{name:$name}, spec:{imageName:$name, tag:"main", trigger:true, scanSource:false, mode:{type:"docker", docker:({repoUrl:$url, path:"./Dockerfile", revision:"main"} + (if ($env|length) > 0 then {envVars:$env} else {} end))}}}')" \
            "build $_repo ($_team)"

          # Bounded wait for the operator to reconcile the build into an actual Gitea webhook on
          # THIS repo (checked directly, not guessed at with a fixed sleep) before pushing content.
          _tries=0
          _hooks=0
          while [ "$_tries" -lt 18 ]; do
            # `|| true` on the pipeline: under `set -euo pipefail` a single transient curl/jq
            # failure would abort the step outright instead of being retried by this loop.
            _hooks=$(curl -sk --max-time 10 "https://gitea.$DOMAIN/api/v1/repos/team-$_team/$_repo/hooks" -H "Authorization: token $GITEA_PAT" 2>/dev/null | jq -r 'length' 2>/dev/null || true)
            [ "${_hooks:-0}" -gt 0 ] && break
            _tries=$((_tries + 1))
            sleep 10
          done
          [ "${_hooks:-0}" -gt 0 ] || { echo "error: no Gitea webhook appeared for team-$_team/$_repo within 180s" >&2; return 1; }

          # Registered in Gitea's webhook config != actually able to receive it. Confirmed live:
          # pushing content immediately after the check above raced the EventListener pod's own
          # startup (its istio-proxy sidecar wasn't ready yet) -- Gitea's push landed, was
          # delivered, and got back a hard "503 no healthy upstream" from Envoy (visible in
          # gitea's own hook_task table, not surfaced anywhere else). Gitea does NOT retry a
          # failed webhook delivery on its own, so that push's PipelineRun simply never happened
          # -- no error, just an indefinite wait later for a build that was never triggered. Wait
          # for the EventListener Deployment itself to be Available first, same pattern
          # enable-apps already uses for gitea/harbor/tekton. It is named after the BUILD:
          # "el-gitea-webhook-<repo>".
          _tries=0
          while [ "$_tries" -lt 18 ]; do
            _avail=$(kubectl --context "$KIND_CTX" --request-timeout=15s get deploy "el-gitea-webhook-$_repo" -n "team-$_team" \
              -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
            [ "${_avail:-0}" -ge 1 ] 2>/dev/null && break
            _tries=$((_tries + 1))
            sleep 5
          done
          [ "${_avail:-0}" -ge 1 ] || { echo "error: el-gitea-webhook-$_repo never became Available within 90s" >&2; return 1; }

          push_source

          # What actually produces the image, in the three states this can be in.
          if [ "$_pushed" = "true" ]; then
            wait_for_triggered_build "$_team" "$_repo" "$_push_since"
          elif harbor_has_tag "team-$_team" "$_repo" main; then
            # Source unchanged AND an image already exists -- a rerun against an already-seeded
            # cluster costs no build at all. This is the whole point of gitea_push_tree's
            # deterministic commit SHA.
            echo "harbor.$DOMAIN/team-$_team/$_repo:main already exists and the source is unchanged -- no rebuild needed"
          else
            echo "error: team-$_team/$_repo is already at the expected commit but harbor.$DOMAIN/team-$_team/$_repo:main does not exist," >&2
            echo "       so a previous build must have failed. Look at 'kubectl get pipelinerun -n team-$_team'; any new commit" >&2
            echo "       pushed to that repo re-triggers the build." >&2
            return 1
          fi

          # Fresh token: the build above can take many minutes, far past the 60s token lifespan.
          API_TOKEN=$(dev_team_token "$_team")
          _image_repo="harbor.$DOMAIN/team-$_team/$_repo"

          # The cross-team wiring, from SEED_BOOKINFO_CALLS: for every service THIS one calls,
          # a <CALLEE>_HOSTNAME/<CALLEE>_SERVICE_PORT pair pointing at the callee's in-cluster
          # Service DNS name -- NOT at its public route. Bookinfo's own source (productpage.py,
          # LibertyRestEndpoint.java) builds these URLs as plain http:// and follows no redirects,
          # and the public route answers HTTP with a 301 to HTTPS; going that way produces
          # "Ratings service is currently unavailable" and nothing more informative.
          _env_file=$(mktemp)
          for _call in {{.SEED_BOOKINFO_CALLS}}; do
            _caller=${_call%%:*}
            _callee=${_call#*:}
            [ "$_caller" = "$_team" ] || continue
            _callee_upper=$(bookinfo_role_of "$_callee" | tr '[:lower:]' '[:upper:]')
            printf '  - name: %s_HOSTNAME\n    value: %s.team-%s.svc.cluster.local\n  - name: %s_SERVICE_PORT\n    value: "%s"\n' \
              "$_callee_upper" "{{.SEED_WORKLOAD_NAME}}" "$_callee" "$_callee_upper" "{{.SEED_SERVICE_PORT}}" >> "$_env_file"
          done

          # podLabels is on EVERY service, not just the ones that are called into: it costs
          # nothing, and it means the netpol step never has to care which of the four happens to
          # be a callee today. See SEED_NETPOL_LABEL_NAME for the two traps behind this label.
          VALUES=$(printf 'image:\n  repository: %s\n  tag: main\nservicePorts:\n  - port: %s\n    targetPort: %s\n    protocol: TCP\n    name: http\npodLabels:\n  %s: %s\n' \
            "$_image_repo" "{{.SEED_SERVICE_PORT}}" "{{.SEED_SERVICE_PORT}}" "{{.SEED_NETPOL_LABEL_NAME}}" "{{.SEED_NETPOL_LABEL_VALUE}}")
          if [ -s "$_env_file" ]; then
            VALUES=$(printf '%s\nenv:\n%s' "$VALUES" "$(cat "$_env_file")")
          fi
          rm -f "$_env_file"

          # imageUpdateStrategy is what wires real GitOps auto-redeploy: the ArgoCD Image Updater
          # watches the Harbor repo and rewrites image.repository/image.tag in the values repo when
          # a new digest is pushed. imageParameter/tagParameter and the full harbor.<domain>/
          # prefix on imageRepository are ALL required for it to fire at all -- confirmed live,
          # twice, in two different demos.
          apl_create_if_missing \
            "$API/v2/teams/$_team/workloads/{{.SEED_WORKLOAD_NAME}}" "$API/v2/teams/$_team/workloads" "$API_TOKEN" \
            "$(jq -n --arg name "{{.SEED_WORKLOAD_NAME}}" --arg values "$VALUES" --arg url "{{.SEED_CATALOG_CHART_URL}}" \
                --arg path "{{.SEED_WORKLOAD_CHART_PATH}}" --arg repo "$_image_repo" \
              '{kind:"AplTeamWorkload", metadata:{name:$name}, spec:{url:$url, chartProvider:"git", path:$path, revision:"main", values:$values, imageUpdateStrategy:{type:"digest", digest:{imageRepository:$repo, tag:"main", imageParameter:"image.repository", tagParameter:"image.tag"}}}}')" \
            "workload {{.SEED_WORKLOAD_NAME}} ($_team)"

          # useDefaultHost gives each team its own public URL at
          # https://{{.SEED_WORKLOAD_NAME}}-<team>.<domain>/ (routes.yaml names the host
          # "<serviceName>-<teamId>"). Handy for poking one microservice directly; the cross-team
          # calls above deliberately do NOT go through it.
          apl_create_if_missing \
            "$API/v2/teams/$_team/services/{{.SEED_WORKLOAD_NAME}}" "$API/v2/teams/$_team/services" "$API_TOKEN" \
            "$(jq -n --arg name "{{.SEED_WORKLOAD_NAME}}" --argjson port {{.SEED_SERVICE_PORT}} \
              '{kind:"AplTeamService", metadata:{name:$name}, spec:{port:$port, ingress:{type:"public", useDefaultHost:true}}}')" \
            "service {{.SEED_WORKLOAD_NAME}} ($_team)"

          # Bounded wait for the public route to actually serve this microservice. /health, not
          # /: all four Bookinfo services expose it, but only productpage serves anything at the
          # document root.
          _tries=0
          _code=""
          while [ "$_tries" -lt 30 ]; do
            _code=$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' "https://{{.SEED_WORKLOAD_NAME}}-$_team.$DOMAIN/health" 2>/dev/null || true)
            [ "$_code" = "200" ] && break
            _tries=$((_tries + 1))
            echo "waiting for https://{{.SEED_WORKLOAD_NAME}}-$_team.$DOMAIN/health (try $_tries/30, last: $_code)..."
            sleep 10
          done
          [ "$_code" = "200" ] || { echo "error: https://{{.SEED_WORKLOAD_NAME}}-$_team.$DOMAIN/health never returned 200 (last: $_code)" >&2; return 1; }
        }

        for SPEC in {{.SEED_BOOKINFO_SERVICES}}; do
          ROLE=$(printf '%s' "$SPEC" | cut -d: -f1)
          TEAM=$(printf '%s' "$SPEC" | cut -d: -f2)
          REPO=$(printf '%s' "$SPEC" | cut -d: -f3)
          SUBDIR=$(printf '%s' "$SPEC" | cut -d: -f4)
          apl_run "seed-apps-$TEAM" "Setting up Bookinfo's '$ROLE' microservice in team $TEAM (as dev-$TEAM)" \
            setup_team_service "$ROLE" "$TEAM" "$REPO" "$SUBDIR" || exit $?
        done
        apl_ok "bookinfo microservices live: $(for S in {{.SEED_BOOKINFO_SERVICES}}; do printf 'https://{{.SEED_WORKLOAD_NAME}}-%s.%s/ ' "$(printf '%s' "$S" | cut -d: -f2)" "$DOMAIN"; done)"
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)
        API="https://console.$DOMAIN/api"

        # Every team is created with networkPolicy.ingressPrivate: true (seed:teams), which allows
        # ingress ONLY from istio-system/knative-serving/monitoring/tekton-pipelines -- not from
        # another team's namespace. So productpage -> details/reviews and reviews -> ratings are
        # blocked by default even though the Service DNS names resolve perfectly.
        #
        # The platform has a proper, scoped, self-service mechanism for exactly this: an
        # AplTeamNetworkControl per callee (values-schema.yaml's `netpol` definition). Four things
        # about it cost real time to find, all encoded below:
        #
        #  1. It needs its OWN endpoint -- POST /v2/teams/{team}/netpols. Nesting a `netpols`
        #     array inside the team's AplTeamSettingSet body (POST /v2/teams) returns HTTP 200 and
        #     LOOKS like it worked, but it is silently a no-op: apl-api's values assembly only ever
        #     scans separate per-resource files at env/teams/<team>/netpols/*.yaml, the same
        #     convention builds/ codeRepos/ workloads/ services/ each already follow. A netpol
        #     nested in settings.yaml is invisible to that scan, forever.
        #  2. The kind is AplTeamNetworkControl, not ...NetworkPolicy.
        #  3. toLabelName may not contain "/" (apl-api rejects the pattern), so a normal qualified
        #     Kubernetes label cannot be used -- hence the custom podLabels label the workloads
        #     above carry. See SEED_NETPOL_LABEL_NAME for trap 4, the "true"/"false" coercion.
        #  4. networkPolicy.ingressPrivate must STAY true. The chart template that renders
        #     custom-network-policies.yaml only fires when it is -- flipping it to false is a
        #     coarser "allow every namespace" fallback, not a shortcut to the same thing.
        #
        # As platform-admin: teams are created with selfService.teamMembers.editSecurityPolicies
        # false, so dev-<team> genuinely may not write one of these. That is the platform working
        # as configured, not something to work around.
        create_netpol() {
          set -euo pipefail
          _caller=$1
          _callee=$2
          _token=$(kc_platform_admin_token "{{.OAUTH2_PROXY_CLIENT_SECRET_NAME}}")
          _name="allow-$_caller"
          apl_create_if_missing \
            "$API/v2/teams/$_callee/netpols/$_name" "$API/v2/teams/$_callee/netpols" "$_token" \
            "$(jq -n --arg name "$_name" --arg ns "team-$_caller" \
                --arg ln "{{.SEED_NETPOL_LABEL_NAME}}" --arg lv "{{.SEED_NETPOL_LABEL_VALUE}}" \
              '{kind:"AplTeamNetworkControl", metadata:{name:$name}, spec:{ruleType:{type:"ingress", ingress:{toLabelName:$ln, toLabelValue:$lv, mode:"AllowOnly", allow:[{fromNamespace:$ns}]}}}}')" \
            "netpol $_name ($_callee)"
        }
        for CALL in {{.SEED_BOOKINFO_CALLS}}; do
          CALLER=${CALL%%:*}
          CALLEE=${CALL#*:}
          apl_run "seed-apps-netpol-$CALLEE-$CALLER" \
            "Allowing team-$CALLER to reach team-$CALLEE's pods (AplTeamNetworkControl)" \
            create_netpol "$CALLER" "$CALLEE" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        # The check that actually proves the demo, rather than proving four independent pods are
        # up: productpage's own rendered HTML has to carry content that can ONLY have come from
        # the other three teams' namespaces.
        #   "Shakespeare" / "paperback"  -> team-details answered           (productpage -> details)
        #   "Reviewer1" / "Reviewer2"    -> team-reviews answered           (productpage -> reviews)
        #   glyphicon-star               -> team-ratings answered           (reviews -> ratings)
        # The stars are the important one: reviews v3 renders them only when the ratings call
        # succeeded, and prints "Ratings service is currently unavailable" instead when it did
        # not -- which is exactly what a missing netpol, or an internal call routed through the
        # public HTTP->HTTPS redirect, looks like. An HTTP 200 alone proves none of this.
        PRODPAGE_TEAM=$(for S in {{.SEED_BOOKINFO_SERVICES}}; do
          case "$S" in productpage:*) printf '%s' "$S" | cut -d: -f2 ;; esac
        done)
        verify_bookinfo() {
          _url="https://{{.SEED_WORKLOAD_NAME}}-$PRODPAGE_TEAM.$DOMAIN/productpage"
          _tries=0
          while [ "$_tries" -lt 30 ]; do
            _body=$(curl -sk --max-time 20 "$_url" 2>/dev/null || true)
            _missing=""
            for _marker in Shakespeare paperback Reviewer1 Reviewer2 glyphicon-star; do
              printf '%s' "$_body" | grep -q "$_marker" || _missing="$_missing $_marker"
            done
            if [ -z "$_missing" ]; then
              echo "$_url renders details, reviews AND star ratings -- all four teams answered"
              return 0
            fi
            _tries=$((_tries + 1))
            echo "waiting for the full cross-team page at $_url (try $_tries/30, still missing:$_missing)..."
            sleep 10
          done
          echo "error: $_url never rendered the full cross-team page (still missing:$_missing)" >&2
          echo "       last response, first 600 bytes: $(printf '%s' "$_body" | head -c 600)" >&2
          return 1
        }
        apl_run seed-apps-verify-bookinfo \
          "Verifying the whole Bookinfo call chain end to end through productpage's rendered page" \
          verify_bookinfo || exit $?
        apl_ok "bookinfo demo verified end to end: https://{{.SEED_WORKLOAD_NAME}}-$PRODPAGE_TEAM.$DOMAIN/productpage"

  vikunja:
    desc: "Provision po/dev/agent in Vikunja via OIDC claim-driven team sync; po's project shared with the team"
    deps: [apps]
    cmds:
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        # Confirmed live 2026-08-28: Vikunja team membership comes from a Keycloak group
        # attribute read via a protocol mapper on the "otomi" client, aggregated onto every
        # member of that group -- NOT from us calling Vikunja's team/team-member API at all.
        # This is the claim-driven mechanism VIKUNJA.md Appendix B recorded as "rejected" for the
        # now-removed CONTINUOUS operator (rejected there for being pull-not-push and mutually
        # exclusive with API-managed membership -- neither concern applies to a one-shot script).
        apl_run seed-vikunja-mapper "Ensuring the vikunja-groups Keycloak protocol mapper exists" keycloak_ensure_vikunja_group_mapper || exit $?

        for TEAM in {{.SEED_TEAMS}}; do
          stamp_team() { keycloak_stamp_team_vikunja_group "$1" "Team $(printf '%s' "$1" | sed 's/./\U&/')"; }
          apl_run "seed-vikunja-stamp-$TEAM" "Stamping team-$TEAM's Keycloak group for Vikunja sync" stamp_team "$TEAM" || exit $?
        done
      - |
        . "{{.LIB}}"
        . "{{.SEED_LIB}}"
        KIND_CTX="{{.KIND_CONTEXT}}"
        DOMAIN=$(cat {{.STATE_DIR}}/seed_domain.txt)

        setup_team_vikunja() {
          set -euo pipefail
          _team=$1

          # po/dev/agent each need ONE real OIDC login: that is what both creates their Vikunja
          # account (OIDC-JIT-provisioned, same as Gitea) and syncs them into the claim-driven
          # team, all three as ordinary members (po belongs in the team too, alongside dev and
          # agent -- which is what makes the sync trivial: one Keycloak group, everyone already
          # in it from user creation, no special-casing per role).
          #
          # But only when they are not already members. Vikunja's OIDC callback carries a
          # hardcoded, non-configurable 10-requests-per-minute-per-IP limit, and through the
          # Istio mesh all six demo users share ONE bucket (see seed-lib.sh's
          # "Vikunja: rate-limit pacing" block). So the budget is treated as the scarce resource
          # it is: check membership over the AUTHENTICATED API (not rate-limited) and log a user
          # in only if that check says a sync is actually needed. A rerun of an
          # already-provisioned team therefore spends nothing at all, instead of burning six
          # logins to re-prove what is already true.
          #
          # The fixed sleeps that used to sit between logins here (8s within a team, 20s between
          # teams) are gone: they were guesswork against a budget nobody was actually counting,
          # and they could not see retries or adjacent teams. _vikunja_oidc_login_once now paces
          # itself against Vikunja's own X-RateLimit-* headers, which is exact.
          _po_email="po-$_team@$DOMAIN"
          _po_token=$(vikunja_login "$_po_email" "$(cat {{.STATE_DIR}}/seed_pw_${_team}_po.txt)")

          _team_id=$(vikunja_team_id_by_external_id "$_po_token" "kc-team-$_team")
          if [ -z "$_team_id" ]; then
            # A cached token can predate the Keycloak group stamp, and the team is only
            # created/updated during a real login -- so force one and look again.
            _po_token=$(vikunja_oidc_login "$_po_email" "$(cat {{.STATE_DIR}}/seed_pw_${_team}_po.txt)")
            vikunja_cache_token "$_po_email" "$_po_token"
            _team_id=$(vikunja_team_id_by_external_id "$_po_token" "kc-team-$_team")
          fi
          [ -n "$_team_id" ] || { echo "error: no Vikunja team with external_id kc-team-$_team even after a fresh po login -- is the vikunja-groups mapper/group attribute in place?" >&2; return 1; }

          _members=$(vikunja_team_members "$_po_token" "$_team_id")
          for _role in po dev agent; do
            _role_email="$_role-$_team@$DOMAIN"
            if printf '%s\n' "$_members" | grep -Fqx "$_role_email"; then
              echo "$_role_email is already in Vikunja team $_team_id -- no login needed"
              continue
            fi
            _role_token=$(vikunja_oidc_login "$_role_email" "$(cat {{.STATE_DIR}}/seed_pw_${_team}_${_role}.txt)")
            vikunja_cache_token "$_role_email" "$_role_token"
            if [ "$_role" = "po" ]; then _po_token=$_role_token; fi
            _members=$(vikunja_team_members "$_po_token" "$_team_id")
            printf '%s\n' "$_members" | grep -Fqx "$_role_email" \
              || { echo "error: $_role_email logged into Vikunja but did not land in team $_team_id -- claim sync did not fire" >&2; return 1; }
          done

          # Project owned by po (created with po's own token), titled "<team>-example" (not just
          # "<team>" -- the user asked for this explicitly), description links back to the one
          # Gitea repo this team owns: the Bookinfo microservice `apps` (the prior task) already
          # registered and built for it.
          _title="$_team-example"
          _repo=""
          for _bi_spec in {{.SEED_BOOKINFO_SERVICES}}; do
            if [ "$(printf '%s' "$_bi_spec" | cut -d: -f2)" = "$_team" ]; then
              _repo=$(printf '%s' "$_bi_spec" | cut -d: -f3)
            fi
          done
          if [ -n "$_repo" ]; then
            _description="Demo project for team $_team -- Bookinfo microservice: https://gitea.$DOMAIN/team-$_team/$_repo.git"
          else
            _description="Demo project for team $_team"
          fi
          # Rename-in-place if an OLDER run already created a project titled just "$_team" --
          # never creates a second, orphaned project under the new title alongside the old one.
          _project_id=$(vikunja_rename_project_if_needed "$_po_token" "$_team" "$_title" "$_description") \
            || _project_id=$(vikunja_create_project_if_missing "$_po_token" "$_title" "$_description")
          vikunja_share_with_team_if_missing "$_po_token" "$_project_id" "$_team_id" "{{.SEED_VIKUNJA_TEAM_PERMISSION}}"
        }

        # No inter-team sleep any more: the rate-limit budget is shared across teams, so spacing
        # teams apart by a fixed amount was never a bound on anything. _vikunja_oidc_login_once
        # paces every login against Vikunja's own reported budget instead, which covers logins
        # from adjacent teams and from retries alike.
        for TEAM in {{.SEED_TEAMS}}; do
          # Up to 3 tries total, backing off 10s between them. Everything in setup_team_vikunja
          # is idempotent and now membership-aware, so a retry re-does only what is still
          # missing rather than replaying every login.
          _vikunja_tries=0
          _vikunja_ok=false
          while [ "$_vikunja_tries" -lt 3 ]; do
            _vikunja_tries=$((_vikunja_tries + 1))
            if apl_run "seed-vikunja-$TEAM-try$_vikunja_tries" "Provisioning $TEAM in Vikunja (po/dev/agent logins, project, team share), try $_vikunja_tries/3" setup_team_vikunja "$TEAM"; then
              _vikunja_ok=true
              break
            fi
            [ "$_vikunja_tries" -lt 3 ] && sleep 10
          done
          [ "$_vikunja_ok" = "true" ] || { apl_fail "Vikunja provisioning for $TEAM failed after 3 tries -- see the logs above"; exit 1; }
        done
        apl_ok "vikunja provisioned for: {{.SEED_TEAMS}}"

  demo:
    desc: "Seed the demo: the four Bookinfo teams, three users each, one live microservice per team wired to the others, and Vikunja provisioning"
    deps: [vikunja]
    cmds:
      - |
        . "{{.LIB}}"
        apl_ok "demo seed complete -- teams, users, apps and Vikunja are up, credentials are in passwords.txt"
