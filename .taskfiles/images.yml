# Build + load every image the lab needs from local source. SETUP.md steps 5 and 5b.
#
# Output style: see .taskfiles/lib.sh. Docker build output in particular is captured rather than
# streamed by default -- BuildKit's per-line step timestamps plus apl-api's and apl-console's
# full jest suites are the single largest source of noise in a `task setup` run, and those suites
# log handled errors on the way to passing (CLAUDE.md), so on-screen they read as failures that
# aren't. Nothing is thrown away: it all lands in .taskfiles/state/logs/, and on a real failure
# the tail of it is printed inline.
version: '3'
silent: true

tasks:
  build-operator:
    desc: "Build the operator image from a clean git-tracked-only context"
    cmds:
      - |
        . "{{.LIB}}"
        set -euo pipefail
        mkdir -p {{.STATE_DIR}}
        # APPS_REVISION is what Argo CD fetches charts/* at -- it must already be pushed, or every
        # Argo CD Application fails "unable to resolve to a commit SHA" while the operator's own
        # install still reports completed (see SETUP.md step 5's "Which repository, and which
        # revision" section). Catching this here beats catching it 15 minutes into an install.
        # Deliberately not wrapped: it is a precondition check whose output is signal, not noise.
        APPS_REVISION=$(git rev-parse HEAD)
        echo -n "$APPS_REVISION" > {{.STATE_DIR}}/apps_revision.txt
        if ! git branch -r --contains "$APPS_REVISION" | grep -q .; then
          apl_fail "HEAD ($APPS_REVISION) is not pushed to any remote branch -- Argo CD will not find it."
          apl_fail "Push this commit first, or every Application will fail to sync."
          exit 1
        fi
        apl_info "apps: {{.APPS_REPO_URL}} @ $APPS_REVISION"
      - |
        . "{{.LIB}}"
        build() {
          set -euo pipefail
          # Build from a clean context, never the working directory: `docker build .` copies the
          # whole tree, and .git/info/exclude does not apply to Docker -- so the image would be
          # built from whatever is lying around locally. Exporting only git-tracked files builds
          # exactly what a fresh clone would.
          CTX=$(mktemp -d)
          git ls-files -z | tar --null -T - -c | tar -x -C "$CTX"
          APPS_REVISION=$(cat {{.STATE_DIR}}/apps_revision.txt)
          # Opt-out: tests skipped by default (SKIP_TESTS=true) for setup speed -- the Dockerfile's
          # `npm run test:ci` step can't cache across code changes and is a large share of this
          # image's build time. RUN_OPERATOR_TESTS=true task setup flips SKIP_TESTS=false to run
          # them, e.g. before a PR or when actually working on the operator.
          if [ "${RUN_OPERATOR_TESTS:-false}" = "true" ]; then
            SKIP_TESTS=false
          else
            SKIP_TESTS=true
          fi
          docker build --build-arg VERSION={{.OPERATOR_VERSION}} \
                       --build-arg APPS_REVISION="$APPS_REVISION" \
                       --build-arg APPS_REPO_URL="{{.APPS_REPO_URL}}" \
                       --build-arg SKIP_TESTS="$SKIP_TESTS" \
                       -t {{.OPERATOR_IMAGE}} "$CTX"
          rm -rf "$CTX"
          # Never trust docker build's exit code through anything, and never trust it blindly even
          # un-piped -- verify the artifact landed. Inside the same shell as the build so the
          # check, not an echo, is what decides this step's status.
          docker images {{.OPERATOR_IMAGE}}
          docker image inspect {{.OPERATOR_IMAGE}} >/dev/null 2>&1 \
            || { echo "error: {{.OPERATOR_IMAGE}} was not produced -- check the build log above" >&2; exit 1; }
        }
        apl_run build-operator "Building operator image {{.OPERATOR_IMAGE}}" build || exit $?

  build-api:
    desc: "Clone apl-api, apply the vikunja+turnstone+bugfix patches, sync the schema, build"
    cmds:
      - |
        . "{{.LIB}}"
        prep() {
          set -euo pipefail
          rm -rf {{.API_CLONE_DIR}}
          git clone --depth 1 https://github.com/linode/apl-api.git {{.API_CLONE_DIR}}
          # Order matters: the turnstone patch has `- vikunja` in its context lines, i.e. it
          # assumes the vikunja patch already applied. Both are needed regardless of which apps
          # are enabled -- there is one apl-api image for the whole platform.
          # `git -C <dir> apply <patch>` resolves <patch> relative to <dir>, not to $PWD -- -C
          # changes cwd for the whole git invocation, same as `cd <dir> && git apply <patch>`
          # would. A bare relative path here (`vikunja-patches/apl-api.patch`) fails with "can't
          # open patch ... No such file or directory" even though the file exists relative to the
          # repo root. Capture $PWD into an absolute path first.
          REPO_ROOT="$PWD"
          git -C {{.API_CLONE_DIR}} apply "$REPO_ROOT/vikunja-patches/apl-api.patch"
          git -C {{.API_CLONE_DIR}} apply "$REPO_ROOT/turnstone-patches/apl-api.patch"
          grep -qE '^\s+- turnstone$' {{.API_CLONE_DIR}}/src/openapi/app.yaml \
            || { echo "error: AppList missing turnstone after patching -- no tile will render" >&2; exit 1; }
          # Unrelated file (src/otomi-stack.ts, not app.yaml), so it doesn't need to go after the
          # other two for conflict reasons -- kept last to match this task's own comment order.
          # See bugfix-patches/README.md: fixes DELETE /v1/users/{id} 500ing for ~62.5% of users
          # (a server-generated uuidv4 id starting with a digit fails an internal slug-name
          # validator that should never have applied to a UUID).
          git -C {{.API_CLONE_DIR}} apply "$REPO_ROOT/bugfix-patches/apl-api.patch"
          grep -q 'NOTE(apl-core fork)' {{.API_CLONE_DIR}}/src/otomi-stack.ts \
            || { echo "error: bugfix patch did not apply to otomi-stack.ts" >&2; exit 1; }
        }
        # apl_run_sub, not apl_run: this is work done to make the apl-api image buildable, not an
        # image going up, so it must not consume a slot in build-all's [k/N] counter. Still
        # captured, still individually labelled and logged if it fails.
        apl_run_sub api-prepare "Cloning apl-api and applying the vikunja+turnstone patches" prep || exit $?
      - |
        . "{{.LIB}}"
        schema() {
          set -euo pipefail
          # This machine's host Node can be broken (see CLAUDE.md "Do not run npm on the host") --
          # npm always runs inside the toolchain container instead, even for a script that's just
          # a cp. Bakes in THIS repo's values-schema.yaml; without it the Console renders an EMPTY
          # settings form for any app added by a patch (e.g. Turnstone's anthropicApiKey field).
          docker run --rm --user "$(id -u):$(id -g)" \
            -v {{.API_CLONE_DIR}}:/w -v "$PWD":/core:ro -w /w -e APL_CORE_PATH=/core \
            {{.APL_TOOLS_IMAGE}} npm run schema:sync
          diff -q values-schema.yaml {{.API_CLONE_DIR}}/src/values-schema.yaml
        }
        apl_run_sub api-schema "Syncing values-schema.yaml into apl-api" schema || exit $?
      - |
        . "{{.LIB}}"
        build() {
          set -euo pipefail
          docker build -t {{.API_IMAGE}} {{.API_CLONE_DIR}}
          docker images {{.API_IMAGE}}
          docker image inspect {{.API_IMAGE}} >/dev/null 2>&1 \
            || { echo "error: {{.API_IMAGE}} was not produced" >&2; exit 1; }
        }
        apl_run build-api "Building {{.API_IMAGE}}" build || exit $?

  build-console:
    desc: "Clone apl-console, drop in the vikunja+turnstone tile logos, build"
    cmds:
      - |
        . "{{.LIB}}"
        prep() {
          set -euo pipefail
          rm -rf {{.CONSOLE_CLONE_DIR}}
          git clone --depth 1 https://github.com/linode/apl-console.git {{.CONSOLE_CLONE_DIR}}
          cp vikunja-patches/apl-console/public/logos/vikunja_logo.svg {{.CONSOLE_CLONE_DIR}}/public/logos/
          cp turnstone-patches/apl-console/public/logos/turnstone_logo.svg {{.CONSOLE_CLONE_DIR}}/public/logos/
        }
        # Uncounted for the same reason as api-prepare above -- see .taskfiles/lib.sh.
        apl_run_sub console-prepare "Cloning apl-console and adding the tile logos" prep || exit $?
      - |
        . "{{.LIB}}"
        build() {
          set -euo pipefail
          docker build -t {{.CONSOLE_IMAGE}} {{.CONSOLE_CLONE_DIR}}
          docker images {{.CONSOLE_IMAGE}}
          docker image inspect {{.CONSOLE_IMAGE}} >/dev/null 2>&1 \
            || { echo "error: {{.CONSOLE_IMAGE}} was not produced" >&2; exit 1; }
        }
        apl_run build-console "Building {{.CONSOLE_IMAGE}}" build || exit $?

  build-vikunja-mcp:
    desc: "Build the vikunja-mcp sidecar image (only if VIKUNJA_ENABLED)"
    cmds:
      - |
        . "{{.LIB}}"
        if [ "${VIKUNJA_ENABLED:-true}" != "true" ]; then
          apl_skip "VIKUNJA_ENABLED=${VIKUNJA_ENABLED:-true} -- skipping the vikunja-mcp build"
          exit 0
        fi
        build() {
          set -euo pipefail
          docker build -t {{.VIKUNJA_MCP_IMAGE}} ./vikunja-mcp
          docker images {{.VIKUNJA_MCP_IMAGE}}
          docker image inspect {{.VIKUNJA_MCP_IMAGE}} >/dev/null 2>&1 \
            || { echo "error: {{.VIKUNJA_MCP_IMAGE}} was not produced" >&2; exit 1; }
        }
        apl_run build-vikunja-mcp "Building {{.VIKUNJA_MCP_IMAGE}}" build || exit $?

  build-all:
    desc: "Build every image the lab needs"
    cmds:
      # The "[k/N]" prefixes below come from this counter. N is derived here from the toggles
      # that are actually set for this run -- never a literal, for the same reason
      # install:watch-argocd recomputes its own TOTAL from the live cluster every poll.
      #
      # N counts IMAGES, and so does k: only the four (three without vikunja-mcp) "build this
      # image" steps call apl_run. The clone/patch/schema-sync work each build needs first goes
      # through apl_run_sub, which is captured and labelled identically but uncounted. When
      # those advanced the counter too, a 4-image run printed [7/4].
      - |
        . "{{.LIB}}"
        apl_header "Images"
        IMAGES="operator api console"
        [ "${VIKUNJA_ENABLED:-true}" = "true" ] && IMAGES="$IMAGES vikunja-mcp"
        N=$(printf '%s\n' $IMAGES | wc -l)
        apl_info "building $N image(s):$(printf ' %s' $IMAGES)"
        apl_progress_begin "$N"
      - task: build-operator
      - task: build-api
      - task: build-console
      - task: build-vikunja-mcp
      - |
        . "{{.LIB}}"
        apl_progress_end
        apl_ok "all images built"

  load-all:
    desc: "Load every built image into the kind cluster"
    # Same root cause as install:watch's `interactive: true` (see its comment): this whole task
    # is ONE script block (the header print + the entire loop below), and Taskfile.yml's
    # top-level `output: group` buffers a block's output until it exits -- so nothing printed,
    # not even the "Loading images into kind" header, until every image finished loading
    # (~60-70s of apparent silence, confirmed live). `interactive: true` exempts it from grouping.
    interactive: true
    cmds:
      - |
        . "{{.LIB}}"
        apl_header "Loading images into kind"
        IMAGES="{{.OPERATOR_IMAGE}} {{.API_IMAGE}} {{.CONSOLE_IMAGE}}"
        [ "${VIKUNJA_ENABLED:-true}" = "true" ] && IMAGES="$IMAGES {{.VIKUNJA_MCP_IMAGE}}"
        N=$(printf '%s\n' $IMAGES | wc -l)
        apl_progress_begin "$N"
        rc=0
        for img in $IMAGES; do
          slug=$(printf '%s' "$img" | tr '/:.' '---')
          load() { set -eu; kind load docker-image "$1" --name {{.CLUSTER_NAME}}; }
          apl_run "load-$slug" "Loading $img" load "$img" || rc=$?
          [ "$rc" -eq 0 ] || break
        done
        apl_progress_end
        [ "$rc" -eq 0 ] || exit $rc
        apl_ok "all images loaded into '{{.CLUSTER_NAME}}'"
