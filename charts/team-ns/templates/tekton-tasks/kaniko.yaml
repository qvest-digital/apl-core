
{{- $v := .Values }}
{{- if $v.apps.tekton.enabled }}
{{- $t := .Values.teamApps.tekton }}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko
  labels:
    app.kubernetes.io/version: "0.6"
  annotations:
    # ArgoCD sync wave annotation to ensure it's applied first
    argocd.argoproj.io/sync-wave: "-5"
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/categories: Image Build
    tekton.dev/tags: image-build
    tekton.dev/displayName: "Build and upload container image using Kaniko"
    tekton.dev/platforms: "linux/amd64,linux/arm64,linux/ppc64le"
spec:
  stepTemplate:
    computeResources:
      # fork: minimal requests + NO limits so build pods always schedule on the single-node lab
      # and can burst freely. Overrides the operator's $t.resources.kanikoTask (was 500m/512Mi).
      requests:
        cpu: 1m
        memory: 8Mi
  description: >-
    This Task builds a simple Dockerfile with kaniko and pushes to a registry.
    This Task stores the image name and digest as results, allowing Tekton Chains to pick up
    that an image was built & sign it.
  params:
    - name: IMAGE
      description: Name (reference) of the image to build.
      type: string
    - name: DOCKERFILE
      description: Path to the Dockerfile to build.
      default: ./Dockerfile
      type: string
    - name: CONTEXT
      description: The build context used by Kaniko.
      default: ./
      type: string
    - name: EXTRA_ARGS
      type: array
      default: []
    - name: BUILDER_IMAGE
      # Bumped from v1.5.1 (released 2021-02-23, unbumped by upstream since this file was
      # added in 2023) to v1.23.2 -- confirmed live 2026-08-29: v1.5.1 has no --ignore-path
      # flag at all ("unknown flag: --ignore-path"), which is mandatory for any multi-stage
      # Dockerfile on this kind cluster (see the EXTRA_ARGS comment above, and
      # github.com/GoogleContainerTools/kaniko/issues/2164). v1.23.2 was verified end-to-end
      # against a real multi-stage build (Istio Bookinfo's `reviews` service) on this exact
      # cluster before this bump landed -- see CLAUDE.md and UPSTREAM-SYNC.md §4b.
      description: The image on which builds will run (default is v1.23.2)
      {{- if $v.linodeLkeImageRepository }}
      default: "{{- $v.linodeLkeImageRepository }}/gcr/kaniko-project/executor:v1.23.2@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f"
      {{- else }}
      default: gcr.io/kaniko-project/executor:v1.23.2@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f
      {{- end }}
      type: string
  workspaces:
    - name: source
      description: Holds the context and Dockerfile
    - name: dockerconfig
      description: Includes a docker `config.json`
      optional: true
      mountPath: /kaniko/.docker
  results:
    - name: IMAGE_DIGEST
      description: Digest of the image just built.
      type: string
    - name: IMAGE_URL
      description: URL of the image just built.
      type: string

  steps:
    - name: build-and-push
      computeResources: {}
      workingDir: $(workspaces.source.path)
      image: $(params.BUILDER_IMAGE)
      args:
        - $(params.EXTRA_ARGS)
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(workspaces.source.path)/$(params.CONTEXT) # The user does not need to care the workspace and the source.
        - --destination=$(params.IMAGE)
        - --digest-file=$(results.IMAGE_DIGEST.path)
      # kaniko assumes it is running as root, which means this example fails on platforms
      # that default to run containers as random uid (like OpenShift). Adding this securityContext
      # makes it explicit that it needs to run as root.
      securityContext:
        runAsUser: 0
    - name: write-url
      computeResources: {}
      {{- if $v.linodeLkeImageRepository }}
      image: "{{- $v.linodeLkeImageRepository }}/docker/bash:5.2@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324"
      {{- else }}
      image: docker.io/library/bash:5.2@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324
      {{- end }}
      script: |
        set -e
        image="$(params.IMAGE)"
        echo -n "${image}" | tee "$(results.IMAGE_URL.path)"
{{- end }}
