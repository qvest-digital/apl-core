apiVersion: v1
kind: LimitRange
metadata:
  name: team-ns-resource-defaults
  labels: {{- include "team-ns.chart-labels" . | nindent 4 }}
spec:
  limits:
  - defaultRequest: # fork: near-zero default requests so pods that don't specify barely reserve
      cpu: 1m       # anything and always schedule on the single-node lab (no default limits set,
      memory: 4Mi   # so containers can burst freely up to node capacity).
    type: Container
