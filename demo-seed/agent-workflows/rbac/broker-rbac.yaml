# Cross-namespace grants for the admin node-broker (sa-team-admin / tekton-triggers-team-admin).
# The team-side grant (read the team's own agent-creds) is created by the dev-agent chart;
# these two are the platform-namespace grants the seed applies directly, since a single workload
# Application only deploys into one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-node-broker, namespace: turnstone}
rules:
  - {apiGroups: ["apps"], resources: ["deployments"], verbs: ["create","get","list","watch","delete","patch"]}
  # configmaps: the provision dedupe lease (dev-lease-<team>-tk<n>) is an atomic ConfigMap create.
  - {apiGroups: [""], resources: ["services","secrets","configmaps"], verbs: ["create","get","list","watch","delete","update","patch"]}
  - {apiGroups: [""], resources: ["pods"], verbs: ["get","list","watch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: agent-node-broker-admin, namespace: turnstone}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-node-broker}
subjects:
  - {kind: ServiceAccount, name: sa-team-admin, namespace: team-admin}
  - {kind: ServiceAccount, name: tekton-triggers-team-admin, namespace: team-admin}
---
# Read only the Loki tenant-password secret in monitoring (the logs credential the broker injects).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: broker-read-loki-auth, namespace: monitoring}
rules:
  - {apiGroups: [""], resources: ["secrets"], resourceNames: ["reverse-proxy-auth-config"], verbs: ["get"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: broker-read-loki-auth, namespace: monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: broker-read-loki-auth}
subjects:
  - {kind: ServiceAccount, name: sa-team-admin, namespace: team-admin}
  - {kind: ServiceAccount, name: tekton-triggers-team-admin, namespace: team-admin}
---
# Read only the oauth2-proxy client secret in istio-system -- the broker needs its client-id/secret
# to run the OIDC password grant that mints a team apl-api token (as agent-<team>), the same grant
# the seed's dev_team_token uses, to create the per-PR preview objects (build/workload/service).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: broker-read-oauth2-client, namespace: istio-system}
rules:
  - {apiGroups: [""], resources: ["secrets"], resourceNames: ["oauth2-proxy-client-access"], verbs: ["get"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: broker-read-oauth2-client, namespace: istio-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: broker-read-oauth2-client}
subjects:
  - {kind: ServiceAccount, name: sa-team-admin, namespace: team-admin}
  - {kind: ServiceAccount, name: tekton-triggers-team-admin, namespace: team-admin}
