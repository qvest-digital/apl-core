# Ask the admin node-broker to provision this team's STANDING review node (the node the coach's
# workstreams run on, and that the PO desk UI opens). We reuse the broker rather than creating the
# node here: only the broker (team-admin) holds the cross-namespace RBAC to build a node in the
# turnstone namespace off turnstone-server + the team's baked ci-runner image. Fire-and-forget: the
# broker runs provision-review-node async; the node appears shortly after. Idempotent -- the
# pipeline reconciles the one Deployment, so re-syncs are safe.
#
# PostSync so it runs after the coach EventListener/webhook are in place. hook-succeeded delete keeps
# the namespace clean; the Job only pings the broker, it does not own the node.
apiVersion: batch/v1
kind: Job
metadata:
  name: po-desk-provision-review
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
        - name: ping-broker
          image: curlimages/curl:8.7.1
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              TEAM="${NS#team-}"
              BODY=$(printf '{"action":"provision-review","team":"%s","repos":"%s","nodeImage":""}' "$TEAM" "$REPOS")
              echo "requesting review node for team=$TEAM repos=$REPOS"
              curl -sf --retry 5 --retry-connrefused --max-time 30 \
                -X POST -H 'Content-Type: application/json' -d "$BODY" \
                http://el-node-broker.team-admin.svc.cluster.local:8080
              echo
              echo "broker pinged -- the review node ($TEAM-review-agent) will come up in the turnstone namespace shortly"
          env:
            - name: NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPOS
              value: "{{ .Values.repos }}"
