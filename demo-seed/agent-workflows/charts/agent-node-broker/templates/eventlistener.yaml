apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: node-broker
spec:
  params:
    - {name: team,    value: $(body.team)}
    - {name: pr,      value: $(body.pr)}
    - {name: branch,  value: $(body.branch)}
    - {name: sha,     value: $(body.sha)}
    - {name: repoFullName, value: $(body.repoFullName)}
    - {name: nodeImage, value: $(body.nodeImage)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: node-broker-provision
spec:
  params: [{name: team}, {name: pr}, {name: branch}, {name: sha}, {name: repoFullName}, {name: nodeImage}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: provision-node-$(tt.params.team)-pr$(tt.params.pr)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        serviceAccountName: sa-team-admin
        pipelineRef: {name: provision-agent-node}
        params:
          - {name: team,    value: $(tt.params.team)}
          - {name: pr,      value: $(tt.params.pr)}
          - {name: branch,  value: $(tt.params.branch)}
          - {name: sha,     value: $(tt.params.sha)}
          - {name: repoFullName, value: $(tt.params.repoFullName)}
          - {name: nodeImage, value: $(tt.params.nodeImage)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: node-broker-teardown
spec:
  params: [{name: team}, {name: pr}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: teardown-node-$(tt.params.team)-pr$(tt.params.pr)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        serviceAccountName: sa-team-admin
        pipelineRef: {name: teardown-agent-node}
        params:
          - {name: team, value: $(tt.params.team)}
          - {name: pr,   value: $(tt.params.pr)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: node-broker-review
spec:
  params:
    - {name: team,      value: $(body.team)}
    - {name: repos,     value: $(body.repos)}
    - {name: nodeImage, value: $(body.nodeImage)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: node-broker-provision-review
spec:
  params: [{name: team}, {name: repos}, {name: nodeImage}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: provision-review-$(tt.params.team)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        serviceAccountName: sa-team-admin
        pipelineRef: {name: provision-review-node}
        params:
          - {name: team,      value: $(tt.params.team)}
          - {name: repos,     value: $(tt.params.repos)}
          - {name: nodeImage, value: $(tt.params.nodeImage)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: node-broker
spec:
  serviceAccountName: tekton-triggers-team-admin
  triggers:
    - name: provision
      interceptors:
        - ref: {name: cel}
          params: [{name: filter, value: "body.action == 'provision'"}]
      bindings: [{ref: node-broker}]
      template: {ref: node-broker-provision}
    - name: teardown
      interceptors:
        - ref: {name: cel}
          params: [{name: filter, value: "body.action == 'teardown'"}]
      bindings: [{ref: node-broker}]
      template: {ref: node-broker-teardown}
    - name: provision-review
      interceptors:
        - ref: {name: cel}
          params: [{name: filter, value: "body.action == 'provision-review'"}]
      bindings: [{ref: node-broker-review}]
      template: {ref: node-broker-provision-review}
    - name: provision-dev
      interceptors:
        - ref: {name: cel}
          params: [{name: filter, value: "body.action == 'provision-dev'"}]
      bindings: [{ref: node-broker-dev}]
      template: {ref: node-broker-provision-dev}
    - name: teardown-dev
      interceptors:
        - ref: {name: cel}
          params: [{name: filter, value: "body.action == 'teardown-dev'"}]
      bindings: [{ref: node-broker-teardown-dev}]
      template: {ref: node-broker-teardown-dev}
    - name: rework-dev
      interceptors:
        - ref: {name: cel}
          params: [{name: filter, value: "body.action == 'rework'"}]
      bindings: [{ref: node-broker-rework}]
      template: {ref: node-broker-rework}
---
# ---- Development bot (ticket-driven) bindings + templates ----
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: node-broker-dev
spec:
  params:
    - {name: team,            value: $(body.team)}
    - {name: ticket,          value: $(body.ticket)}
    - {name: repoFullName,    value: $(body.repoFullName)}
    - {name: assignedToAgent, value: $(body.assignedToAgent)}
---
# teardown uses its OWN binding WITHOUT assignedToAgent: teardown-dev is forwarded from several
# places (reconcile, complete-ticket on PR-merge, a manual POST) and not all of them carry the
# assignee. A TriggerBinding hard-fails the whole trigger if a referenced $(body.x) is absent, so
# reusing node-broker-dev here made a merge-triggered teardown die with "assignedToAgent is not
# found". Teardown never needs the assignee anyway.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: node-broker-teardown-dev
spec:
  params:
    - {name: team,         value: $(body.team)}
    - {name: ticket,       value: $(body.ticket)}
    - {name: repoFullName, value: $(body.repoFullName)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: node-broker-rework
spec:
  params:
    - {name: team,    value: $(body.team)}
    - {name: ticket,  value: $(body.ticket)}
    - {name: comment, value: $(body.comment)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: node-broker-provision-dev
spec:
  params: [{name: team}, {name: ticket}, {name: repoFullName}, {name: assignedToAgent, default: "false"}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: provision-dev-$(tt.params.team)-tk$(tt.params.ticket)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        serviceAccountName: sa-team-admin
        pipelineRef: {name: provision-dev-env}
        params:
          - {name: team,            value: $(tt.params.team)}
          - {name: ticket,          value: $(tt.params.ticket)}
          - {name: repoFullName,    value: $(tt.params.repoFullName)}
          - {name: assignedToAgent, value: $(tt.params.assignedToAgent)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: node-broker-teardown-dev
spec:
  params: [{name: team}, {name: ticket}, {name: repoFullName}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: teardown-dev-$(tt.params.team)-tk$(tt.params.ticket)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        serviceAccountName: sa-team-admin
        pipelineRef: {name: teardown-dev-env}
        params:
          - {name: team,         value: $(tt.params.team)}
          - {name: ticket,       value: $(tt.params.ticket)}
          - {name: repoFullName, value: $(tt.params.repoFullName)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: node-broker-rework
spec:
  params: [{name: team}, {name: ticket}, {name: comment}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: rework-dev-$(tt.params.team)-tk$(tt.params.ticket)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        serviceAccountName: sa-team-admin
        pipelineRef: {name: rework-dev}
        params:
          - {name: team,    value: $(tt.params.team)}
          - {name: ticket,  value: $(tt.params.ticket)}
          - {name: comment, value: $(tt.params.comment)}
