apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: pr-agent-pr
spec:
  params:
    - {name: pr,      value: $(body.number)}
    - {name: branch,  value: $(body.pull_request.head.ref)}
    - {name: sha,     value: $(body.pull_request.head.sha)}
    - {name: repoFullName, value: $(body.repository.full_name)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: pr-agent-provision
spec:
  params: [{name: pr}, {name: branch}, {name: sha}, {name: repoFullName}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: pr-agent-provision-$(tt.params.pr)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        pipelineRef: {name: pr-agent-forward}
        params:
          - {name: action,  value: provision}
          - {name: pr,      value: $(tt.params.pr)}
          - {name: branch,  value: $(tt.params.branch)}
          - {name: sha,     value: $(tt.params.sha)}
          - {name: repoFullName, value: $(tt.params.repoFullName)}
          - {name: nodeImage, value: "{{ .Values.nodeImage | default "" }}"}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: pr-agent-teardown
spec:
  params: [{name: pr}, {name: branch}, {name: sha}, {name: repoFullName}]
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: pr-agent-teardown-$(tt.params.pr)-
        labels: {sidecar.istio.io/inject: "false"}
      spec:
        pipelineRef: {name: pr-agent-forward}
        params:
          - {name: action,  value: teardown}
          - {name: pr,      value: $(tt.params.pr)}
          - {name: branch,  value: $(tt.params.branch)}
          - {name: sha,     value: $(tt.params.sha)}
          - {name: repoFullName, value: $(tt.params.repoFullName)}
          - {name: nodeImage, value: "{{ .Values.nodeImage | default "" }}"}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pr-agent
spec:
  serviceAccountName: tekton-triggers-{{ .Release.Namespace }}
  triggers:
    - name: pr-opened
      interceptors:
        - ref: {name: cel}
          params:
            - name: filter
              value: >-
                header.match('X-Gitea-Event','pull_request') &&
                (body.action == 'opened' || body.action == 'reopened')
      bindings: [{ref: pr-agent-pr}]
      template: {ref: pr-agent-provision}
    - name: pr-closed
      interceptors:
        - ref: {name: cel}
          params:
            - name: filter
              value: >-
                header.match('X-Gitea-Event','pull_request') && body.action == 'closed'
      bindings: [{ref: pr-agent-pr}]
      template: {ref: pr-agent-teardown}
