# Lets the admin node-broker read THIS team's agent credential (only the 'agent-creds' secret),
# so it can inject it into the ephemeral node it creates in the turnstone namespace. Scoped by
# resourceName -- the broker cannot read any other secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broker-read-agent-creds
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agent-creds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-read-agent-creds
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: broker-read-agent-creds
subjects:
  - {kind: ServiceAccount, name: sa-team-admin, namespace: team-admin}
  - {kind: ServiceAccount, name: tekton-triggers-team-admin, namespace: team-admin}
